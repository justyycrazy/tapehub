[project]
name = "tapehub"
version = "0.1.0"
description = "通用行情数据网关：统一 REST API，通过适配器接入多个行情数据源（第一版仅历史 K 线查询）"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    # anyio：providers.base.call_in_thread 直接使用 to_thread.run_sync
    # （>=4 为 abandon_on_cancel 参数命名），其余经 fastapi/starlette 传递
    "anyio>=4.0",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.1",
    # ZoneInfo("Asia/Shanghai") 在 Windows（无系统 zoneinfo 数据库）上依赖 tzdata 包
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Provider SDK 均为可选依赖：未安装不影响服务启动（对应 Provider 返回明确错误）
akshare = ["akshare>=1.14"]
# 以下三家：官方文档未标注版本下限，下界取 uv.lock 实证锁定版（2026-11，
# 客户端生命周期与响应结构按该版源码实证，见 docs/providers/<name>.md）；
# 升级需契约测试回归后放宽
tickflow = ["tickflow>=0.1.25"]
alphafeed = ["alphafeed>=0.1.4"]
tushare = ["tushare>=1.4.29"]
# baostock（证券宝）：免费无凭据数据平台；>=0.9.3 为多节点与 ETF 数据版本
baostock = ["baostock>=0.9.3"]
# tqsdk：shared Runtime 依赖私有协议属性（_pending_peek 门闩复位，见
# runtime.py）与实测推送行为——升级可能静默破坏，钉住已实证版本区间
# （3.10.4 实测；升级需探针轮验证推送行为后放宽上限）
tqsdk = ["tqsdk>=3.10,<4"]
# websockets：实时快照/快照流 WS 直连（td.websocket 封装不适配共享连接
# 动态增删）；>=14 为新 asyncio 实现（websockets.connect 别名）。
# twelvedata>=1.4.0 为 uv.lock 实证下界（REST 客户端生命周期按该版源码
# 实证，见 docs/providers/twelvedata.md）
twelvedata = ["twelvedata>=1.4.0", "websockets>=14"]
# Tiingo 无官方 Python SDK：REST 历史 K 线用 httpx2 同步客户端直连
# （call_in_thread 隔离），WS 快照/流复用 websockets 直连（同 twelvedata）
tiingo = ["httpx2>=2.16", "websockets>=14"]
# 同花顺金融数据 API（ths）无官方 Python SDK：REST 用 httpx2 同步客户端直连
# （call_in_thread 隔离），X-api-key 请求头认证
ths = ["httpx2>=2.16"]
# 富途 OpenAPI HTTP 直连（futunn）无官方 Python SDK：REST 用 httpx2 同步客户端
# 直连（call_in_thread 隔离），AppKey 签名认证经 cryptography 做本地私钥
# 签名（Ed25519 / RSA-SHA256 PKCS#1 v1.5，两种算法都由该库提供）
futunn = ["httpx2>=2.16", "cryptography>=42"]

[dependency-groups]
dev = [
    # httpx2：三 Provider REST 直连（extras 同名依赖）+ starlette.testclient
    # （fastapi TestClient 底座，1.x 已迁移 httpx2 引擎）共用
    "httpx2>=2.16",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapehub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "probes"]

[tool.ruff.lint]
select = ["E", "F", "I"]
