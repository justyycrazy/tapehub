[project]
name = "tapehub"
version = "0.1.0"
description = "通用行情数据网关：统一 REST API，通过适配器接入多个行情数据源（第一版仅历史 K 线查询）"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Provider SDK 均为可选依赖：未安装不影响服务启动（对应 Provider 返回明确错误）
akshare = ["akshare>=1.14"]
# 版本未在官方文档中标注下限，使用 PyPI 最新版
tickflow = ["tickflow"]
alphafeed = ["alphafeed"]
tushare = ["tushare"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapehub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
