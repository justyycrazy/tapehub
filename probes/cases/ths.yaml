# 同花顺金融数据 API（ths）数据探针：历史 K 线可用性、复权生效性、历史深度
# 收敛，快照/分时形态观察（量额口径核实），及 ETF 复权口径实证（2026-11-14
# 加入：fund historical 无 adjust 参数但文档称「价格数据采用前复权口径」，
# 与现声明 [none] 的口径一致性待受控对比实证，见 raw 段注释）；第三轮
# （2026-11-14）立项：隐式截断与 offset 分页边界、期货交易所后缀与已摘牌
# 合约可查性、北交所价格端点（见 chain/raw 段注释与 notes 立项段）。
#
# 上游限频为「约定 QPS」（超限信封 code=4001），具体 QPS 未公布：pacing 2 秒
# （≤0.5 QPS）保守起步，探针报告中观察 4001 出现情况后收紧。
probe: ths
version: 1

requires:
  # ths 无官方 Python SDK：raw case 反射 httpx 直连（pyproject 可选依赖组名
  # 亦为 ths，由 uv sync --extra ths 提供 httpx）
  extras: [httpx]
  env: [TAPEHUB_THS_API_KEY]

pacing:
  # 2 秒（2026-11-13 第二轮实验后回收）：5 秒间隔无法规避 option 日 K 失败
  # ——根因已定位为 start=2026-10-01 单一日期触发上游 5003（邻近起点
  # 09-27/10-02/10-09/11-01 全部正常，与调用频率无关），见 notes 第二轮；
  # 4001 限频两轮 + 目录外诊断均未复现
  call_interval_s: 2.0
  timeout_s: 60
  # 本轮构成（2026-11-14 第三轮立项后）：availability 12（bars 7：stock
  # 三复权 + index + etf + contract + option，quotes 5）+ adjust_diff 4
  # （stock 1 目标 × 2 pair × 2 调）+ history_depth 3 case × 最坏 12 +
  # limit_truncation ≈2 + raw 15 case 各 3 调（client + get + json），
  # 最坏约 100，预算 130 留余量（约 6 分钟）
  max_calls: 130

targets:
  stock:
    instrument: CN-SSE-600519
    window: {start: 2025-01-01, end: 2025-12-31}
    # 仅日线声明：一年约 244 根，10 为保守下限
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index:
    instrument: CN-SSE-000001
    # 上证综指（标准交易所指数；同花顺板块/行业 TI 类指数不在本期声明）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf:
    instrument: CN-SSE-510300
    # 沪深300ETF（官方文档示例标的；仅 ETF，LOF/场外/REITs 上游返回 3004）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  contract:
    instrument: CN-SHFE-CU2706
    # 铜期货合约（文档示例 CU2601.SHF 已到期）：SHFE→SHF 为唯一文档实证
    # 后缀。合约会到期：运行前按上期所挂牌信息核对，失败如实记录，到期
    # 轮换为当时的现活合约
    window: {start: 2026-08-01, end: 2026-11-30}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  option:
    instrument: CN-CFFEX-IO2612-C-4000
    # 沪深300期权（文档示例 IO2601-C-4000.CFE 已到期）：CFFEX→CFE 为唯一
    # 文档实证后缀。月度合约会到期：运行前按中金所挂牌信息核对（行权价
    # 4000 需在挂牌行权价序列内），失败如实记录，到期轮换为现活合约。
    # 窗口起点避开 2026-10-01（2026-11-13 第二轮实证：该单一日期触发
    # 上游 5003 'daily quote unavailable'，邻近起点均正常，见 notes）
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 5
    required_fields: [open, high, low, close, volume, amount]

chain:
  include_declared: true
  skip: []
  # stock 为唯一多复权资产（none/qfq/hfq）：对比不复权与前复权、不复权与
  # 后复权的收盘价序列（分红送股窗口应有差异）
  adjust_diff:
    targets: [stock]
    window: {start: 2024-01-01, end: 2025-12-31}
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
    intervals: [P1D]
  # 历史覆盖全部保持 null（文档未公布）：P1D 先行二分收敛；仅对证券类
  # 目标做 depth——期货/期权合约生命周期有限（到期归档），「最早可用」
  # 语义随合约轮换漂移，不做回溯（待 continuous 主连纳入声明后再议）。
  # earliest 折中取 2022-01-01（2026-11-13 首轮实证：指数端点越界窗口
  # 1003 拒绝且实测口径为「recent five years only」滚动 5 年、ETF 同为
  # 约 5 年滚动但越界整体返空——earliest=2000 会使指数/ETF 深度 case
  # 全程撞界；stock 首轮已独立收敛 ≈2005-02-14 见 notes，本轮三目标
  # 统一浅边界复验）。已摘牌锚定经 raw 先行（ths-delisted-*-historical
  # 探可查性）：上游支持已摘牌查询则回填轮将 targets.contract/option
  # 轮换为已摘牌合约并启用 full_history_targets 全量模式锚定精确上市日
  # （tushare 先例，各合约以自身上市日为准），不支持则保持 null 定案
  history_depth:
    targets: [stock, index, etf]
    earliest: 2022-01-01
    era_step_years: 5
    max_calls: 12
    intervals: [P1D]
  # 隐式截断立项（2026-11-14 第三轮，人工确认）：官方未标注行数上限（A 股/
  # 指数窗口 ≤10 年、ETF ≤5 自然年为窗口上限而非行数上限，越界上游拒绝而非
  # 裁剪——错误码 1003 由信封错误映射兜底；offset 分页行为另经 raw
  # ths-historical-offset-behavior 观察，适配器仍不启用）——首轮「A 股无
  # 滚动上限」仅验证起点可早于 10 年前（[2000,2005] 软返空），第三轮目录外
  # 诊断定案：**a-share historical 窗口跨度 ≤10 年**（>10 年窗 1003 拒绝，
  # message 自述 'must span at most 10 years'），故 max_range 取 P9Y
  # （≈2180 行）观测行数触顶：9 年近窗实测 2183 行完整返回（无触顶信号）
  # ——documented_max 不设 → observe；若未来触顶则 partial 覆盖判定候选
  # （触顶+末根<end → partial）人工裁决后回填，不触顶则「单窗口完整返回、
  # partial 恒 false」定案维持
  limit_truncation:
    targets: [stock]
    interval: P1D
    max_range: P9Y

raw:
  # A 股快照形态观察（快照不返回中文名 name 的文档口径确认、data.timestamp
  # 为「最新上游有效时间」的取值形态）；headers 携带 X-api-key（凭据只经
  # 环境变量引用，结果文件不记录值）
  - id: ths-snapshot-shape
    purpose: A 股快照响应形态观察（item 字段完整性、data.timestamp 口径、
      name 缺失确认）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/a-share/prices/snapshot", params: {thscodes: "600519.SH"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_rows: 1}
    close: {method: close, kwargs: {}}

  # 期货分时形态观察（快照 volume/amount 回填依据）：核实分时点量额口径
  # 是逐分钟增量还是当日累计——单日末点 volume 与全点求和对比即可判别；
  # 结论人工确认后回填 manifest fields 声明与 response_mapper 映射
  - id: ths-futures-intraday-quantity-semantics
    purpose: 期货分时点量额口径核实（volume/turnover 为逐分钟增量或当日
      累计——期货/期权快照 volume/amount 是否透出的判定依据）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/intraday", params: {thscode: "CU2706.SHF", session: "intraday", trade_date: "0"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_rows: 1}
    close: {method: close, kwargs: {}}

  # 错误指纹仅观察：采集无效 API Key 的信封报文（预期 code=2001 未认证，
  # HTTP 恒 200——信封错误走业务码），供 UPSTREAM 细分错误映射参考
  - id: ths-invalid-key-fingerprint
    purpose: 采集无效 API Key 的错误指纹（字面量假 Key，非真实凭据；仅观察）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/a-share/prices/snapshot", params: {thscodes: "600519.SH"}, headers: {"X-api-key": "probe-invalid-key-not-a-credential"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_rows: 1}
    close: {method: close, kwargs: {}}

  # ETF 复权口径实证（2026-11-14 加入并已实证，观察）：fund historical 端点
  # 无 adjust 请求参数（复权方式不可选），官方文档明示「adjust null 当前固定
  # 为 null；价格数据仍采用前复权口径」——**受控对比已实证文档属实**（目录
  # 外脚本 probes/results/ths/etf-adjust-20261114T080423+0800：510880 红利
  # ETF 2023-2025 窗口，除息日 2023-01-16/2024-01-23/2025-01-21；调整生效段
  # ths vs baostock none 中位偏差 9.01%、vs qfq 仅 0.34%，事件日样本 2.8840
  # ≈qfq 2.8924 远离 none 3.0270）——**ths ETF 日线为固定前复权，现声明
  # [none] 系口径错标**，声明形态回填（qfq 单值 / none+口径注记）人工裁决后
  # 单独提交。参照序列（baostock none/qfq，复权生效性已实证）经目录外脚本
  # 对比（baostock ResultData 非 JSON 形态、模块级 login/logout 模型不适配
  # 声明式 client/close）。本 case 常态留存 ths 侧证据：窗口钉在 2025-01-21
  # 除息日 ±7 自然日（跨除息口径差异肉眼可核）。框架 kwargs 统一关键字传参
  # （dict.get 不接受关键字），无法链式抽取 item——链止于整信封、以
  # min_fields 判定，样本随窄窗口限量。
  - id: ths-etf-dividend-window
    purpose: ETF 跨除息窗口日线可得性与复权口径证据留存（2025-01-21 除息日
      ±7 自然日；结论见目录外对比报告 etf-adjust-20261114T080423+0800）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/fund/market/historical", params: {thscode: "510880.SH", interval: "1d", start: 1736784000000, end: 1737993599000}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # data.adjust 字段实证（观察）：近期短窗口整信封留存，核对 ETF 响应
  # data.adjust 是否如文档固定 null、item 行形态（date_ms/OHLC/量额键名）
  - id: ths-etf-adjust-field-shape
    purpose: ETF fund historical 响应 data.adjust 字段取值与 item 行形态观察
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/fund/market/historical", params: {thscode: "510880.SH", interval: "1d", start: 1766505600000, end: 1767196799000}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # —— 第三轮立项（2026-11-14，人工确认）——
  # 以下 case 全部仅观察（assert: false），结论人工裁决后单独回填；
  # 历史 K 线参数显式传全（a-share 含 adjust；期货/期权 time_period=day_1，
  # 端外仅日线），窗口毫秒时间戳与上方 ETF case 同风格。

  # offset 分页行为（manifest「historical 的 offset 分页参数行为未核实，
  # 不启用」待办项）：2025 全年窗（availability 基线 243 根、首根
  # 2025-01-02）传 offset=100——返回行数与首样本 date_ms 可判跳行生效
  # （行数 ≈143、首根 ≈2025-06）或被静默忽略（行数不变、首根不变）
  - id: ths-historical-offset-behavior
    purpose: a_share historical offset 参数行为观察（跳行生效 / 被静默忽略）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/a-share/prices/historical", params: {thscode: "600519.SH", interval: "1d", adjust: "none", start: 1735660800000, end: 1767196799000, offset: 100}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # 期货交易所后缀实证（待回填项：ZCE/DCE/INE/GFEX 未在文档示例实证，
  # 确认后扩容 _SUFFIXES）：适配器 _SUFFIXES 未收录交易所在本地即拒
  # （上游指纹空白），raw 绕过适配器直调上游——窗口取 2025-11~12 存续期、
  # time_period=day_1 显式传参，成功形态（code=0 与行数）或错误指纹均落袋。
  # ZCE 郑商所年月码形态即探测点（三位 SR601 vs 四位 SR2601 双形态并探，
  # 定案适配器还原规则）；GFEX 品种代码大小写形态一并记录（LC2606，
  # 上游原生小写 lc 待证）
  - id: ths-futures-suffix-dce
    purpose: 大商所后缀 DCE 实证（M2601 豆粕，4 位年月码）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "M2601.DCE", start: 1761926400000, end: 1767196799000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  - id: ths-futures-suffix-zce-3digit
    purpose: 郑商所后缀 ZCE 三位年月码形态实证（SR601 白糖）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "SR601.ZCE", start: 1761926400000, end: 1767196799000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  - id: ths-futures-suffix-zce-4digit
    purpose: 郑商所后缀 ZCE 四位年月码形态实证（SR2601 白糖，与三位形态
      对照定案适配器还原规则）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "SR2601.ZCE", start: 1761926400000, end: 1767196799000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  - id: ths-futures-suffix-ine
    purpose: 上期能源后缀 INE 实证（SC2606 原油，4 位年月码）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "SC2606.INE", start: 1761926400000, end: 1767196799000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  - id: ths-futures-suffix-gfex
    purpose: 广期所后缀 GFEX 实证（LC2606 碳酸锂，大小写形态一并记录）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "LC2606.GFEX", start: 1761926400000, end: 1767196799000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # 已摘牌合约可查性（contract/option history.start 锚定前置，tushare
  # 先例「已摘牌合约全量拉取直读最早 bar = 精确上市日」）：探测对象用
  # 文档示例已到期合约（CU2601.SHF / IO2601-C-4000.CFE）存续期中段窗口
  # ——code=0 有数据 → 回填轮轮换 targets 并启用 history_depth
  # full_history_targets 全量模式锚定精确上市日；返空/报错 → 保持 null
  # 定案「仅现活合约可得」
  - id: ths-delisted-contract-historical
    purpose: 已摘牌期货合约可查性实证（CU2601.SHF 2025-06~12 存续期中段）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "CU2601.SHF", start: 1748707200000, end: 1765814399000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  - id: ths-delisted-option-historical
    purpose: 已摘牌期权合约可查性实证（IO2601-C-4000.CFE 2025-11~12 存续期）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/options/prices/daily", params: {thscode: "IO2601-C-4000.CFE", start: 1761926400000, end: 1765814399000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # 北交所 BSE→BJ 价格端点（manifest「BSE→BJ 仅元信息域实证、价格端点
  # 未实证不收」待办项）：a-share / a-share-index historical 直调——
  # 实证通过则扩容 _SUFFIXES（stock/index: BSE→BJ）与 targets 逐所键
