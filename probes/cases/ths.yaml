# 同花顺金融数据 API（ths）数据探针：历史 K 线可用性、复权生效性、历史深度
# 收敛与隐式截断常态复验，快照/分时形态观察（量额口径核实）。定案结论已回填
# manifest 与 docs/providers/ths.md（「标的代码映射」「上游行为定案」）。
#
# 上游限频为「约定 QPS」（超限信封 code=4001），具体 QPS 未公布：pacing 2 秒
# （≤0.5 QPS）保守起步，探针报告中观察 4001 出现情况后收紧。
probe: ths
version: 2

requires:
  # ths 无官方 Python SDK：raw case 反射 httpx 直连（pyproject 可选依赖组名
  # 亦为 ths，由 uv sync --extra ths 提供 httpx）
  extras: [httpx]
  env: [TAPEHUB_THS_API_KEY]

pacing:
  # 2 秒：5 秒间隔无法规避期权日 K 失败——根因为 start=2026-10-01 单一
  # 日期触发上游 5003（邻近起点均正常，与调用频率无关）；4001 限频未复现
  call_interval_s: 2.0
  timeout_s: 60
  # 本轮构成（BSE/期货六所收编 + SZSE 逐所扩容 + 期权八所回填收编并
  # asset_type 三分后）：
  # availability（bars：stock 三复权 + index + etf + contract + 期权三子类
  # 八所逐所 + BSE/SZSE 逐所）+ adjust_diff 4（stock 1 目标 × 2 pair × 2 调）
  # + history_depth 3 case × 最坏 12 + limit_truncation +
  # quote_availability（quotes 声明随 include_declared 自动展开，与 bars
  # 同矩阵逐所）+ raw 1 case × 3 调（client + get + json：无效 Key 错误
  # 指纹），
  # 最坏 94（cli list 实测合计：chain 56 case + raw 1 case），预算 150
  # 留余量
  max_calls: 150

targets:
  stock:
    instrument: CN-SSE-600602
    # 云赛智联（老八股）：证券基准统一——与 alphafeed/baostock/futunn/tickflow
    # 同款「早上市标的」（原 600519 为文档示例标的，换统一基准）
    window: {start: 2025-01-01, end: 2025-12-31}
    # 仅日线声明：一年约 244 根，10 为保守下限
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index:
    instrument: CN-SSE-000001
    # 上证综指（标准交易所指数；同花顺板块/行业 TI 类指数不在本期声明）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-BSE:
    instrument: CN-BSE-920000
    # 北交所个股（920 段）：BSE→BJ 价格端点探针实证后收编（_SUFFIXES
    # 扩容），本键为 chain 常态复验目标（alphafeed/tickflow/futunn 逐所
    # 细分同款先例）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index@CN-BSE:
    instrument: CN-BSE-899050
    # 北证 50 指数：a-share-index 价格端点实证收编，同上
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-SZSE:
    instrument: CN-SZSE-000001
    # 平安银行：交易所限定追加目标，SZSE→SZ 后缀在 _SUFFIXES 白名单
    # （文档示例条目），逐所 chain 首验轮——声明内 + mapper 放行，首次
    # 运行即实证。BSE→BJ 逐所（stock/index）已实证收编见上；BSE×ETF 不
    # 存在（北交所无 ETF），不设该所目标
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index@CN-SZSE:
    instrument: CN-SZSE-399001
    # 深证成指：同上首验轮口径（SZSE→SZ 文档示例条目，首次运行即实证）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf:
    instrument: CN-SSE-510050
    # 华夏上证 50ETF（2004-12-30 上市，最早 CN ETF 之一）：证券基准统一——
    # 与 akshare/alphafeed/baostock/tickflow/tqsdk/tushare 同款（原 510300 为
    # 文档示例标的）；仅 ETF，LOF/场外/REITs 上游返回 3004 口径不变
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf@CN-SZSE:
    instrument: CN-SZSE-159915
    # 易方达创业板 ETF：同上首验轮口径（etf 后缀表仅 SSE/SZSE，SZ 侧首次
    # 运行即实证）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  contract:
    instrument: CN-SHFE-CU2706
    # 铜期货合约（文档示例 CU2601.SHF 已到期）：SHFE→SHF。合约会到期：
    # 运行前按上期所挂牌信息核对，失败如实记录，到期轮换为当时的现活合约
    window: {start: 2026-08-01, end: 2026-11-30}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  contract@CN-CZCE:
    instrument: CN-CZCE-MA701
    # 甲醇 2701（2027-01 交割）：CZCE→CZC + 年月码 4→3 还原。合约会到期：
    # 运行前按郑商所挂牌信息核对并轮换
    window: {start: 2026-08-03, end: 2026-11-13}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  contract@CN-DCE:
    instrument: CN-DCE-M2705
    # 豆粕 2705：DCE 品种统一——「豆粕为全市场持仓前列品种」（与
    # akshare/tqsdk/tushare 同款；原 EG2701 乙二醇为文档示例形态）。
    # 合约会到期：同上轮换
    window: {start: 2026-08-03, end: 2026-11-13}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  contract@CN-INE:
    instrument: CN-INE-SC2706
    # 原油 2706：INE 品种统一——「原油为该所绝对主力」（与 akshare/tqsdk
    # 同月同码；原 BC2612 国际铜为文档示例形态）。合约会到期：同上轮换
    window: {start: 2026-08-03, end: 2026-11-13}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  contract@CN-GFEX:
    instrument: CN-GFEX-LC2706
    # 碳酸锂 2706：GFEX 月码统一——与 akshare/tqsdk/tushare 同月同码（2706；
    # 后缀实为 GFE 非 GFEX；原 LC2701 换统一月码）。合约会到期：同上轮换
    window: {start: 2026-08-03, end: 2026-11-13}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  contract@CN-CFFEX:
    instrument: CN-CFFEX-IF2706
    # 沪深300 股指期货（季月，2026-10-19 挂牌）：CFFEX→CFE 与该所期权同
    # 后缀（2026-11-16 第 9 轮探针实证 IF2706.CFE code=0 真实日线、
    # IF2706.CFX 3001 不存在——与 tushare 侧该所期货 .CFX 不同）。合约会到期：运行前按
    # 中金所挂牌信息核对，失败如实记录，到期轮换为当时的现活合约。
    # 窗口起点避开 2026-10-01（该单一日期触发上游 5003，邻近起点均正常）
    window: {start: 2026-09-01, end: 2026-11-30}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  index-option:
    instrument: CN-CFFEX-IO2612C4000
    # 沪深300期权：CFFEX→CFE（2026-11-16 聚焦轮后八所收编，本基准目标保留
    # CFFEX 段；asset_type 三分前为裸键 option）。月度合约会到期：运行前按
    # 中金所挂牌信息核对（行权价 4000 需在挂牌行权价序列内），失败如实记录，
    # 到期轮换为现活合约。
    # 窗口起点避开 2026-10-01（该单一日期触发上游 5003
    # 'daily quote unavailable'，邻近起点均正常）
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 5
    required_fields: [open, high, low, close, volume, amount]
  etf-option@CN-SSE:
    instrument: CN-SSE-10011427
    # 50ETF 购 12 月（数字合约码 + SH）：2026-11-16 到期前轮换——原近月
    # 10012437（购11月2800）2026-11-25 到期，按 tushare opt_basic 目录
    # （在市 delist_date 未过 + ATM）重选：现价 510050=2.889，行权价 2.90
    # 最近档（listed 2026-04-23 / delist 2026-12-23）。合约会到期：下次
    # 轮换按同款口径重选近月/次月 ATM
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  etf-option@CN-SZSE:
    instrument: CN-SZSE-90008043
    # 沪深300ETF 购 12 月（数字合约码 + SZ）：同上轮换——原近月 90008083
    # 2026-11-25 到期，opt_basic 目录 ATM 重选：现价 159919=4.266，行权价
    # 4.30 最近档（listed 2026-09-16 / delist 2026-12-23；深交所 name 带
    # 「沪深」前缀，opt_code=159919C 系列同一口径）
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  commodity-option@CN-SHFE:
    instrument: CN-SHFE-CU2701C102000
    # 铜期权 ATM 实码（无连字符式）：聚焦轮目录锚定实码 code=0 五行实证
    # 收编——深虚零成交合约 code=0 但 item 空，轮换须按 opt_basic 挂牌
    # 行权价序列选 ATM/主力系列（铜期权行权价 2000 间隔）
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  commodity-option@CN-INE:
    instrument: CN-INE-SC2701C550
    # 原油期权（无连字符式，与 SHFE 同构）：聚焦轮 code=0 两行实证收编——
    # 550 为深虚近零成交（周窗仅 2 行），min_bars 放宽至 1；轮换按挂牌
    # 行权价序列重选 ATM（原油期权行权价间隔按挂牌序列核对）
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 1
    required_fields: [open, high, low, close, volume, amount]
  commodity-option@CN-DCE:
    instrument: CN-DCE-M2701C3150
    # 豆粕期权（连字符式，4 位月）：2026-11-16 轮换——原探测目标 M2701C3500
    # 日 K 可用但分时端点 5003 'intraday quote unavailable'（上游逐合约数据
    # 缺口，与流动性无关——归因定案见 docs/providers/ths.md「上游行为定案」）。按标的现价锚定 ATM
    # 重选：M2701 期货收盘 3147（tushare fut_daily），行权价间隔 50 → 3150
    # （目录外直测分时 code=0 308 点）。合约会到期：轮换按同款口径重选 ATM
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  commodity-option@CN-CZCE:
    instrument: CN-CZCE-MA2701C3200
    # 甲醇期权（统一式 {品种}{4位年月}{C/P}{行权价} → 原生大写品种 3 位月码
    # MA701C3200.CZC，4→3 还原与该所期货同构）：CZCE 期权品种统一——「甲醇
    # 为郑商所持仓王」（与 contract/continuous MA 同品种；原 SR2701C5900
    # 白糖换统一品种，原码三家同码互证留档）。行权价 3200 经人工锚定提供
    #（2026-11-16）；首次探针运行按 availability 即实证。合约会到期：轮换
    # 按 opt_basic（exchange=CZCE，name 含甲醇 + delist_date 未过）重选 ATM
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  commodity-option@CN-GFEX:
    instrument: CN-GFEX-LC2701C88000
    # 碳酸锂期权（连字符式，与期货主连「品种+L」不同构）：2026-11-16 轮换
    # ——原探测目标 C90000 日 K 可用（tushare opt_daily 当日 vol 1.4 万+）
    # 但分时端点 5003（上游逐合约缺口；LC2701 系列内 5003 散布于行权价，
    # 与流动性无关——归因定案见 docs/providers/ths.md「上游行为定案」）。按标的现价锚定 ATM 重选：
    # LC2701 分时末点 87740，行权价间隔 2000 → 88000（目录外直测分时
    # code=0 188 点）。注意：tushare opt_basic GFEX 目录行权价档位
    # （188000+）与现价矛盾，不可作选码依据。合约会到期：轮换按同款口径
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]

chain:
  include_declared: true
  skip: []
  # stock 为唯一多复权资产（none/qfq/hfq）：对比不复权与前复权、不复权与
  # 后复权的收盘价序列（分红送股窗口应有差异）
  adjust_diff:
    targets: [stock]
    window: {start: 2024-01-01, end: 2025-12-31}
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
    intervals: [P1D]
  # 历史覆盖全部保持 null（文档未公布）：P1D 先行二分收敛；仅对证券类
  # 目标做 depth——合约类有时限标的不统计历史深度（2026-11-16 决议，见
  # docs/probes.md「规范化规则」）：期货/期权合约生命周期有限（到期归档），
  # 「最早可用」语义随合约轮换漂移，不做回溯（待 continuous 主连纳入声明后再议）。
  # earliest 折中取 2022-01-01：指数端点越界窗口 1003 拒绝且实测口径为
  # 「recent five years only」滚动 5 年、ETF 同为约 5 年滚动但越界整体
  # 返空——earliest=2000 会使指数/ETF 深度 case 全程撞界，三目标统一浅
  # 边界复验。已摘牌合约可查性已定案：上游移出目录、仅现活合约可查（2026-11-14 第 7 轮
  # CU2601.SHF / IO2601-C-4000.CFE 3001 vs CU2706.SHF code=0 对照）→
  # contract/期权三子类 history.start 保持 null，tushare「已摘牌全量锚定」
  # 先例不适用
  history_depth:
    targets: [stock, index, etf]
    earliest: 2022-01-01
    era_step_years: 5
    max_calls: 12
    intervals: [P1D]
  # 隐式截断观察：官方未标注行数上限；A 股/指数窗口 ≤10 年、ETF ≤5 自然年
  # 为窗口上限而非行数上限，越界上游拒绝而非裁剪（错误码 1003 由信封错误
  # 映射兜底）——a-share historical 窗口跨度 ≤10 年（>10 年窗 1003 拒绝，
  # message 自述 'must span at most 10 years'），故 max_range 取 P9Y
  # （≈2180 行）观测行数触顶；documented_max 不设 → observe，若未来触顶则
  # partial 覆盖判定候选（触顶+末根<end → partial），不触顶则「单窗口完整
  # 返回、partial 恒 false」。offset 分页已定案被上游静默忽略、适配器不启用
  #（2025 全年窗 offset=100 行数与首根均不变）
  limit_truncation:
    targets: [stock]
    interval: P1D
    max_range: P9Y

raw:
  # 错误指纹仅观察：采集无效 API Key 的信封报文（预期 code=2001 未认证，
  # HTTP 恒 200——信封错误走业务码），供 UPSTREAM 细分错误映射参考
  - id: ths-invalid-key-fingerprint
    purpose: 采集无效 API Key 的错误指纹（字面量假 Key，非真实凭据；仅观察）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/a-share/prices/snapshot", params: {thscodes: "600519.SH"}, headers: {"X-api-key": "probe-invalid-key-not-a-credential"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message]}
    close: {method: close, kwargs: {}}



notes: 探针框架规范见 docs/probes.md。
