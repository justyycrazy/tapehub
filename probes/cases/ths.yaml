# 同花顺金融数据 API（ths）数据探针：历史 K 线可用性、复权生效性、历史深度
# 收敛，快照/分时形态观察（量额口径核实），ETF 复权口径留存（fund
# historical 无 adjust 参数、文档称「价格数据采用前复权口径」，见 raw 段
# 注释），隐式截断与 offset 分页边界，期货交易所后缀与已摘牌合约可查性，
# 北交所价格端点（见 chain/raw 段注释）。
#
# 上游限频为「约定 QPS」（超限信封 code=4001），具体 QPS 未公布：pacing 2 秒
# （≤0.5 QPS）保守起步，探针报告中观察 4001 出现情况后收紧。
probe: ths
version: 1

requires:
  # ths 无官方 Python SDK：raw case 反射 httpx 直连（pyproject 可选依赖组名
  # 亦为 ths，由 uv sync --extra ths 提供 httpx）
  extras: [httpx]
  env: [TAPEHUB_THS_API_KEY]

pacing:
  # 2 秒：5 秒间隔无法规避 option 日 K 失败——根因为 start=2026-10-01 单一
  # 日期触发上游 5003（邻近起点均正常，与调用频率无关）；4001 限频未复现
  call_interval_s: 2.0
  timeout_s: 60
  # 本轮构成（BSE/期货五所收编后）：availability
  # 13（bars 13：stock 三复权 + index + etf + contract + option + BSE 逐所
  # stock/index + 期货逐所 CZCE/DCE/INE/GFEX）+ adjust_diff 4（stock 1
  # 目标 × 2 pair × 2 调）+ history_depth 3 case × 最坏 12 +
  # limit_truncation ≈2 + raw 15 case 各 3 调（client + get + json），
  # 最坏约 76，预算 130 留余量（约 6 分钟）
  max_calls: 130

targets:
  stock:
    instrument: CN-SSE-600519
    window: {start: 2025-01-01, end: 2025-12-31}
    # 仅日线声明：一年约 244 根，10 为保守下限
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index:
    instrument: CN-SSE-000001
    # 上证综指（标准交易所指数；同花顺板块/行业 TI 类指数不在本期声明）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-BSE:
    instrument: CN-BSE-920000
    # 北交所个股（920 段）：BSE→BJ 价格端点探针实证后收编（_SUFFIXES
    # 扩容），本键为 chain 常态复验目标（alphafeed/tickflow/futunn 逐所
    # 细分同款先例）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index@CN-BSE:
    instrument: CN-BSE-899050
    # 北证 50 指数：a-share-index 价格端点实证收编，同上
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf:
    instrument: CN-SSE-510300
    # 沪深300ETF（官方文档示例标的；仅 ETF，LOF/场外/REITs 上游返回 3004）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  contract:
    instrument: CN-SHFE-CU2706
    # 铜期货合约（文档示例 CU2601.SHF 已到期）：SHFE→SHF。合约会到期：
    # 运行前按上期所挂牌信息核对，失败如实记录，到期轮换为当时的现活合约
    window: {start: 2026-08-01, end: 2026-11-30}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  contract@CN-CZCE:
    instrument: CN-CZCE-MA701
    # 甲醇 2701（2027-01 交割）：CZCE→CZC + 年月码 4→3 还原。合约会到期：
    # 运行前按郑商所挂牌信息核对并轮换
    window: {start: 2026-08-03, end: 2026-11-13}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  contract@CN-DCE:
    instrument: CN-DCE-EG2701
    # 乙二醇 2701（文档示例形态）：DCE→DCE。合约会到期：同上轮换
    window: {start: 2026-08-03, end: 2026-11-13}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  contract@CN-INE:
    instrument: CN-INE-BC2612
    # 国际铜 2612（文档示例形态）：INE→INE。合约会到期：同上轮换
    window: {start: 2026-08-03, end: 2026-11-13}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  contract@CN-GFEX:
    instrument: CN-GFEX-LC2701
    # 碳酸锂 2701（后缀实为 GFE 非 GFEX）。合约会到期：同上轮换
    window: {start: 2026-08-03, end: 2026-11-13}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  option:
    instrument: CN-CFFEX-IO2612-C-4000
    # 沪深300期权（文档示例 IO2601-C-4000.CFE 已到期）：CFFEX→CFE 为唯一
    # 文档实证后缀。月度合约会到期：运行前按中金所挂牌信息核对（行权价
    # 4000 需在挂牌行权价序列内），失败如实记录，到期轮换为现活合约。
    # 窗口起点避开 2026-10-01（该单一日期触发上游 5003
    # 'daily quote unavailable'，邻近起点均正常）
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 5
    required_fields: [open, high, low, close, volume, amount]

chain:
  include_declared: true
  skip: []
  # stock 为唯一多复权资产（none/qfq/hfq）：对比不复权与前复权、不复权与
  # 后复权的收盘价序列（分红送股窗口应有差异）
  adjust_diff:
    targets: [stock]
    window: {start: 2024-01-01, end: 2025-12-31}
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
    intervals: [P1D]
  # 历史覆盖全部保持 null（文档未公布）：P1D 先行二分收敛；仅对证券类
  # 目标做 depth——期货/期权合约生命周期有限（到期归档），「最早可用」
  # 语义随合约轮换漂移，不做回溯（待 continuous 主连纳入声明后再议）。
  # earliest 折中取 2022-01-01：指数端点越界窗口 1003 拒绝且实测口径为
  # 「recent five years only」滚动 5 年、ETF 同为约 5 年滚动但越界整体
  # 返空——earliest=2000 会使指数/ETF 深度 case 全程撞界，三目标统一浅
  # 边界复验。已摘牌锚定经 raw 先行（ths-delisted-*-historical 探可查性）：
  # 上游支持已摘牌查询则回填轮将 targets.contract/option 轮换为已摘牌
  # 合约并启用 full_history_targets 全量模式锚定精确上市日（tushare 先例，
  # 各合约以自身上市日为准），不支持则保持 null 定案
  history_depth:
    targets: [stock, index, etf]
    earliest: 2022-01-01
    era_step_years: 5
    max_calls: 12
    intervals: [P1D]
  # 隐式截断观察：官方未标注行数上限；A 股/指数窗口 ≤10 年、ETF ≤5 自然年
  # 为窗口上限而非行数上限，越界上游拒绝而非裁剪（错误码 1003 由信封错误
  # 映射兜底）——a-share historical 窗口跨度 ≤10 年（>10 年窗 1003 拒绝，
  # message 自述 'must span at most 10 years'），故 max_range 取 P9Y
  # （≈2180 行）观测行数触顶；documented_max 不设 → observe，若未来触顶则
  # partial 覆盖判定候选（触顶+末根<end → partial），不触顶则「单窗口完整
  # 返回、partial 恒 false」。offset 分页行为另经 raw
  # ths-historical-offset-behavior 观察，适配器仍不启用
  limit_truncation:
    targets: [stock]
    interval: P1D
    max_range: P9Y

raw:
  # A 股快照形态观察（快照不返回中文名 name 的文档口径确认、data.timestamp
  # 为「最新上游有效时间」的取值形态）；headers 携带 X-api-key（凭据只经
  # 环境变量引用，结果文件不记录值）
  - id: ths-snapshot-shape
    purpose: A 股快照响应形态观察（item 字段完整性、data.timestamp 口径、
      name 缺失确认）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/a-share/prices/snapshot", params: {thscodes: "600519.SH"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_rows: 1}
    close: {method: close, kwargs: {}}

  # 期货分时形态观察（快照 volume/amount 回填依据）：核实分时点量额口径
  # 是逐分钟增量还是当日累计——单日末点 volume 与全点求和对比即可判别；
  # 结论回填 manifest fields 声明与 response_mapper 映射
  - id: ths-futures-intraday-quantity-semantics
    purpose: 期货分时点量额口径核实（volume/turnover 为逐分钟增量或当日
      累计——期货/期权快照 volume/amount 是否透出的判定依据）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/intraday", params: {thscode: "CU2706.SHF", session: "intraday", trade_date: "0"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_rows: 1}
    close: {method: close, kwargs: {}}

  # 错误指纹仅观察：采集无效 API Key 的信封报文（预期 code=2001 未认证，
  # HTTP 恒 200——信封错误走业务码），供 UPSTREAM 细分错误映射参考
  - id: ths-invalid-key-fingerprint
    purpose: 采集无效 API Key 的错误指纹（字面量假 Key，非真实凭据；仅观察）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/a-share/prices/snapshot", params: {thscodes: "600519.SH"}, headers: {"X-api-key": "probe-invalid-key-not-a-credential"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_rows: 1}
    close: {method: close, kwargs: {}}

  # ETF 复权口径留存（观察）：fund historical 端点无 adjust 请求参数（复权
  # 方式不可选），官方文档明示「adjust null 当前固定为 null；价格数据仍采用
  # 前复权口径」——受控对比实证文档属实（对照 baostock none/qfq 序列），
  # manifest etf 复权声明据实回填 [qfq]。baostock ResultData 非 JSON 形态、
  # 模块级 login/logout 模型不适配声明式 client/close，参照序列对比走目录外
  # 脚本。本 case 常态留存 ths 侧证据：窗口钉在 2025-01-21 除息日 ±7 自然日
  # （跨除息口径差异肉眼可核）。框架 kwargs 统一关键字传参（dict.get 不接受
  # 关键字），无法链式抽取 item——链止于整信封、以 min_fields 判定，样本随
  # 窄窗口限量。
  - id: ths-etf-dividend-window
    purpose: ETF 跨除息窗口日线可得性与复权口径证据留存（2025-01-21 除息日
      ±7 自然日；结论见目录外对比报告 etf-adjust-20261114T080423+0800）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/fund/market/historical", params: {thscode: "510880.SH", interval: "1d", start: 1736784000000, end: 1737993599000}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # data.adjust 字段实证（观察）：近期短窗口整信封留存，核对 ETF 响应
  # data.adjust 是否如文档固定 null、item 行形态（date_ms/OHLC/量额键名）
  - id: ths-etf-adjust-field-shape
    purpose: ETF fund historical 响应 data.adjust 字段取值与 item 行形态观察
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/fund/market/historical", params: {thscode: "510880.SH", interval: "1d", start: 1766505600000, end: 1767196799000}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # —— 以下 case 全部仅观察（assert: false），结论回填见
  # probes/results/PROBE_LOG.md；历史 K 线参数显式传全（a-share 含 adjust；
  # 期货/期权 time_period=day_1，端外仅日线），窗口毫秒时间戳与上方 ETF
  # case 同风格。

  # offset 分页行为（manifest「historical 的 offset 分页参数行为未核实，
  # 不启用」待办项）：2025 全年窗（availability 基线 243 根、首根
  # 2025-01-02）传 offset=100——返回行数与首样本 date_ms 可判跳行生效
  # （行数 ≈143、首根 ≈2025-06）或被静默忽略（行数不变、首根不变）
  - id: ths-historical-offset-behavior
    purpose: a_share historical offset 参数行为观察（跳行生效 / 被静默忽略）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/a-share/prices/historical", params: {thscode: "600519.SH", interval: "1d", adjust: "none", start: 1735660800000, end: 1767196799000, offset: 100}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # 期货交易所后缀实证（_SUFFIXES 五所收编）：窗口取 2026-08~11 存续期、
  # time_period=day_1 显式传参。zce-4digit 为 4→3 还原对照 case（四位码
  # 不识别）；MA701 首探 5003 系瞬时（复验 code=0）；SR612.CZC 3001 系
  # 白糖近月不在 ths 目录（形态无关）
  - id: ths-futures-suffix-dce
    purpose: 大商所后缀 DCE 实证（EG2701 乙二醇，文档示例形态）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "EG2701.DCE", start: 1785715200000, end: 1794614399000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  - id: ths-futures-suffix-zce-3digit
    purpose: 郑商所后缀 CZC 三位年月码实证（MA612 甲醇近月）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "MA612.CZC", start: 1785715200000, end: 1794614399000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  - id: ths-futures-suffix-zce-4digit
    purpose: 郑商所四位年月码对照实证（MA2701.CZC 3001——4→3 还原依据
      常态留存，非后缀探测）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "MA2701.CZC", start: 1785715200000, end: 1794614399000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  - id: ths-futures-suffix-ine
    purpose: 上期能源后缀 INE 实证（BC2612 国际铜，文档示例形态）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "BC2612.INE", start: 1785715200000, end: 1794614399000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  - id: ths-futures-suffix-gfex
    purpose: 广期所后缀 GFE 实证（LC2701 碳酸锂——后缀实为 GFE 非 GFEX）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "LC2701.GFE", start: 1785715200000, end: 1794614399000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # 已摘牌合约可查性（contract/option history.start 锚定前置，tushare
  # 先例「已摘牌合约全量拉取直读最早 bar = 精确上市日」）：探测对象用
  # 文档示例已到期合约（CU2601.SHF / IO2601-C-4000.CFE）存续期中段窗口
  # ——code=0 有数据 → 回填轮轮换 targets 并启用 history_depth
  # full_history_targets 全量模式锚定精确上市日；返空/报错 → 保持 null
  # 定案「仅现活合约可得」
  - id: ths-delisted-contract-historical
    purpose: 已摘牌期货合约可查性实证（CU2601.SHF 2025-06~12 存续期中段）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/daily", params: {thscode: "CU2601.SHF", start: 1748707200000, end: 1765814399000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  - id: ths-delisted-option-historical
    purpose: 已摘牌期权合约可查性实证（IO2601-C-4000.CFE 2025-11~12 存续期）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/options/prices/daily", params: {thscode: "IO2601-C-4000.CFE", start: 1761926400000, end: 1765814399000, time_period: "day_1"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # 北交所 BSE→BJ 价格端点（manifest「BSE→BJ 仅元信息域实证、价格端点
  # 未实证不收」待办项）：a-share / a-share-index historical 直调——
