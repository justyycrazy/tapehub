# 同花顺金融数据 API（ths）数据探针：历史 K 线可用性、复权生效性、历史深度
# 收敛，快照/分时形态观察（量额口径核实），及 ETF 复权口径实证（2026-11-14
# 加入：fund historical 无 adjust 参数但文档称「价格数据采用前复权口径」，
# 与现声明 [none] 的口径一致性待受控对比实证，见 raw 段注释）。
#
# 上游限频为「约定 QPS」（超限信封 code=4001），具体 QPS 未公布：pacing 2 秒
# （≤0.5 QPS）保守起步，探针报告中观察 4001 出现情况后收紧。
probe: ths
version: 1

requires:
  # ths 无官方 Python SDK：raw case 反射 httpx 直连（pyproject 可选依赖组名
  # 亦为 ths，由 uv sync --extra ths 提供 httpx）
  extras: [httpx]
  env: [TAPEHUB_THS_API_KEY]

pacing:
  # 2 秒（2026-11-13 第二轮实验后回收）：5 秒间隔无法规避 option 日 K 失败
  # ——根因已定位为 start=2026-10-01 单一日期触发上游 5003（邻近起点
  # 09-27/10-02/10-09/11-01 全部正常，与调用频率无关），见 notes 第二轮；
  # 4001 限频两轮 + 目录外诊断均未复现
  call_interval_s: 2.0
  timeout_s: 60
  # 本轮构成：availability 7（stock 三复权 + index + etf + contract +
  # option 各 P1D）+ adjust_diff 4（stock 1 目标 × 2 pair × 2 调）+
  # history_depth 3 case × 最坏 12 + raw 5 case 各 3 调（client + get +
  # json），最坏约 62，预算 80 留余量
  max_calls: 80

targets:
  stock:
    instrument: CN-SSE-600519
    window: {start: 2025-01-01, end: 2025-12-31}
    # 仅日线声明：一年约 244 根，10 为保守下限
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index:
    instrument: CN-SSE-000001
    # 上证综指（标准交易所指数；同花顺板块/行业 TI 类指数不在本期声明）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf:
    instrument: CN-SSE-510300
    # 沪深300ETF（官方文档示例标的；仅 ETF，LOF/场外/REITs 上游返回 3004）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  contract:
    instrument: CN-SHFE-CU2706
    # 铜期货合约（文档示例 CU2601.SHF 已到期）：SHFE→SHF 为唯一文档实证
    # 后缀。合约会到期：运行前按上期所挂牌信息核对，失败如实记录，到期
    # 轮换为当时的现活合约
    window: {start: 2026-08-01, end: 2026-11-30}
    min_bars: 20
    required_fields: [open, high, low, close, volume, amount]
  option:
    instrument: CN-CFFEX-IO2612-C-4000
    # 沪深300期权（文档示例 IO2601-C-4000.CFE 已到期）：CFFEX→CFE 为唯一
    # 文档实证后缀。月度合约会到期：运行前按中金所挂牌信息核对（行权价
    # 4000 需在挂牌行权价序列内），失败如实记录，到期轮换为现活合约。
    # 窗口起点避开 2026-10-01（2026-11-13 第二轮实证：该单一日期触发
    # 上游 5003 'daily quote unavailable'，邻近起点均正常，见 notes）
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 5
    required_fields: [open, high, low, close, volume, amount]

chain:
  include_declared: true
  skip: []
  # stock 为唯一多复权资产（none/qfq/hfq）：对比不复权与前复权、不复权与
  # 后复权的收盘价序列（分红送股窗口应有差异）
  adjust_diff:
    targets: [stock]
    window: {start: 2024-01-01, end: 2025-12-31}
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
    intervals: [P1D]
  # 历史覆盖全部保持 null（文档未公布）：P1D 先行二分收敛；仅对证券类
  # 目标做 depth——期货/期权合约生命周期有限（到期归档），「最早可用」
  # 语义随合约轮换漂移，不做回溯（待 continuous 主连纳入声明后再议）。
  # earliest 折中取 2022-01-01（2026-11-13 首轮实证：指数端点越界窗口
  # 1003 拒绝且实测口径为「recent five years only」滚动 5 年、ETF 同为
  # 约 5 年滚动但越界整体返空——earliest=2000 会使指数/ETF 深度 case
  # 全程撞界；stock 首轮已独立收敛 ≈2005-02-14 见 notes，本轮三目标
  # 统一浅边界复验）
  history_depth:
    targets: [stock, index, etf]
    earliest: 2022-01-01
    era_step_years: 5
    max_calls: 12
    intervals: [P1D]
  # 无 limit_truncation：官方未标注行数上限（A 股/指数窗口 ≤10 年、ETF ≤5
  # 自然年为窗口上限而非行数上限，越界上游拒绝而非裁剪——错误码 1003 由
  # 信封错误映射兜底）；historical 的 offset 分页行为未核实、适配器未启用，
  # 不做隐式截断观察

raw:
  # A 股快照形态观察（快照不返回中文名 name 的文档口径确认、data.timestamp
  # 为「最新上游有效时间」的取值形态）；headers 携带 X-api-key（凭据只经
  # 环境变量引用，结果文件不记录值）
  - id: ths-snapshot-shape
    purpose: A 股快照响应形态观察（item 字段完整性、data.timestamp 口径、
      name 缺失确认）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/a-share/prices/snapshot", params: {thscodes: "600519.SH"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_rows: 1}
    close: {method: close, kwargs: {}}

  # 期货分时形态观察（快照 volume/amount 回填依据）：核实分时点量额口径
  # 是逐分钟增量还是当日累计——单日末点 volume 与全点求和对比即可判别；
  # 结论人工确认后回填 manifest fields 声明与 response_mapper 映射
  - id: ths-futures-intraday-quantity-semantics
    purpose: 期货分时点量额口径核实（volume/turnover 为逐分钟增量或当日
      累计——期货/期权快照 volume/amount 是否透出的判定依据）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/futures/prices/intraday", params: {thscode: "CU2706.SHF", session: "intraday", trade_date: "0"}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_rows: 1}
    close: {method: close, kwargs: {}}

  # 错误指纹仅观察：采集无效 API Key 的信封报文（预期 code=2001 未认证，
  # HTTP 恒 200——信封错误走业务码），供 UPSTREAM 细分错误映射参考
  - id: ths-invalid-key-fingerprint
    purpose: 采集无效 API Key 的错误指纹（字面量假 Key，非真实凭据；仅观察）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/a-share/prices/snapshot", params: {thscodes: "600519.SH"}, headers: {"X-api-key": "probe-invalid-key-not-a-credential"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_rows: 1}
    close: {method: close, kwargs: {}}

  # ETF 复权口径实证（2026-11-14 加入并已实证，观察）：fund historical 端点
  # 无 adjust 请求参数（复权方式不可选），官方文档明示「adjust null 当前固定
  # 为 null；价格数据仍采用前复权口径」——**受控对比已实证文档属实**（目录
  # 外脚本 probes/results/ths/etf-adjust-20261114T080423+0800：510880 红利
  # ETF 2023-2025 窗口，除息日 2023-01-16/2024-01-23/2025-01-21；调整生效段
  # ths vs baostock none 中位偏差 9.01%、vs qfq 仅 0.34%，事件日样本 2.8840
  # ≈qfq 2.8924 远离 none 3.0270）——**ths ETF 日线为固定前复权，现声明
  # [none] 系口径错标**，声明形态回填（qfq 单值 / none+口径注记）人工裁决后
  # 单独提交。参照序列（baostock none/qfq，复权生效性已实证）经目录外脚本
  # 对比（baostock ResultData 非 JSON 形态、模块级 login/logout 模型不适配
  # 声明式 client/close）。本 case 常态留存 ths 侧证据：窗口钉在 2025-01-21
  # 除息日 ±7 自然日（跨除息口径差异肉眼可核）。框架 kwargs 统一关键字传参
  # （dict.get 不接受关键字），无法链式抽取 item——链止于整信封、以
  # min_fields 判定，样本随窄窗口限量。
  - id: ths-etf-dividend-window
    purpose: ETF 跨除息窗口日线可得性与复权口径证据留存（2025-01-21 除息日
      ±7 自然日；结论见目录外对比报告 etf-adjust-20261114T080423+0800）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/fund/market/historical", params: {thscode: "510880.SH", interval: "1d", start: 1736784000000, end: 1737993599000}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

  # data.adjust 字段实证（观察）：近期短窗口整信封留存，核对 ETF 响应
  # data.adjust 是否如文档固定 null、item 行形态（date_ms/OHLC/量额键名）
  - id: ths-etf-adjust-field-shape
    purpose: ETF fund historical 响应 data.adjust 字段取值与 item 行形态观察
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://fuyao.aicubes.cn/api/fund/market/historical", params: {thscode: "510880.SH", interval: "1d", start: 1766505600000, end: 1767196799000}, headers: {"X-api-key": "$TAPEHUB_THS_API_KEY"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: ok, min_fields: [code, message, data]}
    close: {method: close, kwargs: {}}

notes: >
  2026-11-13 接入首轮 case 设计（真实跑前占位）：上游限频为「约定 QPS」
  （超限信封 code=4001）但未公布数值，pacing 2 秒保守起步，首轮报告观察
  4001 后收紧。
  快照链路（quotes）框架 chain 仅覆盖 fetch_bars，快照可用性经 raw case
  观察（ths-snapshot-shape 覆盖 A 股快照；指数/ETF 快照与 A 股同构信封，
  差异仅在端点路径，由单测确定性覆盖）。
  待回填项（探针报告 → 人工确认 → 单独提交）：history.start（stock/index/
  etf 三目标 P1D 二分收敛）、期货/期权快照 volume/amount 是否透出
  （ths-futures-intraday-quantity-semantics：末点 volume 与全点求和对比
  判别增量/累计口径）、无效 key 错误指纹核对（ths-invalid-key-fingerprint，
  预期信封 code=2001）、其余期货交易所后缀（ZCE/DCE/INE/GFEX 未在文档
  示例实证，确认后扩容 _SUFFIXES）、北交所 BSE→BJ 价格端点（元信息域
  实证、价格端点未实证）、historical 的 offset 分页行为（决定是否启用
  显式传参与 partial 覆盖判定）、A 股/指数窗口 10 年与 ETF 5 年越界报错
  形态（信封 code=1003 实证）。
  合约类目标（contract/option）会到期：运行前按交易所挂牌信息核对并轮换，
  失败如实记录（tushare 先例）。
  2026-11-13 首轮（报告 20261113T212034+0800，confirmed 7 / failed 3 /
  observe 5，预算 33/60；诊断目录外受控调用 ~9 次）：
  - **confirmed 7**：证券类 availability（stock 三复权 + index + etf）与
    adjust_diff 双 pair（none vs qfq/hfq 收盘价全差异——复权管线真实生效）；
  - **failed 3 均为瞬态/方法论问题，非适配器缺陷**：contract/option
    availability 失败系夜盘开局时段上游日 K 数据源瞬时不可用（期权实测
    code=5003 message='daily quote unavailable'，约 40 分钟后重试
    code=0 返回 13 行；期货 CU2706.SHF 同窗口诊断 code=0 返回 69 行
    ——SHFE→SHF / CFFEX→CFE 后缀与合约有效性双实证）；history-depth-index
    失败系探针 earliest=2000 超出上游实测窗口（见下条），非数据问题；
  - **文档与实测不符（重要）**：指数历史 K 线文档明示「窗口 ≤10 年」，
    实测 1003 message='Parameter value out of range: start (recent five
    years only)'——仅支持**最近约 5 年滚动窗口**（2020-01-01 起点亦被拒）；
    ETF 文档「5 自然年」实测吻合（[2020,2025] 整体返空、[2022,2026] 969
    行——越界**返空不报错**，与指数的**拒绝**行为不同）；A 股个股无滚动
    上限（[2000,2005] 软返空）；回填 manifest 注记与 README 窗口口径需
    人工确认后单独提交；
  - **分时量额口径已实证（快照 volume/amount 回填依据）**：逐分钟增量——
    各点 turnover/volume 恰等于该点 price×5（cu 5 吨/手乘数，分钟 VWAP
    微差），且 21:00/21:01/21:02 三点 volume 5→26→31 非累计序列；若回填
    快照 volume/amount 需全点求和（口径变更涉及 fields 扩容，人工裁决）；
  - **股票深度已收敛**：earliest ≈2005-02-14（approx ±90 天粒度，600519，
    11 调 complete；[2005,2010] era 1153 行完整日 K）——显著深于 dump
    模块「10 年」口径，回填候选待人工确认；
  - **无效 key 指纹实测**：code=2003 message='Invalid or revoked API key'
    （文档写 2001=未认证——实测无效 key 走 2003，信封错误映射已兜底，
    文档矛盾点记录）；
  - **快照 data.timestamp 口径存疑（待复核）**：周五 21:18 盘后请求返回
    timestamp=21:21（响应组装时刻），非收盘行情时点（15:00）——适配器
    现按文档「最新上游有效时间」用作 Quote.timestamp，盘后语义需人工
    复核（快照 item 无独立行情时间字段可用）；
  - 下一轮：availability 复验（预期 contract/option 转 confirmed）、
    depth 按折中 earliest=2022-01-01 重收敛 index/etf、夜盘时段日 K
    5003 复现观察（确认时段性规律后可在 README 注明重试窗口）。
  2026-11-13 第二轮（报告 20261113T213321+0800，confirmed 8 / failed 1 /
  observe 6，预算 23/60，pacing 5 秒）：
  - **contract availability 转正**（confirmed）；**option 仍 failed——5 秒
    间隔无法规避**。目录外受控判别（7 调）定位根因：**start=2026-10-01
    单一日期触发 5003 'daily quote unavailable'**（三轮探针 + 三次诊断
    一致复现；邻近起点 2026-09-27/10-02/10-09/11-01 全部 code=0 正常，
    27/26/30/10 行各异但与交易日数吻合）——上游该日期桶的单点缺陷，
    与调用频率、夜盘时段均无关（09-27 周日起点、期货 08-01 周六起点
    亦正常）。期权目标窗口已改 [2026-11-01, 2026-11-30]（实测 10 行）；
    pacing 回收 2 秒（放宽无收益已实证）；
  - **depth 三目标全部收敛**：earliest_estimate=2022-01-01（=探针折中
    边界，bounded-below）、[2022,2025] 窗口各 969 行（≈四年全量日 K，
    三资产各自独立合理）——index/etf 在滚动 5 年窗口内数据完整，
    stock 深界 ≈2005-02-14 已于首轮 banked；
  - 累计待人工确认回填项（不变）：期货/期权快照 fields 扩容（分时逐分钟
    增量口径 → 求和为当日累计）、指数窗口 5 年滚动实测 vs 文档 10 年、
    history.start 回填、快照 data.timestamp 组装时刻口径复核、无效 key
    实测 2003 vs 文档 2001、start=2026-10-01 日期桶缺陷（是否归一化为
    空批待设计裁决——tiingo fx 边界钳制先例）。
  2026-11-13 第三轮（报告 20261113T214147+0800，**confirmed 9 / observe 6 /
  failed 0——全绿**，预算 23/60，pacing 2 秒）：option 目标窗口避开
  2026-10-01 缺陷日期后 availability 转正（confirmed，样本 3 根日 K，
  首根 2026-11-02，OHLC/volume/amount 齐备）——**「10-01 日期桶缺陷」
  定性收口：窗口规避有效，适配器映射（CFFEX→CFE、symbol 透传）与
  两端点全链路（bars 五资产 + quotes 五资产经 raw 观察）实证无缺陷**；
  depth 三目标复验一致（[2022,2025] 各 969 行）。两轮三报告存档：
  20261113T212034 / 213321 / 214147+0800。
  2026-11-14 ETF 复权口径实证立项（人工提出「ths 的 etf 没有复权吗」后
  核对文档发现口径矛盾）：fund historical 端点无 adjust 请求参数（复权
  方式不可选），但文档明示「adjust null 当前固定为 null；价格数据仍采用
  前复权口径」——现声明 [none] 与之存在错标风险（分红除息时前复权与不复权
  有实质差异，twelvedata SPY 先例 ~2.9%）。加入 ths-etf-dividend-window
  （510880 红利ETF，2023-01-01→2025-12-31 跨除息窗口）与
  ths-etf-adjust-field-shape（短窗口 data.adjust 字段观察）两个 observe
  case；参照序列（baostock sh.510880 none/qfq，ETF 复权生效性已实证）经
  目录外受控对比脚本实证（报告 probes/results/ths/etf-adjust-<ts>.md，
  baostock ResultData 非 JSON 形态、模块级 login/logout 模型不适配声明式
  client/close），结论人工裁决后回填声明（qfq 单值 / 维持 none+口径注记
  二选一），探针不自改 manifest。max_calls 60→80。
  2026-11-14 受控对比实证（报告 etf-adjust-20261114T080423+0800，脚本
  probes/results/etf_adjust_semantics.py）：**ths ETF 日线为固定前复权，
