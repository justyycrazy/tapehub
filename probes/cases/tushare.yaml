# tushare 数据探针：周/月线复权生效性、期货五所合约/主连与单次上限常态复验
#（交易所限定 chain 目标）、北交所接入复验，及错误指纹采集。
probe: tushare
version: 1

requires:
  extras: [tushare]
  env: [TAPEHUB_TUSHARE_TOKEN]

pacing:
  call_interval_s: 1.5
  timeout_s: 60
  # chain 展开（2026-11-13 raw→chain 收敛后）：availability 36（stock/SZSE/BSE
  # 基准 29 + 期货交易所限定目标 7：contract@CN-DCE/INE/CFFEX +
  # continuous@CN-DCE/CZCE/INE/CFFEX 各 1）+ adjust_diff 36（3 目标 × 3 周期
  # × 2 pair × 2 调）+ history_depth（stock 三周期 + contract 全量 +
  # continuous）+ limit 2（contract 结构性 suspect 如实保留 + continuous
  # P16Y）+ raw 2×2（目录 + 错误指纹），最坏约 160，留余量
  max_calls: 180

targets:
  stock:
    instrument: CN-SSE-600000
    window: {start: 2025-01-01, end: 2025-12-31}
    # min_bars 跨周期统一生效：月线 2025 年内约 12 根，下限取 10 贴近月线
    # 真实值（对齐 akshare/baostock/tickflow 的跨周期下限口径）；
    # 日线的量级与字段质量由 required_fields 兜底
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-SZSE:
    instrument: CN-SZSE-000001
    # 平安银行（深市主板）：交易所限定追加目标，SZ→SZ 后缀 chain 级实证
    #（此前仅文档示例 000001.SZ；框架 2026-11-12 起支持交易所限定键）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-BSE:
    instrument: CN-BSE-920000
    # 安徽凤凰（精选层存量平移，2020-12-23 上市）：BSE→BJ 后缀 2026-11-12
    # 接入（raw 三证：目录 920 段/daily/adj_factor，报告 20261112T172921
    # +0800），chain 级常态复验（availability × adjust_diff）；原 daily/
    # adj_factor 两条 raw 直测已入链退役，目录 case 保留作标的轮换证据
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  # 北交所不设独立 chain 目标：探针框架 chain 为市场级粒度（capability 每
  # 市场恰取一个基准标的），BSE 是 CN 内交易所段，适配器链路与 SSE/SZSE
  # 完全同构（仅 _STOCK_SUFFIXES 一个查表值，单测确定性覆盖）
  contract:
    instrument: CN-SHFE-CU2401
    window: {start: 2023-09-01, end: 2023-12-29}
    min_bars: 20
  contract@CN-DCE:
    # 大商所合约：适配器后缀直拼（CN-DCE-M2705 → M2705.DCE）。2026-11-12
    # 后缀 raw 直测实证（.DCE confirmed，报告 20261112T110412）并经人工确认
    # 扩容声明后，常态复验收敛为 chain 目标（原 fut-dce-suffix raw 退役）。
    # 合约会到期：运行前按大商所挂牌信息核对，失败如实记录，到期轮换为
    # 当时的现活合约
    instrument: CN-DCE-M2705
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-INE:
    # 上期能源合约：后缀直拼（CN-INE-SC2705 → SC2705.INE）；品种码统一大写
    #（2026-11-12 实证 tushare 统一大写，交易所原生小写 sc 无需保留）
    instrument: CN-INE-SC2705
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-CFFEX:
    # 中金所合约：后缀直拼（CN-CFFEX-IF2703 → IF2703.CFX）；季月合约
    instrument: CN-CFFEX-IF2703
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  continuous:
    instrument: CN-SHFE-CU
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-DCE:
    # DCE 主连：品种+L 由适配器映射（CN-DCE-M → ML.DCE；2026-11-12 五所连续
    # 代码实证，报告 20261112T133250）——instrument 写品种码不带 L；
    # 原 fut-dce-continuous-l raw 直测退役
    instrument: CN-DCE-M
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-CZCE:
    # CZCE 主连：CN-CZCE-SR → SRL.ZCE（4 位年月码体系下品种+L）；
    # 原 fut-czce-continuous-l raw 直测退役
    instrument: CN-CZCE-SR
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-INE:
    # INE 主连：CN-INE-SC → SCL.INE；原 fut-ine-continuous-l raw 直测退役
    instrument: CN-INE-SC
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-CFFEX:
    # CFFEX 例外：主力直拼不加 L（CN-CFFEX-IF → IF.CFX；IFL 为当月连续、
    # IFL1-3 为次月/当季/下季，均非主连）；原 fut-cffex-main-if 与
    # fut-shfe-main-cu（SHFE 主力/主连对照）raw 退役
    instrument: CN-CFFEX-IF
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # stock@CN-SZSE/CN-BSE 为逐所细分复验（2026-11-12 接入）：BSE 复权此前
    # 仅 adj_factor 输入侧直测，本轮补 none/qfq/hfq 全序列对比
    targets: [stock, stock@CN-SZSE, stock@CN-BSE]
    window: {start: 2024-01-01, end: 2024-12-31}   # 含分红除权日
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    # contract 走全量模式（已摘牌 CU2401 全量拉取直读最早 bar = 精确上市日，
    # approx=False）；continuous（CUL.SHF 主连）与 stock 走二分估计
    targets: [stock, contract, continuous]
    full_history_targets: [contract]
    earliest: 1991-01-01
    era_step_years: 5
    max_calls: 20
  limit_truncation:
    # contract 生命周期短触不到 2000 条上限（结构性 suspect 如实保留记录）；
    # continuous 主连 16 年窗口经链路打穿上限——原 fut-continuous-cap raw
    # 直测（2026-11-12：恰 2000 条、保尾截头）收敛入链，顺带复验适配器
    # partial 覆盖判定语义
    targets: [contract, continuous]
    interval: P1D
    max_range: P16Y
    documented_max: 2000

raw:
  # ── 2026-11-13 raw→chain 收敛：期货五所后缀（.DCE/.ZCE/.INE/.CFX）、连续
  #    合约五所代码（品种+L 主连、CFFEX 主力直拼）、fut_daily 2000 条上限、
  #    BSE daily/adj_factor 直测共 12 条 raw 直测 case 退役——均已实证扩容
  #    声明，由 chain 交易所限定目标、limit_truncation（continuous, P16Y）
  #    与 adjust_diff 常态复验（targets 注释与 notes 记录原始证据出处）。
  #    保留两条：目录（标的轮换证据来源）与错误指纹
  - id: bj-stock-directory-probe
    purpose: 北交所目录核实（stock_basic exchange=BSE 在市列表）：确认 .BJ 标的
      真实存在并记录代码段构成。首轮结论（20261112T172236）：全市场统一 920
      段，83/87/43 老段已迁移替换；常态复验目录仍在市——目录是在市标的的
      证据来源，后端链路由 chain stock@CN-BSE（availability × adjust_diff）
      复验，标的退市时按本 case 结果轮换 targets
    module: tushare
    client: {attr: pro_api, kwargs: {token: "$TAPEHUB_TUSHARE_TOKEN"}}
    call:
      - {method: query, kwargs: {api_name: "stock_basic", exchange: "BSE", list_status: "L"}}
    expect: {status: ok, min_rows: 1}
  # 错误指纹仅观察：采集“接口不存在/无权限”类原始报错文本，供错误码细分参考
  - id: unknown-api-fingerprint
    purpose: 采集未知接口名的原始错误指纹（仅观察，不判定）
    assert: false
    module: tushare
    client: {attr: pro_api, kwargs: {token: "$TAPEHUB_TUSHARE_TOKEN"}}
    call:
      - {method: query, kwargs: {api_name: "probe_nonexistent_api_for_fingerprint"}}
    expect: {status: error, error_contains: ""}

notes: >
  adjust_diff 已实证（报告 20261112T110412+0800）：P1W/P1M 的 qfq/hfq 与
  none 存在真实差异，官方「adj 仅日线复权」偏保守，manifest adjustments
  维持 [none, qfq, hfq] 不收敛。
  期货后缀实测（框架修复后报告 20261112T110412 / 20261112T111752）：
  .DCE / .INE / .CFX confirmed；.ZCE 可用（4 位年月码
  SR2601.ZCE 实测返回数据；此前 3 位原生码全空系代码格式所致，
  并非积分档位门槛）。fut_daily 单次上限经主连 CUL.SHF 实测恰为 2000 条、
  保尾截头（原 fut-continuous-cap raw）。四所后缀经人工确认后已扩容进能力
  目录（连同既有 .SHF 五所齐备，报告 20261112T124404+0800）；探针不自动改
  manifest，扩容由人工确认后单独提交。CZCE 约定速记：合约 ts_code 为 4 位
  年月码（SR2601.ZCE 直通）、fut_basic 的 exchange 参数用交易所代码 CZCE——
  与后缀 .ZCE 是两套约定。
  连续合约五所代码实证（报告 20261112T133250+0800）后声明 CN continuous
  （品种+L 主连、CFFEX 例外主力直拼，不参与 auto 路由）；BSE 三证后扩容
  （报告 20261112T172921+0800 / 20261112T175738+0800）。
  history_depth 已全量收敛回填（均经人工确认）：stock P1D/P1W/P1M
  ≈1999-12-08（approx ±90 天、两轮复现，报告 20261112T124404+0800）；
  contract 走全量模式精确定值 2023-01-17（= CU2401 上市首日，approx=False，
  报告 20261112T135507+0800）；continuous ≈1991-01-01（二分下限触底，
  真实可能更早，同报告）。
  raw→chain 收敛（2026-11-13）：期货五所合约后缀与主连代码、fut_daily 2000
  条上限均已实证扩容声明，常态复验收敛为 chain——交易所限定目标
  contract@CN-DCE/INE/CFFEX 与 continuous@CN-DCE/CZCE/INE/CFFEX（合约键
  会到期：运行前按交易所挂牌信息核对，失败如实记录，到期轮换现活合约），
  limit_truncation 加 continuous（P16Y 窗口经链路复验 2000 上限与保尾截头
  partial 语义）；原后缀/主连/上限/BSE daily·adj_factor 共 12 条 raw 直测
  case 退役（BSE daily/adj_factor 由 stock@CN-BSE availability × adjust_diff
  覆盖；目录 case 保留作标的轮换证据）。
