# tushare 数据探针：周/月线复权生效性、期货六所合约/主连与单次上限常态复验
#（交易所限定 chain 目标）、北交所接入复验、期权 INE/GFEX 扩容探测（opt_daily
# 已声明六所之外的两所未定案，raw 目录+日 K 直测，见 raw 段注释），及错误指纹
# 采集。
probe: tushare
version: 2

requires:
  extras: [tushare]
  env: [TAPEHUB_TUSHARE_TOKEN]

pacing:
  call_interval_s: 1.5
  timeout_s: 60
  # chain 展开（期权八所回填收编后）：availability 55（stock/SZSE/BSE 基准
  # + 期货交易所限定 contract/continuous 各 5 + index 基准/SZSE 限定
  # + etf 基准/SZSE 限定 + **option 八所逐所**）+ adjust_diff 36（3 目标 ×
  # 3 周期 × 2 pair × 2 调）+ history_depth（stock 三周期 + contract 全量 +
  # continuous + index 三周期 + etf 日线，逐 case 二分自预算 20、实测约
  # 14 调）+ limit 2（contract 结构性 suspect 如实保留 + continuous P16Y）+
  # raw 4 case 8 调（目录 2：bj 证券目录 + INE/GFEX 期权目录常态留存·标的
  # 轮换证据来源 + 错误指纹 2——期权 INE/GFEX 日 K 直测 2 条已随映射层八所
  # 回填收敛为 chain option@CN-INE/GFEX 目标，2026-11-16 第 17 轮聚焦轮后
  # 退役，见 raw 段注释），
  # 最坏 262（cli list 实测合计，含 history_depth 8 case × 上限 20 调；实测
  # 口径第 15 轮约 166——二分通常提前收敛），预算 300 对齐最坏口径留余量
  max_calls: 300

targets:
  stock:
    instrument: CN-SSE-600000
    window: {start: 2025-01-01, end: 2025-12-31}
    # min_bars 跨周期统一生效：月线 2025 年内约 12 根，下限取 10 贴近月线
    # 真实值（对齐 akshare/baostock/tickflow 的跨周期下限口径）；
    # 日线的量级与字段质量由 required_fields 兜底
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-SZSE:
    instrument: CN-SZSE-000001
    # 平安银行（深市主板）：交易所限定追加目标，SZ→SZ 后缀 chain 级实证
    #（此前仅文档示例 000001.SZ）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-BSE:
    instrument: CN-BSE-920000
    # 安徽凤凰（精选层存量平移，2020-12-23 上市）：BSE→BJ 后缀经 raw 三证
    # 接入（目录 920 段/daily/adj_factor），chain 级常态复验（availability
    # × adjust_diff）；原 daily/adj_factor 两条 raw 直测已入链退役，目录
    # case 保留作标的轮换证据
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  # 北交所不设独立 chain 目标：探针框架 chain 为市场级粒度（capability 每
  # 市场恰取一个基准标的），BSE 是 CN 内交易所段，适配器链路与 SSE/SZSE
  # 完全同构（仅 _STOCK_SUFFIXES 一个查表值，单测确定性覆盖）
  index:
    instrument: CN-SSE-000001
    # 上证指数：指数能力 chain 常态复验基准目标——指数扩容探针先行 4 条
    # raw 直测（2026-11-15 第 13 轮：index_daily/index_weekly/index_monthly
    # 三周期有数 117/26/6 行、1991 全年窗口 255 行下界、字段与股票同列集）
    # 实证扩容声明后收敛入链退役，availability 全声明矩阵展开（3 周期 × none）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index@CN-SZSE:
    instrument: CN-SZSE-399001
    # 深证成指：SZ→SZ 后缀 chain 级常态复验（指数拒绝范围 {SSE,SZSE} 的
    # SZSE 侧），参照 stock@CN-SZSE 先例
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf:
    instrument: CN-SSE-510050
    # 华夏上证 50ETF：ETF 能力 chain 常态复验基准目标——FD 探测轮 3 条 raw
    #（fund-daily-shape / fund-daily-early-history / fund-daily-szse-shape，
    # 2026-11-15 第 14/15 轮：沪深双所有数、2005 全年 213 行下界、字段与
    # 股票日线同列集、量纲自洽）实证扩容声明后收敛入链退役，availability
    # 全声明矩阵展开（P1D × none）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf@CN-SZSE:
    instrument: CN-SZSE-159915
    # 易方达创业板 ETF：SZ→SZ 后缀 chain 级常态复验（ETF 拒绝范围
    # {SSE,SZSE} 的 SZSE 侧），参照 stock@CN-SZSE 先例
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  option:
    instrument: CN-SSE-10012437
    # 50ETF 购 11 月 2800（近月）：期权能力 chain 常态复验基准目标——O 探测
    # 轮 6 条 raw（六所直测，2026-11-15 第 14/15 轮）实证扩容声明后收敛入链
    # 退役。合约会到期：到期轮换按 opt_basic（exchange=SSE，delist_date 未过
    # 筛近月）重选并更新本 target
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  option@CN-SZSE:
    instrument: CN-SZSE-90008083
    # 沪深300ETF 购 11 月 4400（近月）：SZ→SZ 后缀逐所复验；到期 2026-11-25，
    # 到期轮换按 opt_basic（exchange=SZSE，delist_date 未过筛近月）重选
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  option@CN-CFFEX:
    instrument: CN-CFFEX-IO2611-C-4150
    # 沪深300 购 11 月 4150（IO 主力系列）：CFFEX→CFX 后缀（与该所期货同）
    # 与带连字符符号直拼复验；到期 2026-11-20，到期轮换按 opt_basic
    # （exchange=CFFEX，ts_code 前缀 IO 筛主力 + delist_date 未过）重选
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  option@CN-DCE:
    instrument: CN-DCE-M2612-C-3500
    # 豆粕期权 2612 认购 3500（M 主力系列）：DCE 码式「品种4位月-C/P-行权价」
    # 直拼复验；到期 2026-11-17，到期轮换按 opt_basic（exchange=DCE，name 含
    # 豆粕 + delist_date 未过）重选
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  option@CN-SHFE:
    instrument: CN-SHFE-FU2612C6100
    # 燃料油购 12 月 6100：SHFE 码式「品种4位月C/P行权价」无连字符直拼复验；
    # 到期 2026-11-17，到期轮换按 opt_basic（exchange=SHFE，delist_date 未过）
    # 重选
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  option@CN-CZCE:
    instrument: CN-CZCE-SR701C5900
    # 白糖购 1 月 5900：CZCE 码式「品种3位月C/P行权价」直拼复验（3 位月码
    # 701=2027-01）；到期 2026-12-11，到期轮换按 opt_basic（exchange=CZCE，
    # name 含白糖 + delist_date 未过）重选
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  option@CN-INE:
    instrument: CN-INE-SC2701C550
    # 原油期权 2701 认购 550（无连字符式，与 SHFE 同构）：2026-11-16 聚焦轮
    # opt_basic 目录（6528 行，形态样本 SC2703P440.INE）+ opt_daily 5 行双证
    # 收编；550 为深虚近零成交，到期轮换按 opt_basic（exchange=INE，
    # delist_date 未过）重选 ATM/主力系列行权价
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  option@CN-GFEX:
    instrument: CN-GFEX-LC2701-C-90000
    # 碳酸锂期权 2701 认购 90000（连字符式「品种4位月-C/P-行权价.GFE」，与
    # 该所期货主连「品种+L」不同构）：聚焦轮 opt_basic 目录（12000 行，形态
    # 样本 PS2710-C-30000.GFE）+ opt_daily 5 行实量（vol 14744~17325）双证
    # 收编；轮换按 opt_basic（exchange=GFEX，delist_date 未过）重选
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  contract:
    instrument: CN-SHFE-CU2401
    window: {start: 2023-09-01, end: 2023-12-29}
    min_bars: 20
  contract@CN-DCE:
    # 大商所合约：适配器后缀直拼（CN-DCE-M2705 → M2705.DCE）。后缀 raw
    # 直测实证并扩容声明后，常态复验收敛为 chain 目标（原 fut-dce-suffix
    # raw 退役）。合约会到期：运行前按大商所挂牌信息核对，失败如实记录，
    # 到期轮换为当时的现活合约
    instrument: CN-DCE-M2705
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-INE:
    # 上期能源合约：后缀直拼（CN-INE-SC2705 → SC2705.INE）；品种码统一大写
    #（tushare 统一大写，交易所原生小写 sc 无需保留）
    instrument: CN-INE-SC2705
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-CFFEX:
    # 中金所合约：后缀直拼（CN-CFFEX-IF2703 → IF2703.CFX）；季月合约
    instrument: CN-CFFEX-IF2703
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-CZCE:
    # 郑商所合约：4 位年月码直通（CN-CZCE-RM2701 → RM2701.ZCE，五所探针
    # 实证 + akshare 新浪侧同日互证「4 位可用、3 位全空」），本目标补齐
    # 六所合约矩阵的常态复验。合约会到期：运行前按郑商所挂牌信息核对，
    # 失败如实记录，到期轮换为当时的现活合约
    instrument: CN-CZCE-RM2701
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-GFEX:
    # 广期所合约（碳酸锂为该所上市以来活跃度第一品种）：后缀直拼
    #（CN-GFEX-LC2706 → LC2706.GFE）。后缀与数据面 2026-11-16 探针实证
    #（fut_basic exchange=GFEX 在市 154 行、LC2706.GFE 一周 5 行真实数据）
    #——原「.GFE 未核实不声明」空档回填收编。合约会到期：运行前按广期所
    # 挂牌信息核对，失败如实记录，到期轮换为当时的现活合约
    instrument: CN-GFEX-LC2706
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  continuous:
    instrument: CN-SHFE-CU
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-DCE:
    # DCE 主连：品种+L 由适配器映射（CN-DCE-M → ML.DCE；五所连续代码实证）
    # ——instrument 写品种码不带 L；原 fut-dce-continuous-l raw 直测退役
    instrument: CN-DCE-M
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-CZCE:
    # CZCE 主连：CN-CZCE-SR → SRL.ZCE（4 位年月码体系下品种+L）；
    # 原 fut-czce-continuous-l raw 直测退役
    instrument: CN-CZCE-SR
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-INE:
    # INE 主连：CN-INE-SC → SCL.INE；原 fut-ine-continuous-l raw 直测退役
    instrument: CN-INE-SC
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-CFFEX:
    # CFFEX 例外：主力直拼不加 L（CN-CFFEX-IF → IF.CFX；IFL 为当月连续、
    # IFL1-3 为次月/当季/下季，均非主连）；原 fut-cffex-main-if 与
    # fut-shfe-main-cu（SHFE 主力/主连对照）raw 退役
    instrument: CN-CFFEX-IF
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-GFEX:
    # GFEX 主连：品种+L 由适配器映射（CN-GFEX-LC → LCL.GFE；与五所主连
    # 体系同构，2026-11-16 探针实证 LCL.GFE 一周 5 行 × 15 列真实数据）
    # ——instrument 写品种码不带 L；fut-gfex-directory-probe raw 收编退役
    instrument: CN-GFEX-LC
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # stock@CN-SZSE/CN-BSE 为逐所细分复验：BSE 复权此前仅 adj_factor 输入
    # 侧直测，补 none/qfq/hfq 全序列对比
    targets: [stock, stock@CN-SZSE, stock@CN-BSE]
    window: {start: 2024-01-01, end: 2024-12-31}   # 含分红除权日
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    # contract 走全量模式（已摘牌 CU2401 全量拉取直读最早 bar = 精确上市日，
    # approx=False）；continuous（CUL.SHF 主连）与 stock/index/etf 走二分估计
    #（option 不入列：合约级深度≠库级起点，库级保持 null 待专项核实）
    targets: [stock, contract, continuous, index, etf]
    full_history_targets: [contract]
    earliest: 1991-01-01
    era_step_years: 5
    max_calls: 20
  limit_truncation:
    # contract 生命周期短触不到 2000 条上限（结构性 suspect 如实保留记录）；
    # continuous 主连 16 年窗口经链路打穿上限——原 fut-continuous-cap raw
    # 直测（恰 2000 条、保尾截头）收敛入链，顺带复验适配器 partial 覆盖
    # 判定语义
    targets: [contract, continuous]
    interval: P1D
    max_range: P16Y
    documented_max: 2000

raw:
  # ── raw→chain 收敛：期货五所后缀（.DCE/.ZCE/.INE/.CFX）、连续
  #    合约五所代码（品种+L 主连、CFFEX 主力直拼）、fut_daily 2000 条上限、
  #    BSE daily/adj_factor 直测共 12 条 raw 直测 case 退役——均已实证扩容
  #    声明，由 chain 交易所限定目标、limit_truncation（continuous, P16Y）
  #    与 adjust_diff 常态复验（targets 注释与 notes 记录原始证据出处）；
  #    指数扩容探针先行 4 条（index-daily-shape / index-weekly-availability /
  #    index-monthly-availability / index-early-history-lower-bound，
  #    2026-11-15 第 13 轮实证：asset='I' 三周期有数 117/26/6 行、1991 全年
  #    窗口 255 行下界、字段与股票同列集，目录外诊断另定案周月线量额单位
  #    口径矛盾）扩容声明后由 chain index 基准/SZSE 限定目标与
  #    history_depth 常态复验，同轮退役（证据指针见
  #    probes/results/PROBE_LOG.md，本地不入库）；
  #    FD/O 探测轮 9 条（fund-daily-shape / fund-daily-early-history /
  #    fund-daily-szse-shape / option-daily-shape / option-daily-szse-shape /
  #    option-daily-cffex-shape / option-daily-dce-shape / option-daily-shfe-shape /
  #    option-daily-czce-shape，2026-11-15 第 14/15 轮：ETF 沪深双所有数、
  #    2005 全年 213 行下界、字段与股票日线同列集；期权六所码格式与数据面；
  #    目录外诊断另定案 fund_daily 量纲自洽与 opt_daily amount 万元口径）
#    实证扩容声明后由 chain etf 基准/SZSE 限定、option 六所目标与
#    history_depth（etf）常态复验，同轮退役。
#    GFEX 探测 1 条（fut-gfex-directory-probe，2026-11-16 第 16 轮实证：
#    fut_basic exchange=GFEX 在市 154 行、LC2706.GFE / LCL.GFE 各 5 行真实
#    数据——.GFE 后缀与主连品种+L 形态定案）随 manifest/映射层回填收敛，
#    由 chain contract@CN-GFEX / continuous@CN-GFEX 目标常态复验，同轮退役
#    （目录外复探另 1 调核实 fut_basic ts_code 形态，样本留存见框架证据）。
#    保留两条：目录（标的轮换证据来源）与错误指纹
  - id: bj-stock-directory-probe
    purpose: 北交所目录核实（stock_basic exchange=BSE 在市列表）：确认 .BJ 标的
      真实存在并记录代码段构成。首轮结论（20261112T172236）：全市场统一 920
      段，83/87/43 老段已迁移替换；常态复验目录仍在市——目录是在市标的的
      证据来源，后端链路由 chain stock@CN-BSE（availability × adjust_diff）
      复验，标的退市时按本 case 结果轮换 targets
    module: tushare
    client: {attr: pro_api, kwargs: {token: "$TAPEHUB_TUSHARE_TOKEN"}}
    call:
      - {method: query, kwargs: {api_name: "stock_basic", exchange: "BSE", list_status: "L"}}
    expect: {status: ok, min_rows: 1}
  # 错误指纹仅观察：采集“接口不存在/无权限”类原始报错文本，供错误码细分参考
  - id: unknown-api-fingerprint
    purpose: 采集未知接口名的原始错误指纹（仅观察，不判定）
    assert: false
    module: tushare
    client: {attr: pro_api, kwargs: {token: "$TAPEHUB_TUSHARE_TOKEN"}}
    call:
      - {method: query, kwargs: {api_name: "probe_nonexistent_api_for_fingerprint"}}
    expect: {status: error, error_contains: ""}

  # ── 已定案退役的期权 INE/GFEX 探测 raw：opt-ine-daily-shape（SC2701C550.INE
  #    5 行）与 opt-gfex-daily-shape（LC2701-C-90000.GFE 5 行实量）随映射层
  #    八所回填收敛为 chain option@CN-INE/GFEX 目标常态复验，2026-11-16 第
  #    17 轮聚焦轮后退役（首轮证据 report-tushare-20261116T080728+0800.md：
  #    INE 目录 6528 行 + 日 K 5 行；复测 report-tushare-20261116T081112+0800.md：
  #    GFEX 目录 12000 行、码式连字符式 PS2710-C-30000.GFE + 日 K 5 行实量；
  #    PROBE_LOG 第 17 轮）。
  #    保留两条目录探测（常态留存·标的轮换证据来源，与 bj-stock-directory-probe
  #    同款设计）：opt_basic 单次返回恰 12000 行疑为上游上限（三轮同值，待
  #    核实，不影响映射与日 K 结论）
  - id: opt-ine-directory-probe
