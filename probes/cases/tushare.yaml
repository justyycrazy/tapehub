# tushare 数据探针：周/月线复权生效性、期货六所合约/主连与单次上限常态复验
#（交易所限定 chain 目标）、北交所接入复验、期权八所日 K（opt_daily 已声明
# 六所、INE/GFEX 未定案两所已扩容），及错误指纹采集。
probe: tushare
version: 1

requires:
  extras: [tushare]
  env: [TAPEHUB_TUSHARE_TOKEN]

pacing:
  call_interval_s: 1.5
  timeout_s: 60
  # chain 展开（期权八所回填收编并 asset_type 三分后）：availability 55
  # （stock/SZSE/BSE 基准
  # + 期货交易所限定 contract/continuous 各 5 + index 基准/SZSE 限定
  # + etf 基准/SZSE 限定 + **期权三子类八所逐所**）+ adjust_diff 36（3 目标 ×
  # 3 周期 × 2 pair × 2 调）+ history_depth（stock 三周期 + continuous +
  # index 三周期 + etf 日线，逐 case 二分自预算 20、实测约
  # 14 调；contract 全量已随 2026-11-16「合约类不统计历史深度」决议移除）+
  # limit 2（contract 结构性 suspect 如实保留 + continuous P16Y）+
  # raw 1 case 2 调（错误指纹 1；目录 3 条 2026-11-18 退役——chain 收编后
  # 使命完成，轮换改目录外直测，见 raw 段注释），
  # 最坏 255（cli list 实测合计，含 history_depth 8 case × 上限 20 调；实测
  # 口径第 15 轮约 166——二分通常提前收敛），预算 300 对齐最坏口径留余量
  max_calls: 300

targets:
  stock:
    instrument: CN-SSE-600602
    # 云赛智联（老八股）：证券基准统一——与 alphafeed/baostock/futunn/tickflow
    # 同款「早上市标的」（原 600000，manifest stock history.start 1999-12-08
    # 疑似上市伪影，待换基准后复探）
    window: {start: 2025-01-01, end: 2025-12-31}
    # min_bars 跨周期统一生效：月线 2025 年内约 12 根，下限取 10 贴近月线
    # 真实值（对齐 akshare/baostock/tickflow 的跨周期下限口径）；
    # 日线的量级与字段质量由 required_fields 兜底
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-SZSE:
    instrument: CN-SZSE-000001
    # 平安银行（深市主板）：交易所限定追加目标，SZ→SZ 后缀 chain 级实证
    #（此前仅文档示例 000001.SZ）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-BSE:
    instrument: CN-BSE-920000
    # 安徽凤凰（精选层存量平移，2020-12-23 上市）：BSE→BJ 后缀经 raw 三证
    # 接入（目录 920 段/daily/adj_factor），chain 级常态复验（availability
    # × adjust_diff）；目录 case 已退役（2026-11-18，chain 收编后使命完成）
    # ——标的退市轮换时目录外直测 stock_basic exchange=BSE
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  # 北交所不设独立 chain 目标：探针框架 chain 为市场级粒度（capability 每
  # 市场恰取一个基准标的），BSE 是 CN 内交易所段，适配器链路与 SSE/SZSE
  # 完全同构（仅 _STOCK_SUFFIXES 一个查表值，单测确定性覆盖）
  index:
    instrument: CN-SSE-000001
    # 上证指数：指数能力 chain 常态复验基准目标——指数扩容探针先行 4 条
    # raw 直测（2026-11-15 第 13 轮：index_daily/index_weekly/index_monthly
    # 三周期有数 117/26/6 行、1991 全年窗口 255 行下界、字段与股票同列集）
    # 实证扩容声明，availability 全声明矩阵展开（3 周期 × none）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index@CN-SZSE:
    instrument: CN-SZSE-399001
    # 深证成指：SZ→SZ 后缀 chain 级常态复验（指数拒绝范围 {SSE,SZSE} 的
    # SZSE 侧），参照 stock@CN-SZSE 先例
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf:
    instrument: CN-SSE-510050
    # 华夏上证 50ETF：ETF 能力 chain 常态复验基准目标——FD 探测轮 3 条 raw
    #（fund-daily-shape / fund-daily-early-history / fund-daily-szse-shape，
    # 2026-11-15 第 14/15 轮：沪深双所有数、2005 全年 213 行下界、字段与
    # 股票日线同列集、量纲自洽）实证扩容声明，availability
    # 全声明矩阵展开（P1D × none）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf@CN-SZSE:
    instrument: CN-SZSE-159915
    # 易方达创业板 ETF：SZ→SZ 后缀 chain 级常态复验（ETF 拒绝范围
    # {SSE,SZSE} 的 SZSE 侧），参照 stock@CN-SZSE 先例
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf-option:
    instrument: CN-SSE-10011427
    expires: 2026-12-23
    # 50ETF 购 12 月 2900（ATM：现价 510050=2.889 / 行权价 2.90，listed
    # 2026-04-23 / delist 2026-12-23）：2026-11-16 到期前轮换——原近月
    # 10012437（购11月2800）2026-11-25 到期，按 opt_basic（exchange=SSE，
    # delist_date 未过筛近月）ATM 重选；码与 ths/tqsdk 侧同码三 Provider 互证。
    # 合约会到期：下次轮换按同款口径重选近月/次月 ATM
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  etf-option@CN-SZSE:
    instrument: CN-SZSE-90008043
    expires: 2026-12-23
    # 沪深300ETF 购 12 月 4300（ATM：现价 159919=4.266 / 行权价 4.30，listed
    # 2026-09-16 / delist 2026-12-23）：2026-11-16 到期前轮换——原近月
    # 90008083（购11月4400）2026-11-25 到期，按 opt_basic（exchange=SZSE，
    # delist_date 未过筛近月）ATM 重选；SZ→SZ 后缀逐所复验；码与 ths/tqsdk
    # 侧同码三 Provider 互证
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  index-option@CN-CFFEX:
    instrument: CN-CFFEX-IO2612C4000
    expires: 2026-12-31
    # 沪深300 购 12 月 4000：2026-11 到期前轮换——原 IO2611C4150（11 月主力）
    # 2026-11-20 到期，按 opt_basic（exchange=CFFEX，ts_code 前缀 IO 筛主力 +
    # delist_date 未过）重选；CFFEX→CFX 后缀（与该所期货同）与带连字符符号
    # 直拼复验；码与 ths/tqsdk 侧同码三 Provider 互证
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  commodity-option@CN-DCE:
    instrument: CN-DCE-M2701C3150
    expires: 2026-12-31
    # 豆粕期权 2701 认购 3150（ATM：M2701 期货收盘 3147 锚定，间隔 50）：
    # 2026-11 到期前轮换——原 M2612C3500（2612 认购 3500）2026-11-17 到期，
    # 按 opt_basic（exchange=DCE，name 含豆粕 + delist_date 未过）重选；
    # DCE 码式「品种4位月-C/P-行权价」直拼复验；码与 ths/tqsdk 侧同码
    # 三 Provider 互证
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  commodity-option@CN-SHFE:
    instrument: CN-SHFE-CU2701C102000
    expires: 2026-12-31
    # 铜期权 2701 认购 102000（ATM：CU2701 期货收盘 102740 锚定，间隔 2000）：
    # 2026-11 到期前轮换——原 FU2612C6100（燃料油购 12 月 6100）2026-11-17
    # 到期，按 opt_basic（exchange=SHFE，delist_date 未过）重选；SHFE 码式
    # 「品种4位月C/P行权价」无连字符直拼复验；码与 ths/tqsdk 侧同码
    # 三 Provider 互证
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  commodity-option@CN-CZCE:
    instrument: CN-CZCE-MA2701C3200
    expires: 2026-12-31
    # 甲醇期权购 1 月 3200：CZCE 期权品种统一——「甲醇为郑商所持仓王」（原
    # SR2701C5900 白糖换统一品种，原码三家同码互证留档）。CZCE 码式「品种
    # 3位月C/P行权价」→ 原生 MA701C3200.ZCE（4→3 还原）；行权价 3200 经
    # 人工锚定提供（2026-11-16）；到期轮换按 opt_basic（exchange=CZCE，
    # name 含甲醇 + delist_date 未过）重选 ATM
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  commodity-option@CN-INE:
    instrument: CN-INE-SC2701C550
    expires: 2026-12-31
    # 原油期权 2701 认购 550（无连字符式，与 SHFE 同构）：2026-11-16 聚焦轮
    # opt_basic 目录（6528 行，形态样本 SC2703P440.INE）+ opt_daily 5 行双证
    # 收编；550 为深虚近零成交，到期轮换按 opt_basic（exchange=INE，
    # delist_date 未过）重选 ATM/主力系列行权价
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  commodity-option@CN-GFEX:
    instrument: CN-GFEX-LC2701C88000
    expires: 2026-12-31
    # 碳酸锂期权 2701 认购 88000（ATM：LC2701 分时末点 87740 锚定，间隔
    # 2000；原 C90000 opt_daily 实量已证但 ths 分时端点 5003 逐合约缺口，
    # 统一取 88000）：连字符式「品种4位月-C/P-行权价.GFE」（与该所期货主连
    # 「品种+L」不同构）直拼复验；码与 ths/tqsdk 侧同码三 Provider 互证。
    # 合约会到期：轮换按 opt_basic（exchange=GFEX，delist_date 未过）重选
    window: {start: 2026-11-09, end: 2026-11-13}
    min_bars: 3
    required_fields: [open, high, low, close, volume, amount]
  contract:
    # 铜 2706（现活）：SHFE 基准统一——与 akshare/ths/tqsdk 现活基准同码
    #（原 CU2401「已摘牌稳定深度锚」随 2026-11-16 决议废止：合约类有时限
    # 标的不统计历史深度，无需为锚定保留已摘牌合约，决议见
    # docs/probes.md「规范化规则」）。合约会到期：运行前按上期所挂牌信息核对，
    # 失败如实记录，到期轮换为当时的现活合约
    instrument: CN-SHFE-CU2706
    expires: 2027-06-30
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-DCE:
    # 大商所合约：适配器后缀直拼（CN-DCE-M2705 → M2705.DCE）。后缀经直测
    # 实证并扩容声明，常态复验收敛为 chain 目标。合约会到期：运行前按大商所挂牌信息核对，失败如实记录，
    # 到期轮换为当时的现活合约
    instrument: CN-DCE-M2705
    expires: 2027-05-31
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-INE:
    # 原油 2706：INE 月码统一——与 akshare/tqsdk 同月同码（SC2706.INE，原
    # SC2705 换统一月码）；品种码统一大写（tushare 统一大写，交易所原生
    # 小写 sc 无需保留）。合约会到期：同上轮换
    instrument: CN-INE-SC2706
    expires: 2027-06-30
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-CFFEX:
    # 沪深300 股指期货 2706（季月，2026-10-19 挂牌）：CFFEX 月码统一——与
    # akshare/ths/tqsdk 同月同码（IF2706.CFX，原 IF2703 换统一月码）；窗口内
    # min_bars 20 恰达下限系季月挂牌晚的自然口径（akshare 第 15 轮同款）。
    # 合约会到期：同上轮换
    instrument: CN-CFFEX-IF2706
    expires: 2027-06-30
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-CZCE:
    # 甲醇 2701：CZCE 品种统一——「甲醇为郑商所持仓王」（原 RM2701 菜粕换
    # 统一品种）。tushare 只认 4 位年月码：2026-11-17 主轮 failed（0 根）+
    # 聚焦诊断轮裁决——3 位 MA701.ZCE 0 行、4 位 MA2701.ZCE 49 行（同窗
    # RM2701.ZCE 49 行对照、MAL.ZCE 当前窗有数），与 api.md「标准 symbol
    # 恒为 4 位年月」一致，用例字面量由 MA701 修正为 MA2701（其余 Provider
    # 的 CZCE 期货字面量统一问题另列 PROBE_LOG 待办）。合约会到期：运行前
    # 按郑商所挂牌信息核对，失败如实记录，到期轮换为当时的现活合约
    instrument: CN-CZCE-MA2701
    expires: 2027-01-31
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-GFEX:
    # 广期所合约（碳酸锂为该所上市以来活跃度第一品种）：后缀直拼
    #（CN-GFEX-LC2706 → LC2706.GFE）。后缀与数据面 2026-11-16 探针实证
    #（fut_basic exchange=GFEX 在市 154 行、LC2706.GFE 一周 5 行真实数据）
    #——原「.GFE 未核实不声明」空档回填收编。合约会到期：运行前按广期所
    # 挂牌信息核对，失败如实记录，到期轮换为当时的现活合约
    instrument: CN-GFEX-LC2706
    expires: 2027-06-30
    window: {start: 2026-09-01, end: 2026-12-31}
    min_bars: 20
  continuous:
    instrument: CN-SHFE-CU
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-DCE:
    # DCE 主连：品种+L 由适配器映射（CN-DCE-M → ML.DCE；五所连续代码实证）
    # ——instrument 写品种码不带 L
    instrument: CN-DCE-M
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-CZCE:
    # 甲醇主连：CZCE 品种统一——「甲醇为郑商所持仓王」（与 akshare/tqsdk
    # continuous MA 同品种；原 SR 白糖换统一品种）。CN-CZCE-MA → MAL.ZCE
    #（4 位年月码体系下品种+L 主连映射）
    instrument: CN-CZCE-MA
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-INE:
    # INE 主连：CN-INE-SC → SCL.INE
    instrument: CN-INE-SC
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-CFFEX:
    # CFFEX 例外：主力直拼不加 L（CN-CFFEX-IF → IF.CFX；IFL 为当月连续、
    # IFL1-3 为次月/当季/下季，均非主连）
    instrument: CN-CFFEX-IF
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  continuous@CN-GFEX:
    # GFEX 主连：品种+L 由适配器映射（CN-GFEX-LC → LCL.GFE；与五所主连
    # 体系同构，2026-11-16 探针实证 LCL.GFE 一周 5 行 × 15 列真实数据）
    # ——instrument 写品种码不带 L
    instrument: CN-GFEX-LC
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # stock@CN-SZSE/CN-BSE 为逐所细分复验：BSE 复权此前仅 adj_factor 输入
    # 侧直测，补 none/qfq/hfq 全序列对比
    targets: [stock, stock@CN-SZSE, stock@CN-BSE]
    window: {start: 2024-01-01, end: 2024-12-31}   # 含分红除权日
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    # 合约类有时限标的（contract 与期权三子类）不入列——2026-11-16 决议
    #（见 docs/probes.md「规范化规则」）：合约级「最早可用」随挂牌/摘牌
    # 轮换漂移，深度是资产类级结论，由存续性目标承载；contract 库级
    # history.start 保持 null 口径不变
    targets: [stock, continuous, index, etf]
    # earliest 1980：2026-11-17 主轮实证 floor(1991-01-01) 太浅——era#7
    # [1991,1996) 1261 行（600602 数据早于 1991），7 条深度 case 触底退化
    # first_bar=None；raw 裁决 stock 真实库底 1990-12-19（1990-12-19 窗
    # 3 行）。1980 为 baostock 同款口径，下限余量覆盖沪市开业
    earliest: 1980-01-01
    era_step_years: 5
    max_calls: 20
  limit_truncation:
    # contract 生命周期短触不到 2000 条上限（结构性 suspect 如实保留记录）；
    # continuous 主连 16 年窗口经链路打穿上限——原 fut-continuous-cap raw
    # 直测（恰 2000 条、保尾截头）收敛入链，顺带复验适配器 partial 覆盖
    # 判定语义
    targets: [contract, continuous]
    interval: P1D
    max_range: P16Y
    documented_max: 2000

raw:
  # ── 目录探针三条已退役（2026-11-18）：bj-stock-directory-probe 使命完成
  #    （.BJ 三证接入已 chain 收编 stock@CN-BSE 常态复验）；opt-ine/gfex
  #    两条退役后期权轮换口径八所统一——「事件触发时目录外直测 opt_basic +
  #    ATM 锚定重选」（与 ths/tqsdk 期权目标轮换注释同口径；此前仅 INE/GFEX
  #    两所常态留存系对称缺口）。目录 min_rows 判定本就不产出「该换哪个
  #    合约」，轮换属低频事件，常态留存探针不值得每轮消耗配额
  # 错误指纹仅观察：采集“接口不存在/无权限”类原始报错文本，供错误码细分参考
  - id: unknown-api-fingerprint
    purpose: 采集未知接口名的原始错误指纹（仅观察，不判定）
    assert: false
    module: tushare
    client: {attr: pro_api, kwargs: {token: "$TAPEHUB_TUSHARE_TOKEN"}}
    call:
      - {method: query, kwargs: {api_name: "probe_nonexistent_api_for_fingerprint"}}
    expect: {status: error, error_contains: ""}

notes: 探针框架规范见 docs/probes.md。
