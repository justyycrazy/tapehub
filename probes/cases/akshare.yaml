# akshare 数据探针：三源可用性、复权生效性、历史深度与字段语义核对。
# 无凭据要求；上游为公开站点，pacing 放宽防限流。
probe: akshare
version: 2

requires:
  extras: [akshare]

pacing:
  call_interval_s: 5.0   # 东方财富 push2 对高频断连限流：首次约 5 分钟恢复，
  timeout_s: 60          # 反复触发需 40 分钟以上；实测 2s 节流即被限流
  max_calls: 355         # availability 59（CN stock 15 + index 5 + etf 9 +
                         # 期货 12：contract 基准/CZCE + continuous 基准
                         # + 六所扩容 contract@CN-DCE/INE/GFEX/CFFEX 与
                         # continuous@CN-CZCE/DCE/INE/GFEX/CFFEX——新浪源
                         # 不受东财限流影响 + HK/US stock 各 9）+
                         # adjust_diff 24（P1D 限定）+
                         # history_depth 9 条 × ≤24 + variant_consistency 29
                         # + raw 1（bse-stock-fingerprint；
                         # sina-futures-czce-4digit/3digit 均已退役——4 位
                         # 直通由 chain contract@CN-CZCE 常态复验，3 位全空
                         # 负对照结论已与 tushare 侧同日互证定案；
                         # history_depth 不随逐所扩容——深度是资产类级结论，
                         # 基准目标承载）
  # ⚠ 东财限流恢复态脆弱：封禁期后单次零星调用「预检通过」不代表恢复——
  # 探针恢复 5s 节流访问模式后首个调用即再触发，且限流期内每轮失败调用
  # 都会延长封禁（越试越封）。重试规程：数小时零调用长冷却 → 单次预检 →
  # 通过后立即启动探针（不留间隙）；若仍秒封，考虑拉大 call_interval_s
  # 或更换网络出口。新浪/腾讯源不受东财限流影响

targets:
  stock:
    instrument: CN-SSE-600000
    window: {start: 2025-01-01, end: 2025-12-31}
    # 跨周期下限（D≈243 / W≈53 / M≈12 根），只用于拦截空结果；按日线标定会产生周/月假阳性
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  index:
    instrument: CN-SSE-000001
    window: {start: 2025-01-01, end: 2025-12-31}
    # 跨周期下限（指数 P1W/P1M：W≈53 / M≈12 根），只用于拦截空结果；
    # 按日线标定会产生周/月假阳性
    min_bars: 10
  etf:
    instrument: CN-SSE-510050
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10         # 跨周期下限，同 stock 口径
    required_fields: [open, high, low, close, volume, amount]
  stock@HK:
    instrument: HK-HKEX-00002
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10         # 跨周期下限，同 stock 口径
    required_fields: [open, high, low, close, volume]   # amount 币种/单位待核实，不预设必填
  stock@US:
    instrument: US-NYSE-GE
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  contract:
    instrument: CN-SHFE-RB2410
    window: {start: 2024-06-01, end: 2024-09-30}
    min_bars: 20
  contract@CN-CZCE:
    # 郑商所合约：标准码统一 4 位年月（公开现行约定；3 位码全空已与 tushare
    # 侧同日互证定案，原 raw 对照 case sina-futures-czce-3digit 随定案退役，
    # 证据见 probes/results/PROBE_LOG.md）。适配器当前原样透传，本目标
    # availability 即「4 位直通新浪」的常态复验
    instrument: CN-CZCE-RM2701
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-DCE:
    # 大商所合约（豆粕为全市场持仓前列品种）：新浪按品种+4位年月符号路由
    #（M2705），大商所收录性未实证，本目标 availability 即实证。合约会到期：
    # 运行前按大商所挂牌信息核对，失败如实记录，到期轮换为当时的现活合约
    instrument: CN-DCE-M2705
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-INE:
    # 上期能源合约（原油为该所绝对主力）：新浪收录性未实证（SC2706），
    # 本目标 availability 即实证。合约会到期：同上轮换
    instrument: CN-INE-SC2706
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-GFEX:
    # 广期所合约（碳酸锂为该所上市以来活跃度第一品种）：新浪对广期所的
    # 收录性未知（LC2706），本目标 availability 即实证。合约会到期：同上轮换
    instrument: CN-GFEX-LC2706
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-CFFEX:
    # 中金所合约（沪深300 历史最久、代表性强）：新浪股指期货符号形态未实证
    #（IF2706 季月），本目标 availability 即实证。合约会到期：同上轮换
    instrument: CN-CFFEX-IF2706
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  continuous:
    instrument: CN-SHFE-RB
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60
  continuous@CN-CZCE:
    # 郑商所主连（甲醇为郑商所持仓王）：「品种+0」形态（MA0）仅 SHFE RB0
    # 实证过，其余所未实证，本目标 availability 即实证
    instrument: CN-CZCE-MA
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60
  continuous@CN-DCE:
    # 大商所主连（豆粕）：M0 形态未实证，本目标 availability 即实证
    instrument: CN-DCE-M
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60
  continuous@CN-INE:
    # 上期能源主连（原油）：SC0 形态未实证，本目标 availability 即实证
    instrument: CN-INE-SC
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60
  continuous@CN-GFEX:
    # 广期所主连（碳酸锂）：LC0 形态与新浪广期所收录性均未知，失败如实记录
    instrument: CN-GFEX-LC
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60
  continuous@CN-CFFEX:
    # 中金所主连（沪深300）：IF0 形态未实证，失败如实记录
    instrument: CN-CFFEX-IF
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60

chain:
  include_declared: true
  skip: []
  adjust_diff:
    targets: [stock, etf, stock@HK, stock@US]
    intervals: [P1D]     # 周/月与日线同端点同复权参数（对齐 tickflow/alphafeed 做法，控预算）
    window: {start: 2024-06-01, end: 2024-08-31}   # 分红除权高发窗口
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    targets: [stock, index, etf, contract, continuous, stock@HK, stock@US]
    intervals: [P1D]     # 周/月与日线同端点同数据区间，同值声明（控预算）
    full_history_targets: [contract, continuous]
    earliest: 1930-01-01 # HK/US 库底可能深于 1991（对齐 tickflow/alphafeed），避免下限触底误报
    era_step_years: 10
    max_calls: 24        # 每条 case 的预算；按 (interval × variant) 展开（P1D 限定）
  variant_consistency:
    # 同一查询在 eastmoney/sina/tencent 下的序列一致性（三源一致性正式结论）；
    # HK/US 单变体无对比对，纯键 stock 的变体集合不受新能力影响
    targets: [stock, index]
    window: {start: 2025-06-01, end: 2025-12-31}
    fields: [close]
    tolerance: 0.01      # 指数新浪源多一位小数（±0.005）属表示层精度差，不是口径不一致

raw:
  # ── 北交所个股支持性指纹：东财 A 股接口 symbol 为纯 6 位代码，上游按
  #    代码首位判定市场（ETF 口径「5/6→沪、其余→深」），BSE 代码段（920
  #    等）的归属与覆盖未实证。本 case 直测观察：返回数据且首尾日期落在
  #    请求窗口 → BSE 个股可支持（后续议 chain 目标）；空/错误/他所数据 →
  #    指纹留档，维持「BSE 未探针不声明」口径。新浪/腾讯变体未测（支持性
  #    依据以东财缺省变体为准）
  - id: bse-stock-fingerprint
    purpose: 北交所个股（CN-BSE-920000 安徽凤凰，tushare 侧已探针证实存续）
      在东财 A 股接口（stock_zh_a_hist）的支持性指纹（观察不判定）：
      行数与首尾日期即归属与覆盖的直接证据。多轮实证 matched=False（东财
      A 股接口不返回 BSE 数据），维持「BSE 未探针不声明」口径——负闸门：
      上游转正后再议 stock@CN-BSE chain 目标并退役本 case
    module: akshare
    call:
      - {module_func: stock_zh_a_hist, kwargs: {symbol: "920000", period: "daily", start_date: "20251101", end_date: "20251112", adjust: ""}}
    expect: {status: ok, min_rows: 0}
    assert: false

notes: 各轮运行记录见 probes/results/PROBE_LOG.md（不入库）；探针框架规范见 probes/README.md。
