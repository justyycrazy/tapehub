# akshare 数据探针：三源可用性、复权生效性、历史深度与字段语义核对。
# 无凭据要求；上游为公开站点，pacing 放宽防限流。
probe: akshare
version: 2

requires:
  extras: [akshare]

pacing:
  call_interval_s: 5.0   # 东方财富 push2 对高频断连限流：首次约 5 分钟恢复，
  timeout_s: 60          # 反复触发需 40 分钟以上；实测 2s 节流即被限流
  max_calls: 400         # availability 91（CN stock 15 + stock@CN-SZSE 15 +
                         # index 5 + index@CN-SZSE 5 + index@CN-BSE 3
                         #（eastmoney 变体；sina/tencent 变体显式 skip）+
                         # etf 9 + etf@CN-SZSE 9 +
                         # 期货 12：contract 基准/CZCE + continuous 基准
                         # + 六所扩容 contract@CN-DCE/INE/GFEX/CFFEX 与
                         # continuous@CN-CZCE/DCE/INE/GFEX/CFFEX——新浪源
                         # 不受东财限流影响 + HK/US stock 各 9）+
                         # adjust_diff 24（P1D 限定）+
                         # history_depth 10 条（证券类 9 条 × ≤24 +
                         # continuous 全量 1；contract 深度已随
                         # 2026-11-16「合约类不统计历史深度」决议移除）+
                         # variant_consistency 29
                         # + raw 1（bse-stock-fingerprint）
                         # history_depth 不随逐所扩容——深度是资产类级结论，
                         # 基准目标承载）
  # ⚠ 东财限流恢复态脆弱：封禁期后单次零星调用「预检通过」不代表恢复——
  # 探针恢复 5s 节流访问模式后首个调用即再触发，且限流期内每轮失败调用
  # 都会延长封禁（越试越封）。重试规程：数小时零调用长冷却 → 单次预检 →
  # 通过后立即启动探针（不留间隙）；若仍秒封，考虑拉大 call_interval_s
  # 或更换网络出口。新浪/腾讯源不受东财限流影响

targets:
  stock:
    instrument: CN-SSE-600602
    # 云赛智联（原真空电子，1990-12-19 上市老八股）：证券基准统一——与
    # alphafeed/baostock/futunn/tickflow 同款「早上市标的」，库底收敛点为
    # 真实库底而非标的上市日伪影（原 600000 1999-11 上市，manifest stock
    # history.start 1999-12-08 疑似上市伪影，待换基准后复探）
    window: {start: 2025-01-01, end: 2025-12-31}
    # 跨周期下限（D≈243 / W≈53 / M≈12 根），只用于拦截空结果；按日线标定会产生周/月假阳性
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  stock@CN-SZSE:
    instrument: CN-SZSE-000001
    # 平安银行（深市主板）：交易所限定追加目标，三变体共用（eastmoney 纯
    # 6 位代码、sina/tencent sz 前缀，白名单均含 SZSE）。首验轮——声明内 +
    # mapper 放行，首次运行即实证。BSE 个股不设目标：东财接口不返回 BSE
    # 数据（bse-stock-fingerprint 负闸门在位），维持「BSE 未探针不声明」
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  index:
    instrument: CN-SSE-000001
    window: {start: 2025-01-01, end: 2025-12-31}
    # 跨周期下限（指数 P1W/P1M：W≈53 / M≈12 根），只用于拦截空结果；
    # 按日线标定会产生周/月假阳性
    min_bars: 10
  index@CN-SZSE:
    instrument: CN-SZSE-399001
    # 深证成指：交易所限定追加目标，三变体共用（eastmoney 纯代码自动判市、
    # sina/tencent sz399001 前缀，白名单均含 SZSE）。首验轮
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  index@CN-BSE:
    instrument: CN-BSE-899050
    # 北证 50：交易所限定追加目标——仅 eastmoney 变体放行（指数代码映射表
    # 探针实测覆盖 BSE，见 docs/providers/akshare.md）；sina/tencent 变体
    # 白名单仅 SSE/SZSE，其 BSE case 显式 skip（见 chain.skip）。首验轮
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
  etf:
    instrument: CN-SSE-510050
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10         # 跨周期下限，同 stock 口径
    required_fields: [open, high, low, close, volume, amount]
  etf@CN-SZSE:
    instrument: CN-SZSE-159915
    # 易方达创业板 ETF：交易所限定追加目标（仅 eastmoney 变体声明 ETF，
    # 纯代码首位「5/6→沪、其余→深」自动判向）。首验轮。BSE×ETF 不存在
    #（北交所无 ETF），不设该所目标
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@HK:
    instrument: HK-HKEX-00002
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10         # 跨周期下限，同 stock 口径
    required_fields: [open, high, low, close, volume]   # amount 币种/单位待核实，不预设必填
  stock@US:
    instrument: US-NYSE-GE
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  contract:
    instrument: CN-SHFE-CU2706
    # 铜 2706（现活）：SHFE 基准统一——与 ths/tqsdk 现活基准同码（原
    # RB2410→CU2401 的「已摘牌稳定深度锚」机制随 2026-11-16 决议废止：
    # 合约类有时限标的不统计历史深度，无需为锚定保留已摘牌合约，决议见
    # docs/probes.md「规范化规则」）。合约会到期：运行前按上期所挂牌
    # 信息核对，失败如实记录，到期轮换为当时的现活合约
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-CZCE:
    # 甲醇 2701：CZCE 品种统一——「甲醇为郑商所持仓王」（与 continuous MA
    # 同品种；原 RM2701 菜粕换统一品种）。标准码统一 4 位年月（tushare 侧
    # 实证 4 位可用、3 位全空；域层自 2026-11-17 起 3 位旧写法构造期拒绝）。
    # 新浪侧 3 位 MA701 已实证可用（2026-11-16 聚焦轮，当时 3 位字面量直通），
    # 4 位直通行为从未验证——本目标即标准式 4 位直通新浪的实证：查空则
    # 适配器需补 4→3 还原（与 tqsdk/ths 同构）后复验
    instrument: CN-CZCE-MA2701
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-DCE:
    # 大商所合约（豆粕为全市场持仓前列品种）：新浪按品种+4位年月符号路由
    #（M2705），大商所收录性未实证，本目标 availability 即实证。合约会到期：
    # 运行前按大商所挂牌信息核对，失败如实记录，到期轮换为当时的现活合约
    instrument: CN-DCE-M2705
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-INE:
    # 上期能源合约（原油为该所绝对主力）：新浪收录性未实证（SC2706），
    # 本目标 availability 即实证。合约会到期：同上轮换
    instrument: CN-INE-SC2706
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-GFEX:
    # 广期所合约（碳酸锂为该所上市以来活跃度第一品种）：新浪对广期所的
    # 收录性未知（LC2706），本目标 availability 即实证。合约会到期：同上轮换
    instrument: CN-GFEX-LC2706
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  contract@CN-CFFEX:
    # 中金所合约（沪深300 历史最久、代表性强）：新浪股指期货符号形态未实证
    #（IF2706 季月），本目标 availability 即实证。合约会到期：同上轮换
    instrument: CN-CFFEX-IF2706
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  continuous:
    instrument: CN-SHFE-CU
    # 铜主连：SHFE 品种统一——与 tqsdk/tushare continuous 同款（原 RB 螺纹
    # 主连载统一品种）；manifest continuous history.start 2009-03-27 系 RB0
    # 主连起点，换品种后待复探修订（CU0 起点未知，复探收敛后人工确认回填）
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60
  continuous@CN-CZCE:
    # 郑商所主连（甲醇为郑商所持仓王）：「品种+0」形态（MA0）仅 SHFE RB0
    # 实证过，其余所未实证，本目标 availability 即实证
    instrument: CN-CZCE-MA
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60
  continuous@CN-DCE:
    # 大商所主连（豆粕）：M0 形态未实证，本目标 availability 即实证
    instrument: CN-DCE-M
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60
  continuous@CN-INE:
    # 上期能源主连（原油）：SC0 形态未实证，本目标 availability 即实证
    instrument: CN-INE-SC
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60
  continuous@CN-GFEX:
    # 广期所主连（碳酸锂）：LC0 形态与新浪广期所收录性均未知，失败如实记录
    instrument: CN-GFEX-LC
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60
  continuous@CN-CFFEX:
    # 中金所主连（沪深300）：IF0 形态未实证，失败如实记录
    instrument: CN-CFFEX-IF
    window: {start: 2025-01-01, end: 2025-06-30}
    min_bars: 60

chain:
  include_declared: true
  skip:
    # index@CN-BSE 仅 eastmoney 变体放行：sina/tencent 变体指数白名单为
    # {SSE, SZSE}（映射层拒绝 BSE），其 BSE availability case 显式跳过——
    # 变体不对称如实留痕，eastmoney 侧常态复验
    - case: index@CN-BSE-P1D-none-sina
      reason: sina 变体指数白名单仅 SSE/SZSE，映射层拒绝 BSE（不做上游调用）
    - case: index@CN-BSE-P1D-none-tencent
      reason: tencent 变体指数白名单仅 SSE/SZSE，映射层拒绝 BSE（不做上游调用）
  adjust_diff:
    targets: [stock, etf, stock@HK, stock@US]
    intervals: [P1D]     # 周/月与日线同端点同复权参数（对齐 tickflow/alphafeed 做法，控预算）
    window: {start: 2024-06-01, end: 2024-08-31}   # 分红除权高发窗口
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    # 合约类有时限标的（contract）不入列——2026-11-16 决议（见
    # docs/probes.md「规范化规则」）：合约级「最早可用」随挂牌/摘牌
    # 轮换漂移，深度是资产类级结论，由存续性目标承载
    targets: [stock, index, etf, continuous, stock@HK, stock@US]
    intervals: [P1D]     # 周/月与日线同端点同数据区间，同值声明（控预算）
    full_history_targets: [continuous]
    earliest: 1930-01-01 # HK/US 库底可能深于 1991（对齐 tickflow/alphafeed），避免下限触底误报
    era_step_years: 10
    max_calls: 24        # 每条 case 的预算；按 (interval × variant) 展开（P1D 限定）
  variant_consistency:
    # 同一查询在 eastmoney/sina/tencent 下的序列一致性（三源一致性正式结论）；
    # HK/US 单变体无对比对，纯键 stock 的变体集合不受新能力影响
    targets: [stock, index]
    window: {start: 2025-06-01, end: 2025-12-31}
    fields: [close]
    tolerance: 0.01      # 指数新浪源多一位小数（±0.005）属表示层精度差，不是口径不一致

raw:
  # ── 北交所个股支持性指纹：东财 A 股接口 symbol 为纯 6 位代码，上游按
  #    代码首位判定市场（ETF 口径「5/6→沪、其余→深」），BSE 代码段（920
  #    等）的归属与覆盖未实证。本 case 直测观察：返回数据且首尾日期落在
  #    请求窗口 → BSE 个股可支持（后续议 chain 目标）；空/错误/他所数据 →
  #    指纹留档，维持「BSE 未探针不声明」口径。新浪/腾讯变体未测（支持性
  #    依据以东财缺省变体为准）
  - id: bse-stock-fingerprint
    purpose: 北交所个股（CN-BSE-920000 安徽凤凰，tushare 侧已探针证实存续）
      在东财 A 股接口（stock_zh_a_hist）的支持性指纹（观察不判定）：
      行数与首尾日期即归属与覆盖的直接证据。多轮实证 matched=False（东财
      A 股接口不返回 BSE 数据），维持「BSE 未探针不声明」口径——负闸门：
      上游转正后再议 stock@CN-BSE chain 目标并退役本 case
    module: akshare
    call:
      - {module_func: stock_zh_a_hist, kwargs: {symbol: "920000", period: "daily", start_date: "20251101", end_date: "20251112", adjust: ""}}
    expect: {status: ok, min_rows: 0}
    assert: false

notes: 探针框架规范见 docs/probes.md。
