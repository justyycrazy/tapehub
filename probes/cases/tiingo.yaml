# Tiingo 数据探针：外汇/加密货币历史K线可用性、历史深度、单次上限观察、
# 墙钟口径与扩容周期探测，及错误指纹采集。
#
# 免费档限额（官方口径）：50 请求/小时、1000 请求/天、500 个唯一品种/月、
# 1GB 带宽/月。pacing 90 秒（任意 60 分钟窗口 ≤40 次 < 50 次，留 ~20% 余量）；
# 预算 120 覆盖单轮全量（约 2.5~3 小时，框架对截断如实记录、次日续跑）。
probe: tiingo
version: 2

requires:
  # extras 按「可导入模块名」判定（框架 _module_available）：tiingo 无官方
  # SDK，raw case 反射 httpx 直连（pyproject 可选依赖组名亦为 tiingo，
  # 由 uv sync --extra tiingo 提供 httpx）
  extras: [httpx]
  env: [TAPEHUB_TIINGO_API_KEY]

pacing:
  call_interval_s: 90.0
  timeout_s: 60
  # 本轮构成：availability 6（forex/crypto × 3 声明周期）+ quote_availability
  # 2（quotes 声明随 include_declared 自动展开：forex + crypto 各 1 调）+
  # history_depth 6 case（forex/crypto × PT1H/PT4H/P1D，逐周期探测）× 16 最坏
  # + raw 1 case × 2 调用 ≈ 70 典型、106 最坏，预算 120 留余量
  max_calls: 120

targets:
  forex:
    instrument: GLOBAL-OTC-EUR/USD
    window: {start: 2024-01-01, end: 2025-12-31}
    # min_bars 按资产类型统一生效、覆盖全部声明周期：窗口取两年、下限取 20，
    # 以最稀的月线为标定——tiingo 无周/月线，两年日线约 520 根，20 为保守下限
    min_bars: 20
  crypto:
    instrument: GLOBAL-CRYPTO-BTC/USD
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20

chain:
  include_declared: true
  skip: []
  # 无 adjust_diff：外汇/加密货币无复权概念（能力目录仅声明 none，
  # 无多复权可对比）
  history_depth:
    # 逐周期探测：「机制边界外推不作为逐周期证据，必须逐周期探测」——
    # 周期面收窄至 PT1H/PT4H/P1D。P1D 预期 ≈2020-01/02-15（fx 边界锚）/
    # ≈2011-08-25（crypto 二分既证）作漂移对照；PT1H/PT4H 为首次独立探测、
    # 无预期锚——同业先例日内库常显著浅于日线库（twelvedata crypto 日线
    # ≈2017-08 vs 1min ≈2020-04）
    targets: [forex, crypto]
    earliest: 2000-01-01
    era_step_years: 5
    max_calls: 16
    intervals: [PT1H, PT4H, P1D]
  # limit_truncation 撤下：fx PT1M 已随周期面收窄退出声明，
  # 分段语义（≈6 自然日/段）不再影响任何声明周期（PT1H 一月窗完整实证、
  # PT4H/P1D 段容量远超实用窗长）；crypto 行数上限（≈5001）partial 判定
  # 不限周期、由单测守护（test_crypto_segment_row_cap_partial）

raw:
  # 错误指纹仅观察：采集无效 API Token 的原始报错，供 UPSTREAM 细分错误码
  # 参考（httpx 反射直连；token 走 query 参数为官方支持方式，与适配器的
  # Authorization 头等价，仅探针观察用）
  - id: tg-invalid-key-fingerprint
    purpose: 采集无效 API Token 的错误指纹（字面量假 Key，非真实凭据；仅观察）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://api.tiingo.com/tiingo/fx/eurusd/prices", params: {token: "probe-invalid-key-not-a-credential", startDate: "2025-01-01", endDate: "2025-01-02", resampleFreq: "1day"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: error, error_contains: ""}
    close: {method: close, kwargs: {}}

notes: 探针框架规范见 docs/probes.md。
