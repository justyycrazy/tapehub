# 富途 OpenAPI（futunn）数据探针：三市场全声明维度可用性、逐所细分
# （SZSE/BSE）、复权生效性、历史深度（逐周期 era 二分）、无签名错误指纹采集。
#
# 限频与额度（官方口径 2026-11-14）：IP 入口层行情类 100 次/分钟；业务限流
# 走 HTTP 200 + ret_code=-11。**历史 K 线独立额度池：每标的首次成功返回
# 非空即占用一个额度（默认 7×24 小时后释放，重复读取不延期）**——首轮已
# 占 5 个基准标的额度，depth 专项复用同标的（重复读取不新增占用）；逐所
# 细分新增 SZ.000001/BJ.920000 两个标的占用（容量数值未公布，保守 +2）。
# pacing 2 秒（任意 60 秒窗口 ≤30 次 < 100 次，留 3 倍余量）。
probe: futunn
version: 1

requires:
  # extras 按「可导入模块名」判定（框架 _module_available）：futunn 无官方
  # SDK，adapter 经 httpx 直连 + cryptography 本地签名（pyproject 可选依赖
  # 组名亦为 futunn，由 uv sync --extra futunn 提供）
  extras: [httpx, cryptography]
  env: [TAPEHUB_FUTUNN_APP_KEY, TAPEHUB_FUTUNN_PRIVATE_KEY_PATH]

pacing:
  # IP 入口层行情类 100 次/分钟：2 秒间隔 ≈ 30 次/分钟，留 3 倍余量；
  # 历史额度池按标的计量（同标的重复读取不延期），分页续读用 page_token
  # 免计「首请求」（实测上游未签发 token，分页循环保留为防御）
  call_interval_s: 2.0
  timeout_s: 60
  # 本轮构成（2026-11-14 第二轮，逐所细分 + depth 专项启用）：availability
  # 144（首轮 88 + 逐所 SZSE/BSE stock 各 24 + BSE index 8）+ adjust_diff
  # 12（6 case × 2 调）+ history_depth 8 case × ≤16 = 128 最坏 + raw 3 ≈
  # 287 最坏，预算 300 留余量（约 12 分钟）
  max_calls: 300

# 跨三市场（CN/HK/US）声明能力：用市场限定目标（stock@MARKET）为每个市场
# 提供独立基准标的；case id 以限定键为前缀（如 stock@HK-P1D-...）。
# 基准沿用 alphafeed/tickflow 探针定稿的早上市标的（老八股/中电控股/GE），
# 历史深度收敛点是真实库底而非标的上市日伪影。
targets:
  stock@CN:
    instrument: CN-SSE-600602
    # 云赛智联（原真空电子），1990-12-19 上交所开业首批「老八股」且现存续
    window: {start: 2025-01-01, end: 2025-12-31}
    # 跨周期下限（分钟族数千 / 日 ≈243 / 周 ≈52 / 月 ≈12 根），以最稀的
    # 月线标定，只用于拦截空结果
    min_bars: 10
    # amount 不预设必填：turnover 口径与币种待本轮观察（各市场原币原值
    # 透出，volume_precision 还原后的 volume 一并观察）
    required_fields: [open, high, low, close, volume]
  index@CN:
    instrument: CN-SSE-000001
    # 上证指数（1991-07-15 发布）：指数无复权语义，volume 口径一并观察
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  etf@CN:
    instrument: CN-SSE-510300
    # 华泰柏瑞沪深300ETF（2012-05-28 上市）：autype 对 ETF 生效性未实证
    #（能力目录仅声明 none），复权生效性观察留待 raw/后续轮
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  stock@CN-SZSE:
    instrument: CN-SZSE-000001
    # 平安银行（深市主板，alphafeed 逐所细分同款目标）：.SZ 前缀此前仅
    # 品类表核实、价格端点零实证——本轮 chain 级实证（2026-11-14 第二轮）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  stock@CN-BSE:
    instrument: CN-BSE-920000
    # 安徽凤凰（北交所 920 段，alphafeed 逐所细分同款目标）：品类表明示
    # BJ 支持正股，价格端点此前零实证——本轮 chain 级实证，不通过则收窄
    # exchange 白名单（ths「BJ 仅元信息域实证不收」先例对照）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  index@CN-BSE:
    instrument: CN-BSE-899050
    # 北证 50 指数：品类表 BJ 支持指数，价格端点零实证——同上
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  stock@HK:
    instrument: HK-HKEX-00002
    # 中电控股，港股最古老上市标的之一（alphafeed 探针同款基准）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  stock@US:
    instrument: US-NYSE-GE
    # GE，1892 年 NYSE 上市且现存续（alphafeed/tickflow 探针同款基准）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # 三市场个股复权生效性（qfq/hfq 是否生效、基准为何）：日线足以判定，
    # 收敛 interval 控制预算（参照 alphafeed/tickflow 先例）；分红除权
    # 高发窗口放大前复权差异。ETF 仅声明 none、复权生效性不在此对比
    targets: [stock@CN, stock@HK, stock@US]
    window: {start: 2024-06-01, end: 2024-08-31}
    intervals: [P1D]
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  # history_depth 启用（2026-11-14 第二轮，人工确认）：额度池约束解除——
  # depth 复用已占额度的基准标的（重复读取不新增占用），成本仅 IP 频率；
  # tiingo 裁决「逐周期独立探测，机制边界外推不作为逐周期证据」→ 8 周期
  # 全跑；targets 收敛 CN 老八股 600602（1990-12-19 上市，深度收敛点为
  # 真实库底而非上市日伪影），earliest 1990-01-01
  history_depth:
    targets: [stock@CN]
    earliest: 1990-01-01
    era_step_years: 5
    max_calls: 16
    intervals: [PT1M, PT5M, PT15M, PT30M, PT1H, P1D, P1W, P1M]

raw:
  # 错误指纹仅观察：采集无签名请求的 401 报文形态（ret_code/code 封装、
  # 错误码 -12006 等），供鉴权失败路径的防御分支核实（字面量假 Key，
  # 非真实凭据）
  - id: futunn-no-signature-fingerprint
    purpose: 采集无签名/无效 AppKey 请求的错误指纹（HTTP 401 形态；仅观察）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://webapi.futunn.com/api/v1.0/quote/HK.00700/history-kline?start=2025-01-01&end=2025-01-02&ktype=2&autype=0&num=10", headers: {"X-Api-Key": "probe-invalid-key-not-a-credential"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: error, error_contains: ""}
    close: {method: close, kwargs: {}}

notes: >
  2026-11-14 接入首轮 case 设计（真实跑前占位）：接入范围用户拍板 CN
  stock（SSE/SZSE/BSE）/index/etf（SSE/SZSE）+ HK stock + US stock ×
  bars/quotes；8 核心周期（PT1M~P1H/P1D/P1W/P1M）全量声明、history 全
  null（历史覆盖未核实）；stock 三复权声明（autype 文档明示）、index/etf
  仅 none。待回填项（探针报告 → 人工确认 → manifest/README 单独提交）：
  ①各周期 history.start（额度池核实后 depth 专项）；②adjust_diff 复权
  生效性（qfq/hfq 差异基准；若与 none 一致判 suspect 并收窄声明）；
  ③ETF autype 生效性（声明外观察，生效则扩声明）；④turnover/volume
  口径与币种、volume_precision 非零品类分布；⑤日/周/月 K 线 time_key
  墙钟口径（北京零点还是市场零点，影响闭区间复核与 README 时间口径段）；
  ⑥quotes data_time 口径与盘前盘后段是否透出 extensions。
  2026-11-14 首轮（报告 20261114T111229+0800，confirmed 94 / observe 1 /
  **failed 0**，预算 103/120）：三市场 × 8 周期 availability 全 confirmed、
  adjust_diff 6/6 confirmed（三市场 stock qfq/hfq 均生效，复权声明面
  维持）、raw 401 指纹 observe（{'code': -12006, 'trace_id': ...}——新封装
  code 键，与适配器防御读 code 键一致）。日/周/月线全窗口完整（P1D
  243/246/249、P1W 52、P1M 12，与交易日历吻合）。目录外实证（同日）：
  quotes 5 组合全 OK——data_time 口径 CN 收盘 15:00 整、HK 最后成交时刻、
  US 美东收盘 16:00 毫秒精度，extensions 白名单 7 键齐备。**实证定案**：
  ①time_key 墙钟口径——CN/HK 日/周/月线北京零点（00:00+08）、US 为美东
  零点（13:00+08）、分钟线盘中时刻（北京时间），绝对时刻口径与
  response_mapper 现实现一致，无需改动；②time_zone 字段实测为小时口径
  （8）非文档的分钟偏移（480）——不参与标准化，仅记录（文档失真第 1 处）；
  ③**num 参数被上游忽略**：请求传 370 实测单页返回 1000 行、
  pagination.has_more 恒 False 且无 next_page_token——page_token 分页
  实际不可用（文档失真第 2 处），单查询上限 ≈1000 行、从窗口起点升序
  截断（适配器分页循环与 UPSTREAM_MAX_BARS=5550 现状不触发、保留为防御）；
  ④**分钟族隐式截断 + partial 缺口（待人工裁决）**：PT1M 全年窗实测
  count=1000/911（CN/US）、单月窗 1000/1000、末根远早于窗口 end 且
  meta.partial=False——窗口 >1000 根时静默截断无信号；候选方案：行数
  触顶+末根<end 判 partial / README 隐式截断说明（th「partial 恒 false
  待核实」先例）/ 收窄分钟族声明，三选一待定；额度占用：5 个基准标的各
  1 个历史额度（7×24h 释放），预检/取证复用同标的未新增。待回填项新增：
  ⑦partial 语义裁决；history.start 仍 null（depth 待额度池容量核实后
  单独立项）。
  2026-11-14 partial 裁决落地（人工拍板）：分钟族隐式截断按「README 如实
  说明 + partial 维持 false」处理（ths「partial 恒 false 待核实」同构
  先例）——上游无截断信号（has_more 恒 False、行数上限 ≈1000 且 US 个案
  低于 1000 使行数阈值判定漏判），适配器分页循环与触顶防御判定保留；
  README/manifest/adapter docstring 三处注释同步，不动能力声明面。
  2026-11-14 分页约定页核对（官方 quote/pagination，用户提示）：契约确认——
  分页信息在响应顶层 pagination、以 has_more=false 停止、续页优先
  page_token 没有令牌时回传 data.next_time——适配器读法与停止语义对齐
  官方契约（实现无误）；补取证：PT1M 月窗信封 data 顶层仅
  kline_list+volume_precision，next_page_token 与 data.next_time 两种
  续页游标均未签发——「单查询 ≈1000 行截断、分页不可用」定案维持，
  裁决不变；待查线索：history-kline 页称 page_token 与「历史额度保护」
  绑定，当前账号两种游标均未出现，可能为账号/服务端层行数上限或待开通
  配置——下轮探针核对，若 token 开始签发适配器分页循环自动生效。
  2026-11-14 第二轮（报告 20261114T121154+0800，confirmed 150 / observe 9 /
  **failed 0**，预算 225/300）：逐所 SZSE/BSE availability 全 confirmed
  （SZ.000001 正股、BJ.920000 正股、BJ.899050 北证50 指数价格端点真实
  可用，行数/首末根与 SSE 完全同构——exchange 白名单维持无需收窄）；
  depth 专项 CN stock（600602 老八股，1990-12-19 上市）8 周期全 observe
  收敛——**分钟族 5 周期各自独立二分一致收敛 ≈2014-01-21T09:45+08:00**
  （90 天粒度 approx，跨周期互证）；P1D/P1W/P1M 全 era 满到 earliest
  边界 1990-01-01（P1D 1000 行截断 floor-hit；P1W/P1M 无截断，era#7
  [1990-1995] count=208/49 与上市日 1990-12-19 精确吻合——缺口恰为
  1990 年前 50 周/11 个月）。目录外实证（同日）：ETF autype 三值复权
  证据链完成——510300 日线 2024 全年 242/242 close 全差异（none vs qfq）
  + hfq vs none 242/242 差异 → autype 对 ETF 生效；错误指纹
  -7 invalid symbol（HK.99999）/ -8 unsupported market（UK.00700）落袋；
  US.GE 盘前/盘后/夜盘段全有真实数据（上周五盘后 60.3 万股）——
  extensions 扩容候选；NASDAQ 消歧 OK（US.AAPL 直通），time_key 夏令
  再证（6 月日线 12:00+08=美东零点 EDT、1 月 13:00+08=EST）。额度占用
  累计 8 个标的（首轮 5 + 逐所 2 + 消歧 1）。待人工确认回填清单：
  ①CN stock history.start（P1W/P1M 独立实证库底 ≈1990-12-19 上市日锚、
  P1D 同库互证、SZSE/BSE 未单独 depth）；②分钟族 5 周期 history.start
  ≈2014-01-21（approx 90 天粒度）；③etf adjustments 扩 [none,qfq,hfq]；
  ④extensions 盘前盘后段扩容与否。
  2026-11-14 回填落地（人工确认）：①CN stock 日/周/月线 history.start =
  1990-12-19T00:00:00+08:00（上市日锚：P1W/P1M era#7 count 缺口精确
  吻合、P1D 同库互证 floor-hit；SZSE/BSE 未单独 depth，capability 级
  声明以基准标的库底为准，README 注明）；②分钟族 PT1M~PT1H
  history.start = 2014-01-21T09:45:00+08:00（五周期独立二分一致收敛，
  90 天粒度 approx）；③etf adjustments 扩 [none, qfq, hfq]（operations
  8→24 条，manifest/README/契约测试断言同步）；④extensions 盘前盘后段
  扩容搁置（本轮不落地，证据保留于本 notes，字段选型设计待后续立项）。
