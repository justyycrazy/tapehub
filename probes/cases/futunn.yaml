# 富途 OpenAPI（futunn）数据探针：三市场全声明维度可用性、逐所细分
# （SZSE/BSE）、复权生效性、历史深度（逐周期 era 二分）、无签名错误指纹
# 与校时端点形态采集。
#
# 限频与额度（官方口径）：IP 入口层行情类 100 次/分钟；业务限流走
# HTTP 200 + ret_code=-11。历史 K 线独立额度池：每标的首次成功返回非空
# 即占用一个额度（默认 7×24 小时后释放，重复读取不延期）——depth 专项
# 复用 availability 已占额度的基准标的（不新增占用；容量数值未公布）。
# pacing 2 秒（任意 60 秒窗口 ≤30 次 < 100 次，留 3 倍余量）。
probe: futunn
version: 2

requires:
  # extras 按「可导入模块名」判定（框架 _module_available）：futunn 无官方
  # SDK，adapter 经 httpx 直连 + cryptography 本地签名（pyproject 可选依赖
  # 组名亦为 futunn，由 uv sync --extra futunn 提供）
  extras: [httpx, cryptography]
  env: [TAPEHUB_FUTUNN_APP_KEY, TAPEHUB_FUTUNN_PRIVATE_KEY_PATH]

pacing:
  # IP 入口层行情类 100 次/分钟：2 秒间隔 ≈ 30 次/分钟，留 3 倍余量；
  # 历史额度池按标的计量（同标的重复读取不延期），分页续读用 page_token
  # 免计「首请求」（实测上游未签发 token，分页循环保留为防御）
  call_interval_s: 2.0
  timeout_s: 60
  # 本轮构成：availability 208（10 目标键 × 8 周期 × 各自复权面，etf@US
  # 2026-11-15 扩容 +24、etf@HK 同日扩容 +24；quotes 快照不经 chain——框架
  # chain 仅覆盖 fetch_bars，快照经目录外取证与单测覆盖）+ adjust_diff 20
  # （10 case × 2 调，etf@US/etf@HK 常态复验各 +4）+ history_depth 56 case
  # （7 目标 × 8 周期）× 最坏 24 = 1344 最坏 + raw 3（1 case 3 调）
  # ≈ 1575 最坏，预算 1650 留余量（era 10 年步长下单 case 约 8~15 调）；
  # 额度池不新增占用——depth 新目标复用 availability 已占额度的基准标的
  max_calls: 1650

# 跨三市场（CN/HK/US）声明能力：用市场限定目标（stock@MARKET）为每个市场
# 提供独立基准标的；case id 以限定键为前缀（如 stock@HK-P1D-...）。
# 基准沿用 alphafeed/tickflow 探针定稿的早上市标的（老八股/中电控股/GE），
# 历史深度收敛点是真实库底而非标的上市日伪影。
targets:
  stock@CN:
    instrument: CN-SSE-600602
    # 云赛智联（原真空电子），1990-12-19 上交所开业首批「老八股」且现存续
    window: {start: 2025-01-01, end: 2025-12-31}
    # 跨周期下限（分钟族数千 / 日 ≈243 / 周 ≈52 / 月 ≈12 根），以最稀的
    # 月线标定，只用于拦截空结果
    min_bars: 10
    # amount 不预设必填：turnover 口径与币种待本轮观察（各市场原币原值
    # 透出，volume_precision 还原后的 volume 一并观察）
    required_fields: [open, high, low, close, volume]
  index@CN:
    instrument: CN-SSE-000001
    # 上证指数（1991-07-15 发布）：指数无复权语义，volume 口径一并观察
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  etf@CN:
    instrument: CN-SSE-510300
    # 华泰柏瑞沪深300ETF（2012-05-28 上市）：autype 对 ETF 生效性未实证
    #（能力目录仅声明 none），复权生效性观察留待 raw/后续轮
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  stock@CN-SZSE:
    instrument: CN-SZSE-000001
    # 平安银行（深市主板，alphafeed 逐所细分同款目标）：.SZ 前缀此前仅
    # 品类表核实、价格端点零实证——chain 级实证
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  stock@CN-BSE:
    instrument: CN-BSE-920000
    # 安徽凤凰（北交所 920 段，alphafeed 逐所细分同款目标）：品类表明示
    # BJ 支持正股，价格端点此前零实证——chain 级实证，不通过则收窄
    # exchange 白名单（ths「BJ 仅元信息域实证不收」先例对照）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  index@CN-BSE:
    instrument: CN-BSE-899050
    # 北证 50 指数：品类表 BJ 支持指数，价格端点零实证——同上
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  stock@HK:
    instrument: HK-HKEX-00002
    # 中电控股，港股最古老上市标的之一（alphafeed 探针同款基准）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  etf@HK:
    instrument: HK-HKEX-02800
    # 盈富基金：HK ETF 能力 chain 常态复验基准目标——目录外诊断（2026-11-15
    # 第 6/7 轮：P1D 三复权两两全窗差异、W/M/分钟直测放行、快照完整）实证
    # 扩容声明后收敛入链；availability 全声明矩阵展开（8 周期 × 三复权）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    # amount 必填：futunn HK ETF 成交额为上游真实值（第 6 轮实证 02800 日线
    # ≈145.7 亿 HKD、量级与 vol×close 吻合）——与 alphafeed/tickflow HK
    # 「amount 原值 0」口径相反，以此锚定跨源差异
    required_fields: [open, high, low, close, volume, amount]
  stock@US:
    instrument: US-NYSE-GE
    # GE，1892 年 NYSE 上市且现存续（alphafeed/tickflow 探针同款基准）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume]
  etf@US:
    instrument: US-NYSE-SPY
    # SPY：US ETF 能力 chain 常态复验基准目标——目录外诊断（2026-11-15
    # 第 4/5 轮：P1D 三复权生效、W/M/分钟直测放行，raw 与 alphafeed 侧
    # 逐位互证）实证扩容声明后收敛入链；availability 全声明矩阵展开
    #（8 周期 × 三复权）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    # amount 必填：futunn US ETF 成交额为上游真实值（第 4 轮实证 ≈293.8
    # 亿 USD/日、量级与 vol×close 吻合；分钟行同样有值）——与 CN 目标
    # 「turnover 待观察」口径相反，以此锚定跨源差异
    required_fields: [open, high, low, close, volume, amount]

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # 三市场个股与 ETF 复权生效性（qfq/hfq 是否生效、基准为何）：日线
    # 足以判定，收敛 interval 控制预算（参照 alphafeed/tickflow 先例）；
    # 分红除权高发窗口放大前复权差异。etf@US/etf@HK 三复权生效已目录外
    # 诊断定案（第 4 轮：SPY P1D 两两全窗 250/250 差异；第 7 轮：02800
    # P1D 两两全窗 246/246 差异），入链常态复验
    targets: [stock@CN, stock@HK, stock@US, etf@US, etf@HK]
    window: {start: 2024-06-01, end: 2024-08-31}
    intervals: [P1D]
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  # history_depth 七目标 × 8 周期全跑（逐周期独立探测，机制边界外推不作为
  # 逐周期证据——tiingo 先例）：新目标复用 availability 已占额度标的
  #（SH.000001/SH.510300/HK.00002/US-NYSE-GE/US-NYSE-SPY/HK.02800），不新增
  # 历史额度占用，成本仅 IP 频率；era_step 10 年减半深库回溯调用（HK.00002/
  # US GE 为深库候选，声明值由网格二分收敛到日历边界——snap=month 保守
  # 上界，首根实测另记 first_bar 证据）；earliest 1890-01-01
  #（GE 1892 上市，深库下界；触底分支 estimate=earliest 一律不回填——
  # twelvedata 教训）；SZSE/BSE 维持 capability 级以基准标的库底为准、
  # 不单独 depth（README 注明）
  history_depth:
    targets: [stock@CN, index@CN, etf@CN, stock@HK, stock@US, etf@US, etf@HK]
    earliest: 1890-01-01
    era_step_years: 10
    # 单 case（目标×周期）子预算：era 10 年回溯 + 网格月粒度二分（一个纪元
    # 宽度 ≤120 点 → ~7 调），最坏 ≈21 调（深库 candidates：HK.00002/US GE）
    max_calls: 24
    intervals: [PT1M, PT5M, PT15M, PT30M, PT1H, P1D, P1W, P1M]

raw:
  # 已定案退役：futunn-server-time-endpoint（GET /api/v1.0/server-time 免签
  # HTTP 200 可用、server_time_ms 字符串类型，2026-11-14 第 3 轮定案；第一版
  # 不做自动校时，后续立项自动校时时按需复探；原始证据见
  # probes/results/PROBE_LOG.md，不入库）。
  #
  # 错误指纹仅观察：采集无签名请求的 401 报文形态（ret_code/code 封装、
  # 错误码 -12006 等），供鉴权失败路径的防御分支核实（字面量假 Key，
  # 非真实凭据）
  - id: futunn-no-signature-fingerprint
    purpose: 采集无签名/无效 AppKey 请求的错误指纹（HTTP 401 形态；仅观察）
    assert: false
    module: httpx
    client: {attr: Client, kwargs: {}}
    call:
      - {method: get, kwargs: {url: "https://webapi.futunn.com/api/v1.0/quote/HK.00700/history-kline?start=2025-01-01&end=2025-01-02&ktype=2&autype=0&num=10", headers: {"X-Api-Key": "probe-invalid-key-not-a-credential"}}}
      - {method: json, kwargs: {}, target: result}
    expect: {status: error, error_contains: ""}
    close: {method: close, kwargs: {}}

notes: 各轮运行记录见 probes/results/PROBE_LOG.md（不入库）；探针框架规范见 probes/README.md。
