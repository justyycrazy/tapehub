# Baostock 数据探针：全声明维度可用性、复权生效性、历史深度与错误指纹
# 实测（上游「空结果不报错、错误码仅 SDK stderr 打印」语义的适配器分类依据）。
# 定案结论（边界行为/历史起点等）已回填 manifest 与 docs/providers/baostock.md。
probe: baostock
version: 2

requires:
  # 免费无凭据数据平台（证券宝）：只依赖 SDK 安装，无环境变量前提
  extras: [baostock]

pacing:
  # 上游无公开限频数值，但有 IP 黑名单机制（10001011，访问规则见
  # baostock.com/blacklist）：2s 间隔保守节流；适配器为全局单连接
  # （懒登录复用），探针链路与 raw 共享同一会话。
  call_interval_s: 2.0
  timeout_s: 60
  # 预算：availability 90（stock 基准 21 + stock@CN-SZSE 追加 21 + index 3 +
  # index@CN-SZSE 追加 3 + etf 21 + etf@CN-SZSE 追加 21，含 ETF 分钟族 24）
  # + adjust_diff 12（stock/stock@CN-SZSE/etf 各 2 case × 2 调）+ raw 3 case
  # × 4 调 = 114
  #（history_depth 六条已收敛全量 skip，不占预算）。
  # ⚠ 分钟族重查询可能贴线/超时（属上游瞬时时延非能力缺口），failed 时
  # 重跑复验即可。
  max_calls: 150

# 基准标的沿用 tickflow/alphafeed 探针定稿的「早上市标的」原则（破除二分
# 收敛点 = 标的自身上市日伪影）：
targets:
  stock:
    instrument: CN-SSE-600602
    # 云赛智联（原真空电子），1990-12-19 上交所开业首批「老八股」且现存续；
    # 官方口径个股日/周/月 1990-12-19 起，收敛点即真实库底
    window: {start: 2025-01-01, end: 2025-12-31}
    # 跨周期下限（D≈243 / W≈52 / M≈12 / 分钟≈每交易日 48 根），只拦截空结果
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-SZSE:
    instrument: CN-SZSE-000001
    # 平安银行（深市主板，1991-04-03 上市）：交易所限定追加目标，sz. 前缀
    # 分支 chain 级实证（此前仅文档示例核实）。不进 history_depth：与 stock
    # 同库同查询，库底证据已由基准标的收敛；BSE 不声明（官方仅覆盖沪深
    # 两市，代码层明确拒绝）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index:
    instrument: CN-SSE-000001
    # 上证指数：官方口径指数日/周/月 2006-01-01 起（探针二分实证官方口径
    # 偏保守，真实库底 ≈1991-01-18 与个股同）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index@CN-SZSE:
    instrument: CN-SZSE-399001
    # 深证成指：交易所限定追加目标，sz. 前缀分支（与 stock@CN-SZSE 同一
    # 前缀机制，stock 侧已 chain 级实证；指数侧为首验轮——声明内 + mapper
    # 放行，首次运行即实证）。BSE 不声明（官方仅覆盖沪深两市）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf:
    instrument: CN-SSE-510050
    # 华夏上证 50ETF（2004-12-30 上市，最早 CN ETF 之一）；窗口锚定 ETF
    # 分钟族起点 2026-01-05（raw 边界定案，manifest history.start 已回填），
    # availability 的 ETF 分钟族 case 依赖此窗——日线起点实为 2005-02-23
    # （官方「2026-01-05 起」仅指 V0.9.3 新增每日更新 API，与
    # query_history_k_data_plus 实际覆盖无关）
    window: {start: 2026-01-05, end: 2026-12-31}
    # 月线 2026 年内约 11 根，min_bars 10 贴近月线真实值
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf@CN-SZSE:
    instrument: CN-SZSE-159915
    # 易方达创业板 ETF（深市，2011-09-29 上市）：交易所限定追加目标，sz.
    # 前缀分支（与 stock@CN-SZSE 同一前缀机制，stock 侧已 chain 级实证；
    # ETF 侧为首验轮）。窗口对齐基准 etf 的分钟族起点锚（2026-01-05），
    # availability 的 ETF 分钟族 case 依赖此窗。BSE×ETF 不存在（北交所无
    # ETF），不设该所目标
    window: {start: 2026-01-05, end: 2026-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]

chain:
  include_declared: true
  skip:
    # history.start 六条已收敛（个股/指数 ≈1991-01-18 三周期同值、
    # ETF 2005-02-23 经 raw 边界精确实测），不再重复消耗配额
    - case: history-depth-stock-P1D-baostock
      reason: 已收敛 ≈1991-01-18（90 天粒度 approx、complete=True），已人工确认回填
    - case: history-depth-stock-P1W-baostock
      reason: 已收敛，与 P1D 同上游同区间同值，已人工确认回填
    - case: history-depth-stock-P1M-baostock
      reason: 已收敛，与 P1D 同上游同区间同值，已人工确认回填
    - case: history-depth-index-P1D-baostock
      reason: 已收敛 ≈1991-01-18（官方口径 2006-01-01 偏保守），已人工确认回填
    - case: history-depth-index-P1W-baostock
      reason: 已收敛，与 P1D 同值，已人工确认回填
    - case: history-depth-index-P1M-baostock
      reason: 已收敛，与 P1D 同值，已人工确认回填
  adjust_diff:
    # 个股复权生效性（官方「涨跌幅复权法」，与同花顺/通达信口径不同）：
    # 日线足以判定，收敛 interval 控制预算。etf 三复权经 2024 全年逐行对比
    # 实证（[none,qfq,hfq]）后入链常态复验；指数复权为 no-op 维持 [none] 无可比。
    # stock@CN-SZSE 为逐所细分复验
    targets: [stock, stock@CN-SZSE, etf]
    window: {start: 2024-06-01, end: 2024-08-31}   # 分红除权高发窗口
    intervals: [P1D]
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    # 官方口径：个股 1990-12-19 起、指数 2006-01-01 起。earliest 1980 从
    # 1980/1990 纪元快速回溯，二分收敛实证真实库底。分钟族与 ETF 不进
    # history_depth：起点已由 raw 边界定案精确回填（个股分钟 2020-01-02、
    # ETF 2005-02-23），chain 无窄窗口目标可常态复验边界，漂移风险低。
    targets: [stock, index]
    earliest: 1980-01-01
    era_step_years: 10   # 1980 起共 5 纪元；个股/指数预期 1-2 个空纪元即命中
    max_calls: 24        # 每条 case 预算：回溯 + 二分 + 验证
    intervals: [P1D, P1W, P1M]

raw:
  # ── raw 链统一形态：module_func login → query_history_k_data_plus →
  #    get_data → to_dict(orient=records)。末步把 ResultData 的 DataFrame
  #    转为 list[dict]，使 min_rows 行数判定可用；样本（≤3 行）即字段矩阵
  #    观察。baostock 的 logout 是模块级函数且适配器不主动登出（懒登录
  #    复用、进程退出即断），探针不设独立 logout case。会话生命周期由
  #    chain availability 隐含复验（适配器懒登录）。
  #
  # ── 错误指纹（assert: false 仅观察；供适配器错误分类与文档回填）──
  - id: bs-invalid-code-fingerprint
    purpose: 无效证券代码指纹（预期 10004011；观察错误码或空结果）
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "ab.12345",
         fields: "date,code,open,high,low,close",
         start_date: "2025-06-01", end_date: "2025-06-30",
         frequency: "d", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-beyond-date-fingerprint
    purpose: |
      超日期支持范围指纹（预期 10004013 BSERR_BEYOND_DATE_SUPPORT）：查询
      1970 年（早于个股 1990-12-19 库底），观察错误码或空结果——空结果即
      「早于库底返回空」的诚实口径证据。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.600602",
         fields: "date,code,open,high,low,close",
         start_date: "1970-01-01", end_date: "1970-12-31",
         frequency: "d", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-invalid-frequency-fingerprint
    purpose: 无效周期指纹（frequency="7"，观察错误码或空结果）
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.600602",
         fields: "date,code,open,high,low,close",
         start_date: "2025-06-01", end_date: "2025-06-30",
         frequency: "7", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false

notes: 探针框架规范见 docs/probes.md。
