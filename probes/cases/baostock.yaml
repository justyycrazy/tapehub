# Baostock 数据探针：全声明维度可用性、复权生效性、历史深度与官方文档
# 矛盾点/边界行为实测（参数名风格、end 闭/开区间、分钟线边界、指数无分钟线、
# ETF 数据起点与复权支持、周线落点、停牌行形态、错误指纹）。
probe: baostock
version: 1

requires:
  # 免费无凭据数据平台（证券宝）：只依赖 SDK 安装，无环境变量前提
  extras: [baostock]

pacing:
  # 上游无公开限频数值，但有 IP 黑名单机制（10001011，访问规则见
  # baostock.com/blacklist）：2s 间隔保守节流；适配器为全局单连接
  # （懒登录复用），探针链路与 raw 共享同一会话。
  call_interval_s: 2.0
  timeout_s: 60
  # 预算：availability 66（stock 基准 21 + stock@CN-SZSE 追加 21 + index 3 +
  # etf 21，含 ETF 分钟族 12）+ adjust_diff 12（stock/stock@CN-SZSE/etf 各
  # 2 case × 2 调）+ raw 21 条 × 4 调 = 期望 162
  #（history_depth 六条已收敛全量 skip，不占预算；bs-lifecycle-login-query
  # 与 bs-etf-adjust-observe 两条 raw 已退役——生命周期由适配器懒登录下的
  # chain availability 隐含复验，ETF 复权由链路 adjust_diff 常态复验）。
  # ⚠ 分钟族重查询可能贴线/超时（属上游瞬时时延非能力缺口），failed 时
  # 重跑复验即可。
  max_calls: 280

# 基准标的沿用 tickflow/alphafeed 探针定稿的「早上市标的」原则（破除二分
# 收敛点 = 标的自身上市日伪影）：
targets:
  stock:
    instrument: CN-SSE-600602
    # 云赛智联（原真空电子），1990-12-19 上交所开业首批「老八股」且现存续；
    # 官方口径个股日/周/月 1990-12-19 起，收敛点即真实库底
    window: {start: 2025-01-01, end: 2025-12-31}
    # 跨周期下限（D≈243 / W≈52 / M≈12 / 分钟≈每交易日 48 根），只拦截空结果
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  stock@CN-SZSE:
    instrument: CN-SZSE-000001
    # 平安银行（深市主板，1991-04-03 上市）：交易所限定追加目标，sz. 前缀
    # 分支 chain 级实证（此前仅文档示例核实）。不进 history_depth：与 stock
    # 同库同查询，库底证据已由基准标的收敛；BSE 不声明（官方仅覆盖沪深
    # 两市，代码层明确拒绝）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  index:
    instrument: CN-SSE-000001
    # 上证指数：官方口径指数日/周/月 2006-01-01 起（待实证——上证指数
    # 1990 年即发布，官方口径可能偏保守）
    window: {start: 2025-01-01, end: 2025-12-31}
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]
  etf:
    instrument: CN-SSE-510050
    # 华夏上证 50ETF（2004-12-30 上市，最早 CN ETF 之一）；官方口径 ETF
    # 数据 2026-01-05 起（V0.9.3 新增），窗口从官方起点起算
    window: {start: 2026-01-05, end: 2026-12-31}
    # 月线 2026 年内约 11 根，min_bars 10 贴近月线真实值
    min_bars: 10
    required_fields: [open, high, low, close, volume, amount]

chain:
  include_declared: true
  skip:
    # history.start 六条已收敛（个股/指数 ≈1991-01-18 三周期同值、
    # ETF 2005-02-23 经 raw 边界精确实测），不再重复消耗配额
    - case: history-depth-stock-P1D-baostock
      reason: 已收敛 ≈1991-01-18（90 天粒度 approx、complete=True），已人工确认回填
    - case: history-depth-stock-P1W-baostock
      reason: 已收敛，与 P1D 同上游同区间同值，已人工确认回填
    - case: history-depth-stock-P1M-baostock
      reason: 已收敛，与 P1D 同上游同区间同值，已人工确认回填
    - case: history-depth-index-P1D-baostock
      reason: 已收敛 ≈1991-01-18（官方口径 2006-01-01 偏保守），已人工确认回填
    - case: history-depth-index-P1W-baostock
      reason: 已收敛，与 P1D 同值，已人工确认回填
    - case: history-depth-index-P1M-baostock
      reason: 已收敛，与 P1D 同值，已人工确认回填
  adjust_diff:
    # 个股复权生效性（官方「涨跌幅复权法」，与同花顺/通达信口径不同）：
    # 日线足以判定，收敛 interval 控制预算。etf 三复权经 2024 全年逐行对比
    # 实证（[none,qfq,hfq]）后入链常态复验，原 bs-etf-adjust-observe 单
    # 窗口观察退役；指数复权为 no-op 维持 [none] 无可比。
    # stock@CN-SZSE 为逐所细分复验
    targets: [stock, stock@CN-SZSE, etf]
    window: {start: 2024-06-01, end: 2024-08-31}   # 分红除权高发窗口
    intervals: [P1D]
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    # 官方口径：个股 1990-12-19 起、指数 2006-01-01 起。earliest 1980 从
    # 1980/1990 纪元快速回溯，二分收敛实证真实库底（指数口径重点核实：
    # 上证指数 1990 年发布，官方「2006-01-01」可能偏保守）。分钟族与 ETF
    # 不进 history_depth：官方已给精确固定起点（2020-01-03 / 2026-01-05），
    # 用 raw 边界验证更省预算（见 raw bs-minute-boundary-stock /
    # bs-etf-boundary）。
    targets: [stock, index]
    earliest: 1980-01-01
    era_step_years: 10   # 1980 起共 5 纪元；个股/指数预期 1-2 个空纪元即命中
    max_calls: 24        # 每条 case 预算：回溯 + 二分 + 验证
    intervals: [P1D, P1W, P1M]

raw:
  # ── raw 链统一形态：module_func login → query_history_k_data_plus →
  #    get_data → to_dict(orient=records)。末步把 ResultData 的 DataFrame
  #    转为 list[dict]，使 min_rows 行数判定可用；样本（≤3 行）即字段矩阵
  #    观察。baostock 的 logout 是模块级函数且适配器不主动登出（懒登录
  #    复用、进程退出即断），探针不设独立 logout case。会话生命周期由
  #    chain availability 隐含复验（适配器懒登录，原
  #    bs-lifecycle-login-query raw 已退役）。
  #
  # ── 官方文档矛盾点与边界行为（assert: false 仅观察，行数判读见注释）──
  - id: bs-start-param-name-observe
    purpose: |
      参数名风格实证：官方参数说明写 start/end、全部示例代码写
      start_date/end_date。本 case 用 start/end（参数表风格）查 9 日窗口：
      行数 ≈8 → 参数表风格生效；行数 ≈2600+（2015-01-01 默认起点起）→
      被忽略落默认。适配器当前按示例风格 start_date/end_date 实现。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.600602",
         fields: "date,code,open,high,low,close,volume,amount",
         start: "2025-06-01", end: "2025-06-10",
         frequency: "d", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-end-inclusive-stock
    purpose: |
      end 闭/开区间实证（个股）：单日窗口 [2025-06-10, 2025-06-10]（周二，
      必有行情）。行数 1 → end 包含（stockKData 页口径）；行数 0 → end
      不包含（indexData 页口径）。适配器当前按闭区间实现。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.600602",
         fields: "date,code,open,high,low,close,volume,amount",
         start_date: "2025-06-10", end_date: "2025-06-10",
         frequency: "d", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-end-inclusive-index
    purpose: |
      end 闭/开区间实证（指数）：同上单日窗口。stockKData 与 indexData 两页
      口径矛盾，两资产类型分别实证。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000001",
         fields: "date,code,open,high,low,close,volume,amount",
         start_date: "2025-06-10", end_date: "2025-06-10",
         frequency: "d", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-minute-boundary-stock
    purpose: |
      个股分钟线下界与 time 口径实证：官方口径 5/15/30/60 分钟线
      2020-01-03 起（近 5 年）。窗口 2019-12-15~2020-01-31，观察样本首行
      date/time——首根 bar 应为 2020-01-03，time（YYYYMMDDHHMMSSsss）为
      093000xxx 或 093500xxx 即 bar 起点/终点口径的直接证据；亦验证
      time 缺失形态（空串）。manifest 分钟族 history.start 待本 case 回填。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.600602",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2019-12-15", end_date: "2020-01-31",
         frequency: "5", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-index-minute-fingerprint
    purpose: 指数分钟线指纹（官方明示指数无分钟线；观察错误码或空结果）
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000001",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2025-06-01", end_date: "2025-06-30",
         frequency: "5", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  # ── 指数分钟族全量补探：官方明示指数无分钟线，本组把结论实证到全周期
  #    族——上证指数 × 15/30/60 分钟（与 fingerprint 的 5 分钟凑齐四周期，
  #    2025-06）、
  #    沪深 300 跨标的、2015 纪元历史窗口、2026 年窗口（1 月边界 + 6 月
  #    年中，对照 ETF 分钟族 2026-01-05 起点，排除「仅 2026 年起才有」）。
  #    全空 → 「指数无分钟线」稳固，manifest 指数能力维持仅日/周/月；
  #    任一组合返回数据则推翻现声明。
  - id: bs-index-minute-15m-observe
    purpose: |
      指数分钟线补探（frequency=15）：与 bs-index-minute-fingerprint（5 分钟）
      同标的同窗口，凑齐四周期实证。空结果 → 指数 15 分钟无数据。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000001",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2025-06-01", end_date: "2025-06-30",
         frequency: "15", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-index-minute-30m-observe
    purpose: |
      指数分钟线补探（frequency=30）：同上，凑齐四周期实证。
      空结果 → 指数 30 分钟无数据。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000001",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2025-06-01", end_date: "2025-06-30",
         frequency: "30", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-index-minute-60m-observe
    purpose: |
      指数分钟线补探（frequency=60，即 1 小时线）：同上，凑齐四周期实证。
      空结果 → 指数 60 分钟无数据。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000001",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2025-06-01", end_date: "2025-06-30",
         frequency: "60", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-index-minute-csi300-observe
    purpose: |
      指数分钟线补探（沪深 300，frequency=5）：跨标的核实「无分钟线」为
      全指数共性而非上证指数个案。空结果 → 跨指数一致。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000300",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2025-06-01", end_date: "2025-06-30",
         frequency: "5", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-index-minute-2015-observe
    purpose: |
      指数分钟线补探（2015 纪元，frequency=5）：排除「仅历史纪元曾有指数
      分钟数据」的可能；2015-06 为高活跃月，若曾有数据此窗口最易命中。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000001",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2015-06-01", end_date: "2015-06-30",
         frequency: "5", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-index-minute-2026jan-5m-observe
    purpose: |
      指数分钟线 2026 窗口补探（frequency=5，1 月）：ETF 分钟族实证起点
      2026-01-05——若指数分钟同样 2026 年起才有数据，2025/2015 窗口全空
      不足以证伪。1 月窗口首样本 date 即起点直接证据。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000001",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2026-01-01", end_date: "2026-01-31",
         frequency: "5", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-index-minute-2026jun-5m-observe
    purpose: |
      指数分钟线 2026 窗口补探（frequency=5，6 月）：2026 年中持续可用性
      （排除仅 1 月首月有数据的一过性可能）。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000001",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2026-06-01", end_date: "2026-06-30",
         frequency: "5", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-index-minute-2026-60m-observe
    purpose: |
      指数分钟线 2026 窗口补探（frequency=60，6 月）：2026 窗口第二周期
      实证。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000001",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2026-06-01", end_date: "2026-06-30",
         frequency: "60", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-index-minute-2026-csi300-observe
    purpose: |
      指数分钟线 2026 窗口补探（沪深 300，frequency=5，6 月）：2026 窗口
      跨标的一致性实证。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000300",
         fields: "date,time,code,open,high,low,close,volume,amount,adjustflag",
         start_date: "2026-06-01", end_date: "2026-06-30",
         frequency: "5", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-etf-boundary
    purpose: |
      ETF 数据起点实证：官方口径 2026-01-05 起（V0.9.3）。窗口
      2025-12-01~2026-01-31，样本首行 date 应为 2026-01-05。
      manifest ETF history.start 待本 case 回填。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.510050",
         fields: "date,code,open,high,low,close,volume,amount",
         start_date: "2025-12-01", end_date: "2026-01-31",
         frequency: "d", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-index-adjust-observe
    purpose: |
      指数复权支持观察：官方指数示例不传 adjustflag；本 case 传
      adjustflag=2 观察行为（返回数据/报错/忽略），决定指数复权能力
      是否回填。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.000001",
         fields: "date,code,open,high,low,close,volume,amount",
         start_date: "2025-06-01", end_date: "2025-06-30",
         frequency: "d", adjustflag: "2"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-weekly-midweek-observe
    purpose: |
      周线落点语义实证：官方「周线每周最后一个交易日才可以获取」。周二
      单日窗口查周线：空结果 → 周线仅周最后一个交易日有数据（数据落点）；
      返回当周未完成 bar → 语义不同。README 口径待本 case 回填。
    module: baostock
    call:
      - {module_func: login}
      - {module_func: query_history_k_data_plus, kwargs: {code: "sh.600602",
         fields: "date,code,open,high,low,close,volume,amount",
         start_date: "2025-06-10", end_date: "2025-06-10",
         frequency: "w", adjustflag: "3"}}
      - {method: get_data}
      - {method: to_dict, kwargs: {orient: records}}
    expect: {status: ok, min_rows: 0}
    assert: false
  - id: bs-suspended-rows-observe
    purpose: |
      停牌日行形态观察：乐视网（sz.300104）2018 下半年长期停牌期。官方
