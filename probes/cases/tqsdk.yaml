# TqSdk 数据探针：合约/主连/加权可用性、data_length 上限常态复验（实测
# 5000 根定案，见 docs/providers/tqsdk.md「上游行为定案」）。
# TqApi 实例创建较慢，pacing 显著放宽。
probe: tqsdk
version: 2

requires:
  extras: [tqsdk]
  env: [TAPEHUB_TQSDK_AUTH_USER, TAPEHUB_TQSDK_AUTH_PASSWORD]

pacing:
  call_interval_s: 3.0
  timeout_s: 120
  # ⚠ 运行时段建议：盘中（如 09:30-15:00）运行——盘后复权数据服务无响应，
  # 股票/ETF 全部 qfq/hfq 复权 case 的 get_kline_serial(adj_type=F/B) 均挂满
  # timeout 超时（同标的同周期 adj_type=None 正常通过）；复权生效性已有盘中
  # 实证（hfq/none 差异显著），复权 case 判定以盘中运行为准；凌晨时段
  # kline 亦不稳定（2026-11-16 00:1x 第 13 轮：合法形态亦挂起，全新实例
  # 直测复验正常——时段与形态因素并存时以全新实例直测判别）；天勤不支持
  # BSE 前缀（BSE.920000 快速报「non-existent instrument」graphql 错误）；
  # 无效代码订阅会堵死 shared 运行时
  #（第 13 轮实证：DCE 大写挂起后同实例一切调用超时，含合法 SHFE）——
  # 遇连续挂起优先用全新实例直测判别形态问题
  # 可用性 168（stock/stock@CN-SZSE/etf/etf@CN-SZSE 各 12：分钟族仅 none +
  # PT30M/PT1H/P1D 三值——复权收窄后拆块；index/index@CN-SZSE 6 + contract/
  # continuous/weighted-index
  # 基准与 contract@CN-CZCE/DCE/INE/GFEX/CFFEX、continuous@CN-CZCE/DCE/
  # INE/GFEX/CFFEX、weighted-index@CN-CZCE/DCE/INE/GFEX/CFFEX 各 6——
  # 期货六所扩容（2026-11-15 增补目标；写法 2026-11-16 第 13 轮定案，
  # 逐所 availability 为映射链路常态复验，见 targets 注释）+ adjust_diff
  # 36 case（分钟族 18 条显式 SKIP：
  # compared adjust 未声明，0 调；PT30M+/P1D 18 条 × 2 调）+
  # history_depth 30 case×~13 + limit 1 + connection 9+12（创建+首调+释放）
  # + quote_availability 24×1 调（quotes 声明随 include_declared 自动展开：
  # contract/continuous/weighted-index 基准与五所逐所 + stock 基准/SZSE
  # 逐所 + index 基准/SZSE 逐所 + etf 基准/SZSE 逐所；郑商所 4→3 位还原在
  # 快照链路的常态复验由
  # quote-contract@CN-CZCE 承载）
  # + 期权三子类八所逐所（asset_type 三分：commodity-option / index-option /
  # etf-option）：availability 8（P1D × none 各 1 调）+
  # quote_availability 8×1 调（2026-11-16 期权八所回填收编并三分）
  # ≈ 708
  # （深度探针全周期同轮测量：保留边界随时间前移，矩阵须同一时点；
  #   history_depth/adjust_diff/limit 不随逐所扩容——深度/复权/上限是
  #   资产类级结论，基准目标承载）
  max_calls: 800

targets:
  contract:
    # 铜 2706：SHFE 品种统一——与 ths 现活基准同码（原 AU2612 黄金为示例
    # 合约，换统一品种）。标准代码统一大写（CU2706），SHFE 品种小写由
    # 适配器还原为上游写法。合约会到期：运行前按上期所挂牌信息核对，
    # 探针失败会如实记录，到期轮换为当时的现活合约
    instrument: CN-SHFE-CU2706
    expires: 2027-06-30
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 30
  contract@CN-CZCE:
    # 甲醇 2701：CZCE 品种统一——「甲醇为郑商所持仓王」（原 RM2701 菜粕换
    # 统一品种）。标准码统一 4 位年月（tushare 侧实证 4 位可用、3 位全空；
    # 域层自 2026-11-17 起 3 位旧写法构造期拒绝）。TianQin 只认 3 位年月码
    # （RM 侧 CZCE.RM701 有数据、4 位 CZCE.RM2701 无响应挂起——还原机制
    # 品种无关），适配器做 4→3 位还原（标准式 MA2701 进 → CZCE.MA701 发出），
    # 本目标 availability 即还原链路的常态复验（2026-11-17 起用例字面量由
    # 3 位 MA701 修正为标准式 MA2701——此前 3 位直通架空了还原路径）
    instrument: CN-CZCE-MA2701
    expires: 2027-01-31
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 30
  contract@CN-DCE:
    # 大商所合约（豆粕为全市场持仓前列品种）：DCE 品种小写（适配器还原
    # DCE.M2705 → DCE.m2705，2026-11-16 第 13 轮直测定案；大写无响应挂起），
    # 本目标 availability 即映射链路常态复验。合约会到期：运行前按大商所
    # 挂牌信息核对，失败如实记录，到期轮换为当时的现活合约
    instrument: CN-DCE-M2705
    expires: 2027-05-31
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 30
  contract@CN-INE:
    # 上期能源合约（原油为该所绝对主力）：INE 品种小写（INE.SC2706 →
    # INE.sc2706，2026-11-16 定案；大写无响应挂起）。合约会到期：同上轮换
    instrument: CN-INE-SC2706
    expires: 2027-06-30
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 30
  contract@CN-GFEX:
    # 广期所合约（碳酸锂为该所上市以来活跃度第一品种）：GFEX 品种小写
    #（GFEX.LC2706 → GFEX.lc2706，2026-11-16 定案；大写 graphql 快速报错）。
    # 合约会到期：同上轮换
    instrument: CN-GFEX-LC2706
    expires: 2027-06-30
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 30
  contract@CN-CFFEX:
    # 中金所合约（沪深300 历史最久、代表性强）：CFFEX 大写品种直通正确
    #（CFFEX.IF2706 季月，2026-11-16 定案）。min_bars 20：季月合约挂牌晚
    #（IF2706 2026-10-19 挂牌，窗口内仅约 21 根），对齐挂牌窗口口径。
    # 合约会到期：同上轮换
    instrument: CN-CFFEX-IF2706
    expires: 2027-06-30
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 20
  continuous:
    instrument: CN-SHFE-CU
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  continuous@CN-CZCE:
    # 郑商所主连（甲醇为郑商所持仓王）：品种码无年月段透传（KQ.m@CZCE.MA，
    # 2026-11-16 第 13 轮直测有数据），本目标 availability 即映射链路常态复验
    instrument: CN-CZCE-MA
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  continuous@CN-DCE:
    # 大商所主连（豆粕）：品种小写透传（KQ.m@DCE.m，2026-11-16 直测有数据）
    instrument: CN-DCE-M
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  continuous@CN-INE:
    # 上期能源主连（原油）：品种小写透传（KQ.m@INE.sc，2026-11-16 有数据）
    instrument: CN-INE-SC
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  continuous@CN-GFEX:
    # 广期所主连（碳酸锂）：品种小写透传（KQ.m@GFEX.lc，2026-11-16 有数据）
    instrument: CN-GFEX-LC
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  continuous@CN-CFFEX:
    # 中金所主连（沪深300）：大写品种透传（KQ.m@CFFEX.IF，2026-11-16 直测
    # 有数据——金融期货主连存在性定案）
    instrument: CN-CFFEX-IF
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index:
    # 铜加权：SHFE 品种统一——与 continuous CU 同品种（原 AU 黄金加权换
    # 统一品种；KQ.i@SHFE.cu 本目标 availability 即实证）
    instrument: CN-SHFE-CU
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index@CN-CZCE:
    # 郑商所加权：KQ.i@ 形态品种码透传（KQ.i@CZCE.MA，与主连同品种，
    # 2026-11-16 直测有数据）
    instrument: CN-CZCE-MA
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index@CN-DCE:
    # 大商所加权：KQ.i@（KQ.i@DCE.m 豆粕，2026-11-16 直测有数据）
    instrument: CN-DCE-M
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index@CN-INE:
    # 上期能源加权：KQ.i@（KQ.i@INE.sc 原油，2026-11-16 直测有数据）
    instrument: CN-INE-SC
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index@CN-GFEX:
    # 广期所加权：KQ.i@（KQ.i@GFEX.lc 碳酸锂，2026-11-16 直测有数据）
    instrument: CN-GFEX-LC
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index@CN-CFFEX:
    # 中金所加权：KQ.i@（KQ.i@CFFEX.IF 沪深300，2026-11-16 直测有数据——
    # 金融期货加权存在性定案）
    instrument: CN-CFFEX-IF
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  stock:
    # 云赛智联（老八股）：证券基准统一——与 alphafeed/baostock/futunn/tickflow
    # 同款「早上市标的」（原 600000，换统一基准）。A股实时与历史行情需
    # 专业版账户（权限属账户，与 SDK 无关）：当前账户即专业版
    instrument: CN-SSE-600602
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  stock@CN-SZSE:
    # 平安银行（深市主板）：交易所限定追加目标，SZSE. 前缀 chain 级实证
    #（tqsdk 代码格式 {exchange}.{symbol} 直拼）。BSE 不上 chain 目标：
    # 天勤明确不支持 BSE 前缀（BSE.920000 快速报「non-existent instrument」
    # graphql 错误，2026-11-12 第 8 轮定案）
    instrument: CN-SZSE-000001
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  index:
    # 上证指数：指数基准统一——与 akshare/alphafeed/baostock/futunn/ths/
    # tickflow/tushare 同款（原 000016 上证 50，换统一基准）。指数历史权限
    # 经专业版实测可用；失败如实记录
    instrument: CN-SSE-000001
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  index@CN-SZSE:
    # 深证成指：交易所限定追加目标，SZSE. 前缀（与 stock@CN-SZSE 同一
    # 直拼机制；文档口径「指数仅核实 SSE/SZSE 发布的代码」）。首验轮——
    # 声明内 + mapper 放行（透传无白名单），首次运行即实证
    instrument: CN-SZSE-399001
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  etf:
    # ETF 权限口径未核实，失败如实记录
    instrument: CN-SSE-510050
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  etf@CN-SZSE:
    # 易方达创业板 ETF：交易所限定追加目标，SZSE. 前缀直拼（与 stock@CN-SZSE
    # 同一机制）。首验轮。BSE 不上 chain 目标（天勤不支持 BSE 前缀定案，
    # 见 stock@CN-SZSE 注释）
    instrument: CN-SZSE-159915
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60

  etf-option:
    # 50ETF 购 12 月（数字合约码直拼）：2026-11-16 到期前轮换——原近月
    # 10012437（购11月2800）2026-11-25 到期，按 tushare opt_basic 在市目录
    # ATM 重选：现价 510050=2.889 / 行权价 2.90（listed 2026-04-23、
    # delist 2026-12-23；数字合约码与 ths 侧同码，直拼形态由第 12 轮旧码
    # 同构实证）。合约会到期：轮换按交易所挂牌或 tushare opt_basic 目录重选
    instrument: CN-SSE-10011427
    expires: 2026-12-23
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 3
  etf-option@CN-SZSE:
    # 沪深300ETF 购 12 月（数字合约码直拼）：同上轮换——原近月 90008083
    # 2026-11-25 到期，ATM 重选：现价 159919=4.266 / 行权价 4.30（listed
    # 2026-09-16、delist 2026-12-23）；tqsdk 侧首证由下一轮常态复验承担
    instrument: CN-SZSE-90008043
    expires: 2026-12-23
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 3
  index-option@CN-CFFEX:
    # 沪深300 期权 IO2612C4000（统一式）→ 原生连字符式 IO2612-C-4000：同上
    # 双证收编；月度合约到期轮换
    instrument: CN-CFFEX-IO2612C4000
    expires: 2026-12-31
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 3
  commodity-option@CN-SHFE:
    # 铜期权 ATM 实码（品种小写混合大小写 cu2701C102000）：同上双证收编；
    # 深虚零成交合约快照/K 线可得性未核实，轮换按挂牌行权价序列选 ATM
    instrument: CN-SHFE-CU2701C102000
    expires: 2026-12-31
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 3
  commodity-option@CN-INE:
    # 原油期权（品种小写无连字符 sc2701C550）：同上双证收编（大写直通
    # SC2701C550 graphql 快速报错否定）；轮换按挂牌行权价序列重选
    instrument: CN-INE-SC2701C550
    expires: 2026-12-31
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 3
  commodity-option@CN-DCE:
    # 豆粕期权 M2701C3150（ATM：M2701 期货收盘 3147 锚定，间隔 50）：期权
    # DCE 码式统一——与 ths/tushare 同码（原 C3500 bars 可用，但 ths 分时
    # 端点 5003 逐合约缺口，统一取 3150；本目标 availability 即实证）。
    # 原生品种小写连字符 m2701-C-3150 由适配器映射。合约会到期：轮换按
    # opt_basic 同款口径重选 ATM
    instrument: CN-DCE-M2701C3150
    expires: 2026-12-31
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 3
  commodity-option@CN-CZCE:
    # 甲醇期权（统一式 MA2701C3200 → 原生大写品种 3 位月码 CZCE.MA701C3200，
    # 4→3 还原与该所期货同构）：CZCE 期权品种统一——「甲醇为郑商所持仓王」
    #（与 contract/continuous MA 同品种；原 SR2701C5900 白糖换统一品种）。
    # 行权价 3200 经人工锚定提供（2026-11-16）；本目标 availability 即实证。
    # 合约会到期：轮换按 opt_basic 同款口径重选 ATM
    instrument: CN-CZCE-MA2701C3200
    expires: 2026-12-31
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 3
  commodity-option@CN-GFEX:
    # 碳酸锂期权 LC2701C88000（ATM：LC2701 分时末点 87740 锚定，间隔 2000）：
    # 期权 GFEX 码式统一——与 ths/tushare 同码（原 C90000 订阅快照/K 线可用，
    # 但 ths 分时端点 5003 逐合约缺口，统一取 88000；本目标 availability 即
    # 实证）。原生品种小写连字符 lc2701-C-88000 由适配器映射。合约会到期：
    # 轮换按挂牌行权价序列重选 ATM
    instrument: CN-GFEX-LC2701C88000
    expires: 2026-12-31
    window: {start: 2026-11-01, end: 2026-11-30}
    min_bars: 3

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # 股票/ETF adj_type F/B 实证：前/后复权序列应与不复权存在差异（分红除权期）。
    # stock@CN-SZSE 为逐所细分复验。
    # 窗口口径（2026-11-17 修订）：窗口须与各目标各周期的序列基点（P1D start /
    # 分钟族保留边界）之间跨过至少一个除权事件——旧窗 2024-06~08 紧邻 etf
    # PT30M 保留边界（≈2024-05）且该区间无除权事件，hfq 因子恒 1 曾产生
    # no-op suspect 伪影（同窗 P1D/PT1H 基点更早、中间含分红故有差异；
    # 2026-11-17 聚焦复验轮实证：前移至本窗口后三目标 18 case 全 confirmed，
    # 零 suspect）；窗内除权事件为历史事实不随时间漂移，更换目标/周期时按
    # 同口径核对
    targets: [stock, stock@CN-SZSE, etf]
    window: {start: 2025-01-01, end: 2026-11-30}
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    # 合约类有时限标的（contract 与期权三子类）不入列——2026-11-16 决议
    #（见 docs/probes.md「规范化规则」）；stock 历史深度受专业版权限
    # 直接影响，是权限口径实证的关键探针；
    # snap=month：声明值对齐月边界（保守上界），首根实测记入 first_bar 证据；
    # 分钟级周期一并探测，实测各类资产的滚动保留深度。era 5 年 + 网格月粒度
    # 二分：最坏 6 纪元 + ~6 网格调 = 12 ≤ 16
    targets: [continuous, stock, index, etf, weighted-index]
    earliest: 2000-01-01
    era_step_years: 5
    max_calls: 16
    intervals: [P1D, PT1M, PT5M, PT15M, PT30M, PT1H]
  limit_truncation:
    targets: [continuous]
    interval: P1D
    # 40 年窗口确保触顶；实测单次上限 5000 根（8000/10000 两种文档口径均不符，定案见 docs/providers/tqsdk.md「上游行为定案」）
    max_range: P40Y

connection:
  # ── P1：建连+鉴权+首数据耗时（单实例重复计时，量化长连接单实例化收益）──
  # 共享客户端参数（auth 经 $ctor 构造 TqAuth；凭据只经环境变量注入）
  - id: tqsdk-connect-latency
    purpose: 建连+鉴权+首数据耗时，单实例 3 轮重复计时
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
