# TqSdk 数据探针：合约/主连/加权可用性、data_length 上限实测裁决（8000 vs 10000）。
# TqApi 实例创建较慢，pacing 显著放宽。
probe: tqsdk
version: 2

requires:
  extras: [tqsdk]
  env: [TAPEHUB_TQSDK_AUTH_USER, TAPEHUB_TQSDK_AUTH_PASSWORD]

pacing:
  call_interval_s: 3.0
  timeout_s: 120
  # ⚠ 运行时段建议：盘中（如 09:30-15:00）运行——盘后复权数据服务无响应，
  # 股票/ETF 全部 qfq/hfq 复权 case 的 get_kline_serial(adj_type=F/B) 均挂满
  # timeout 超时（同标的同周期 adj_type=None 正常通过）；复权生效性已有盘中
  # 实证（hfq/none 差异显著），复权 case 判定以盘中运行为准；天勤不支持
  # BSE 前缀（BSE.920000 快速报「non-existent instrument」graphql 错误，
  # 闸门 case quote-bse-fingerprint）
  # 可用性 168（stock/stock@CN-SZSE/etf/etf@CN-SZSE 各 12：分钟族仅 none +
  # PT30M/PT1H/P1D 三值——复权收窄后拆块；index/index@CN-SZSE 6 + contract/
  # continuous/weighted-index
  # 基准与 contract@CN-CZCE/DCE/INE/GFEX/CFFEX、continuous@CN-CZCE/DCE/
  # INE/GFEX/CFFEX、weighted-index@CN-CZCE/DCE/INE/GFEX/CFFEX 各 6——
  # 期货六所扩容（2026-11-15）：逐所 availability 即写法约定实证，见
  # targets 注释）+ adjust_diff 36 case（分钟族 18 条显式 SKIP：
  # compared adjust 未声明，0 调；PT30M+/P1D 18 条 × 2 调）+
  # history_depth 30 case×~13 + limit 1 + connection 9+12（创建+首调+释放）
  # + quote_availability 24×1 调（quotes 声明随 include_declared 自动展开：
  # contract/continuous/weighted-index 基准与五所逐所 + stock 基准/SZSE
  # 逐所 + index 基准/SZSE 逐所 + etf 基准/SZSE 逐所；郑商所 4→3 位还原在
  # 快照链路的常态复验由
  # quote-contract@CN-CZCE 承载）+ raw 1 case×2 调用（郑商所 4 位 kline
  # 挂起复验负对照；3 位接受度由 chain contract@CN-CZCE 还原链路常态复验；
  # quote 矩阵 6 条 raw 已随 quotes 入链退役，见 raw 段注释）
  # + 期权八所探测 11 case × 3 调（client + get_quote + get_kline_serial：
  # 八所各 1 + DCE/INE/GFEX 码式对照候选各 1）
  # ≈ 711
  #（quote-contract-uppercase / quote-bse-fingerprint 已随定案退役，
  # 见 raw 段注释）
  # （深度探针全周期同轮测量：保留边界随时间前移，矩阵须同一时点；
  #   history_depth/adjust_diff/limit 不随逐所扩容——深度/复权/上限是
  #   资产类级结论，基准目标承载）
  max_calls: 800

targets:
  contract:
    # au2612 为示例合约：运行前请按上期所挂牌信息核对，探针失败会如实记录。
    # 标准代码统一大写（AU2612），SHFE 品种小写由适配器还原为上游写法
    instrument: CN-SHFE-AU2612
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 30
  contract@CN-CZCE:
    # 郑商所合约：标准码统一 4 位年月（公开现行约定；tushare/新浪 侧实证
    # 4 位可用、3 位全空）。TianQin 只认 3 位（CZCE.RM701 有数据、
    # 4 位 CZCE.RM2701 无响应挂起），适配器做 4→3 位还原（RM2701 → RM701），
    # 本目标 availability 即还原链路的常态复验；4 位直传挂起的原始证据见
    # raw case kline-czce-4digit
    instrument: CN-CZCE-RM2701
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 30
  contract@CN-DCE:
    # 大商所合约（豆粕为全市场持仓前列品种）：DCE 写法约定未核实，暂按
    # {EXCHANGE}.{SYMBOL} 大写直通（DCE.M2705），本目标 availability 即实证。
    # 合约会到期：运行前按大商所挂牌信息核对，失败如实记录，到期轮换为
    # 当时的现活合约
    instrument: CN-DCE-M2705
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 30
  contract@CN-INE:
    # 上期能源合约（原油为该所绝对主力）：INE 写法约定未核实，暂按大写
    # 直通（INE.SC2706），本目标 availability 即实证。合约会到期：同上轮换
    instrument: CN-INE-SC2706
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 30
  contract@CN-GFEX:
    # 广期所合约（碳酸锂为该所上市以来活跃度第一品种）：GFEX 写法约定未
    # 核实，暂按大写直通（GFEX.LC2706），本目标 availability 即实证。
    # 合约会到期：同上轮换
    instrument: CN-GFEX-LC2706
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 30
  contract@CN-CFFEX:
    # 中金所合约（沪深300 历史最久、代表性强）：CFFEX 写法约定未核实，暂按
    # 大写直通（CFFEX.IF2706 季月），本目标 availability 即实证。合约会
    # 到期：同上轮换
    instrument: CN-CFFEX-IF2706
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 30
  continuous:
    instrument: CN-SHFE-CU
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  continuous@CN-CZCE:
    # 郑商所主连（甲醇为郑商所持仓王）：品种码无年月段适配器原样透传
    #（KQ.m@CZCE.MA），上游接受度未实证，本目标 availability 即实证
    instrument: CN-CZCE-MA
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  continuous@CN-DCE:
    # 大商所主连（豆粕）：品种码透传（KQ.m@DCE.M），未实证即实证
    instrument: CN-DCE-M
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  continuous@CN-INE:
    # 上期能源主连（原油）：品种码透传（KQ.m@INE.SC），未实证即实证
    instrument: CN-INE-SC
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  continuous@CN-GFEX:
    # 广期所主连（碳酸锂）：品种码透传（KQ.m@GFEX.LC），未实证即实证
    instrument: CN-GFEX-LC
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  continuous@CN-CFFEX:
    # 中金所主连（沪深300）：品种码透传（KQ.m@CFFEX.IF）；金融期货主连
    # 是否存在上游未实证，失败如实记录
    instrument: CN-CFFEX-IF
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index:
    instrument: CN-SHFE-AU
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index@CN-CZCE:
    # 郑商所加权：KQ.i@ 形态品种码透传（KQ.i@CZCE.MA，与主连同品种），
    # 未实证即实证
    instrument: CN-CZCE-MA
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index@CN-DCE:
    # 大商所加权：KQ.i@（KQ.i@DCE.M 豆粕），未实证即实证
    instrument: CN-DCE-M
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index@CN-INE:
    # 上期能源加权：KQ.i@（KQ.i@INE.SC 原油），未实证即实证
    instrument: CN-INE-SC
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index@CN-GFEX:
    # 广期所加权：KQ.i@（KQ.i@GFEX.LC 碳酸锂），未实证即实证
    instrument: CN-GFEX-LC
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index@CN-CFFEX:
    # 中金所加权：KQ.i@（KQ.i@CFFEX.IF 沪深300）；金融期货加权是否存在
    # 上游未实证，失败如实记录
    instrument: CN-CFFEX-IF
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  stock:
    # A股实时与历史行情需专业版账户（权限属账户，与 SDK 无关）：当前账户即专业版
    instrument: CN-SSE-600000
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  stock@CN-SZSE:
    # 平安银行（深市主板）：交易所限定追加目标，SZSE. 前缀 chain 级实证
    #（tqsdk 代码格式 {exchange}.{symbol} 直拼）。BSE 不上 chain 目标：
    # 天勤明确不支持 BSE 前缀（BSE.920000 快速报「non-existent instrument」
    # graphql 错误，2026-11-12 第 8 轮定案；原 quote-bse-fingerprint 闸门
    # raw 随定案退役，上游扩容时按需复探）
    instrument: CN-SZSE-000001
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  index:
    # 指数历史权限经专业版实测可用；失败如实记录
    instrument: CN-SSE-000016
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  index@CN-SZSE:
    # 深证成指：交易所限定追加目标，SZSE. 前缀（与 stock@CN-SZSE 同一
    # 直拼机制；文档口径「指数仅核实 SSE/SZSE 发布的代码」）。首验轮——
    # 声明内 + mapper 放行（透传无白名单），首次运行即实证
    instrument: CN-SZSE-399001
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  etf:
    # ETF 权限口径未核实，失败如实记录
    instrument: CN-SSE-510050
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  etf@CN-SZSE:
    # 易方达创业板 ETF：交易所限定追加目标，SZSE. 前缀直拼（与 stock@CN-SZSE
    # 同一机制）。首验轮。BSE 不上 chain 目标（天勤不支持 BSE 前缀定案，
    # 见 stock@CN-SZSE 注释）
    instrument: CN-SZSE-159915
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # 股票/ETF adj_type F/B 实证：前/后复权序列应与不复权存在差异（分红除权期）。
    # stock@CN-SZSE 为逐所细分复验
    targets: [stock, stock@CN-SZSE, etf]
    window: {start: 2024-06-01, end: 2024-08-31}
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    # stock 历史深度受专业版权限直接影响，是权限口径实证的关键探针；
    # snap=month：声明值对齐月边界（保守上界），首根实测记入 first_bar 证据；
    # 分钟级周期一并探测，实测各类资产的滚动保留深度。era 5 年 + 网格月粒度
    # 二分：最坏 6 纪元 + ~6 网格调 = 12 ≤ 16
    targets: [continuous, stock, index, etf, weighted-index]
    earliest: 2000-01-01
    era_step_years: 5
    max_calls: 16
    intervals: [P1D, PT1M, PT5M, PT15M, PT30M, PT1H]
  limit_truncation:
    targets: [continuous]
    interval: P1D
    # 40 年窗口确保超过 8000/10000 根日线，实测裁决两种文档口径
    max_range: P40Y

connection:
  # ── P1：建连+鉴权+首数据耗时（单实例重复计时，量化长连接单实例化收益）──
  # 共享客户端参数（auth 经 $ctor 构造 TqAuth；凭据只经环境变量注入）
  - id: tqsdk-connect-latency
    purpose: 建连+鉴权+首数据耗时，单实例 3 轮重复计时
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    first_call: {method: get_kline_serial, kwargs: {symbol: "SHFE.au2612", duration_seconds: 86400, data_length: 2}}
    close: {method: close}
    rounds: 3
  # ── P2：并发实例共存验证（免费账户并发连接上限实证，回答现状每请求
  # 建连在并发下是否已踩线、单实例化后连接预算如何定）──
  - id: tqsdk-concurrent-instances-4
    purpose: 并发 4 实例同时创建+首数据+释放，验证账户并发连接上限
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    first_call: {method: get_kline_serial, kwargs: {symbol: "SHFE.au2612", duration_seconds: 86400, data_length: 2}}
    close: {method: close}
    rounds: 1
    concurrent: 4

raw:
  # ── 已定案退役的探索性 raw（原始证据见 probes/results/PROBE_LOG.md，
  #    不入库）：quote-contract-uppercase（大写品种上游不接受——SHFE.AU2612
  #    matched=False，2026-11-12 第 8 轮定案，request_mapper 品种大小写还原
  #    表依据；还原后形态由 chain contract availability 隐含复验）、
  #    quote-bse-fingerprint（天勤不支持 BSE 前缀定案，见 targets 注释）、
  #    kline-czce-3digit（3 位接受度由 chain contract@CN-CZCE 常态复验）。
  #
  # ── quote 矩阵 6 条 raw 已随 chain quote_availability 入链退役
  #   （quote-contract / quote-continuous / quote-index-sse50 / quote-stock /
  #    quote-etf / quote-weighted-index，2026-11-15）：quotes 全部 6 组声明
  #    （contract/continuous/weighted-index/stock/index/etf，manifest M2）由
  #    chain 经 adapter.fetch_quote 全链路常态复验——快照链路的二级路由、
  #    上游订阅、NaN 置空与标准化全部覆盖，判定与观测覆盖强于 raw 的 SDK
  #    级 min_fields 检查；原 raw 的权限口径差异（免费/专业版、断言 vs
  #    观察）不再需要——chain 统一实判定，权限不足如实 failed（这正是
  #    权限边界的证据）。Quote 首包前 NaN 的上游行为由「last/bid/ask 全空
  #    判 failed」承接（原 min_fields 只验证键存在，弱于该判定）。
  #
  # ── 仅存负对照：郑商所 4 位年月码（与 ths ths-futures-suffix-zce-4digit
  #    同款设计）——适配器 4→3 还原后链路永远发不出 4 位形态，无法入链，
  #    常态复验该结论（4 位无响应挂起——TianQin 只认 3 位）。
  - id: kline-czce-4digit
    purpose: 郑商所 4 位年月码上游接受度实证（get_kline_serial CZCE.RM2701，
      观察不判定；已实证 4 位无响应挂起——TianQin 只认 3 位，
      适配器据此做 4→3 位还原，本 case 常态复验该结论；3 位侧常态复验由
      chain contract@CN-CZCE 承担）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_kline_serial, kwargs: {symbol: "CZCE.RM2701", duration_seconds: 86400, data_length: 2}}
    close: {method: close}
    expect: {status: ok, min_rows: 1}
    assert: false

  # ── 期权八所扩容探测（未定案，observe）：官方文档声称支持期权，但八所
  #    期权码式、K 线与快照行为均未实证——upstream_symbol 现对 OPTION 明确
  #    拒绝，链路发不出期权请求，走 raw 直测（get_quote 验标的存在性 +
  #    get_kline_serial 验 K 线数据面，链式：标的不存在/挂起时 K 线调用
  #    不执行）。每候选独立 case（框架仅采样链末结果）。
  #    品种选择与码式候选依据（代表性 + 高持仓；request_mapper 注释已预留
  #    SHFE「cu2607C50000 混合大小写」与 CZCE「品种+年月+C/P+行权价」线索，
  #    期权代码结构与期货不同，不得沿用整段小写/4→3 规则）：
  #    SSE/SZSE 数字合约码直拼（50ETF 购 10012437 / 沪深300ETF 购 90008083，
  #    2026-11-25 到期）；CFFEX IO2612-C-4000（连字符）；SHFE 铜期权
  #    cu2701C102000（品种小写混合大小写，ATM 实码）；INE 原油期权双候选
  #    sc2701C550（SHFE 同构小写）/ SC2701C550（大写直通，期货侧已实证
  #    大写）；DCE 豆粕期权双候选 M2701-C-3500（大写直通）/ m2701-C-3500
  #    （官方文档示例小写 m）；CZCE 白糖期权 SR701C5900（3 位月码）；GFEX
  #    碳酸锂期权双候选 lc2701-C-90000（连字符）/ lc2701C90000（无连字符）。
  #    行权价为当期实码（ATM 或有量合约），到期按各所挂牌轮换；无效形态
  #    上游表现为「non-existent instrument」快速报错或无响应挂起（超时
  #    120s）——两类均为否定证据，如实记录。
  - id: tqsdk-option-sse-etf
    purpose: 上交所 ETF 期权探测（50ETF 购近月 10012437，数字合约码直拼；2026-11-25 到期，过期按当期挂牌近月重选）
    assert: false
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SSE.10012437"}}
      - {method: get_kline_serial, kwargs: {symbol: "SSE.10012437", duration_seconds: 86400, data_length: 3}, target: client}
    close: {method: close}
    expect: {status: ok, min_rows: 1}

  - id: tqsdk-option-szse-etf
    purpose: 深交所 ETF 期权探测（沪深300ETF 购近月 90008083，数字合约码直拼；2026-11-25 到期，过期轮换）
    assert: false
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SZSE.90008083"}}
      - {method: get_kline_serial, kwargs: {symbol: "SZSE.90008083", duration_seconds: 86400, data_length: 3}, target: client}
    close: {method: close}
    expect: {status: ok, min_rows: 1}

  - id: tqsdk-option-cffex
    purpose: 中金所股指期权探测（IO2612-C-4000 连字符式，与 tushare 侧该所期权同构；月度合约到期轮换）
