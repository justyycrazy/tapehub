# TqSdk 数据探针：合约/主连/加权可用性、data_length 上限实测裁决（8000 vs 10000）。
# TqApi 实例创建较慢，pacing 显著放宽。
probe: tqsdk
version: 1

requires:
  extras: [tqsdk]
  env: [TAPEHUB_TQSDK_AUTH_USER, TAPEHUB_TQSDK_AUTH_PASSWORD]

pacing:
  call_interval_s: 3.0
  timeout_s: 120
  # 可用性 36 + adjust_diff 24 case×2 调用 + history_depth 30 case×~13 + limit 1
  # + connection 9+12（创建+首调+释放）+ raw quote 6 case×2 调用 ≈ 622
  # （深度探针全周期同轮测量：保留边界随时间前移，矩阵须同一时点）
  max_calls: 700

targets:
  contract:
    # au2612 为示例合约：运行前请按上期所挂牌信息核对，探针失败会如实记录
    instrument: CN-SHFE-au2612
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 30
  continuous:
    instrument: CN-SHFE-cu
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index:
    instrument: CN-SHFE-au
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  stock:
    # A股实时与历史行情需专业版账户（权限属账户，与 SDK 无关）：当前账户即专业版
    instrument: CN-SSE-600000
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  index:
    # 指数历史权限经专业版实测可用；失败如实记录
    instrument: CN-SSE-000016
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  etf:
    # ETF 权限口径未核实，失败如实记录
    instrument: CN-SSE-510050
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # 股票/ETF adj_type F/B 实证：前/后复权序列应与不复权存在差异（分红除权期）
    targets: [stock, etf]
    window: {start: 2024-06-01, end: 2024-08-31}
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    # stock 历史深度受专业版权限直接影响，是权限口径实证的关键探针；
    # probe_span_days=5：二分窗口 5 天，为分钟线滚动保留边界提供 ±5 天精度；
    # 分钟级周期一并探测，实测各类资产的滚动保留深度
    targets: [continuous, stock, index, etf, weighted-index]
    earliest: 2000-01-01
    era_step_years: 5
    max_calls: 16
    intervals: [P1D, PT1M, PT5M, PT15M, PT30M, PT1H]
    probe_span_days: 5
  limit_truncation:
    targets: [continuous]
    interval: P1D
    # 40 年窗口确保超过 8000/10000 根日线，实测裁决两种文档口径
    max_range: P40Y

connection:
  # ── P1：建连+鉴权+首数据耗时（单实例重复计时，量化长连接单实例化收益）──
  # 共享客户端参数（auth 经 $ctor 构造 TqAuth；凭据只经环境变量注入）
  - id: tqsdk-connect-latency
    purpose: 建连+鉴权+首数据耗时，单实例 3 轮重复计时
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    first_call: {method: get_kline_serial, kwargs: {symbol: "SHFE.au2612", duration_seconds: 86400, data_length: 2}}
    close: {method: close}
    rounds: 3
  # ── P2：并发实例共存验证（免费账户并发连接上限实证，回答现状每请求
  # 建连在并发下是否已踩线、单实例化后连接预算如何定）──
  - id: tqsdk-concurrent-instances-4
    purpose: 并发 4 实例同时创建+首数据+释放，验证账户并发连接上限
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    first_call: {method: get_kline_serial, kwargs: {symbol: "SHFE.au2612", duration_seconds: 86400, data_length: 2}}
    close: {method: close}
    rounds: 1
    concurrent: 4

raw:
  # ── P5：get_quote 字段/权限矩阵（实时快照链路的 manifest 声明基础）──
  # Quote 在首包前字段为 NaN：min_fields 只验证「订阅成功且字段键存在」，
  # 权限不足的表现（报错 vs 静默 NaN）由 sample 与判定如实记录；
  # 有文档依据的（期货/四大指数免费）断言，权限未核实的只观察不判定。
  - id: quote-contract
    purpose: 期货合约实时快照字段可用性（免费版权限亦有据，断言）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SHFE.au2612"}}
    expect: {status: ok, min_fields: [last_price, bid_price1, ask_price1, volume]}
  - id: quote-continuous
    purpose: 主力连续实时快照字段可用性（断言）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "KQ.m@SHFE.cu"}}
    expect: {status: ok, min_fields: [last_price, bid_price1, ask_price1, volume]}
  - id: quote-index-sse50
    purpose: 上证50 实时快照（免费版四大指数有文档依据，断言）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SSE.000016"}}
    expect: {status: ok, min_fields: [last_price, bid_price1, ask_price1, volume]}
  - id: quote-stock
    purpose: A股个股实时快照（需专业版账户；当前账户盘中实测可得实时五档）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SSE.600000"}}
    expect: {status: ok, min_fields: [last_price]}
    assert: false
  - id: quote-etf
    purpose: ETF 实时快照（当前专业版账户盘中实测可得实时五档）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SSE.510050"}}
    expect: {status: ok, min_fields: [last_price]}
    assert: false
  - id: quote-weighted-index
    purpose: 商品加权指数实时快照权限口径未核实，只观察
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "KQ.i@SHFE.au"}}
    expect: {status: ok, min_fields: [last_price]}
    assert: false

notes: >
  文档对单次上限存在两种口径（data_length 每序列上限 10000，使用说明另有 8000 根
  表述，以 API 参考为准），limit_truncation 不设 documented_max，以实测裁决；
  connection 探针（P1 建连耗时 / P2 并发 4 实例共存）为单实例化改造提供连接
  预算依据；raw quote 探针（P5）验证订阅成功与字段键存在，NaN 与实际值差异看
  sample（Quote 首包前字段为 NaN 属正常，休市时段值不前进），get_quote 未配
  wait_update，避免声明式探针阻塞——字段键存在性判定与权限报错捕获不受影响；
  期货/指数无复权概念，adjust_diff 仅配股票/ETF（实证 adj_type F/B 是否生效）；
  股票/ETF 的 volume 单位与 ETF/指数历史权限已在 2026-11-03/04 探针回填 README。
  P3/P4/P6/P7 四项运行时基准已于 2026-11-05 用 Runtime 集成基准脚本实证
  （probes/results/runtime-bench-20261105T161229Z.md 与 memory_curve.py 产物，
  脚本随产物保存于 probes/results/、不入库；真实上游、默认配置
  max_inflight=16/subscription_limit=64）：P3 同连接并发 await 矩阵——
  并发 1/2/4/8 各 5 轮全部成功，p50 187-750ms、max ≤750ms，并发 8 无退化
  （p50 266ms，上游并发有收益），统一实例设计成立；P4 历史大请求下的推送
  抖动——并发 8×5000 根负载期间，新订阅首包延迟由基线 p50 320ms 升至
  p50 1164ms（约 3.6×、p95 1875ms），零失败零误拒，tick 循环响应度下降但
  仍在秒级（非交易时段以首包延迟为推送代用指标，交易时段建议复测真实
  推送间隔）；P6 订阅累积与回收——顺序订阅 120 池第 67 个触发休眠回收
  （gen1→2），活跃订阅（au/cu 主连）自动重订恢复，120 订阅零失败；内存曲线
  每休眠订阅约 +0.03MB（60 个共 +2.1MB），回收代际切换瞬时峰值约 +34MB
  （新一代构造），无泄漏迹象；P7 协程重建重订阅——休眠累积触发新一代重建
  （gen2→3），流事件序列完整：subscribed(0.75s)×3 → recycling(15.25s)×3 →
  subscribed(18.19s)×3，回收窗口约 2.9s（含 2s 退避 + 新代构造 + 重订首包），
  端到端验证绝不静默断流。探针永不自动改 manifest，能力回填人工确认后提交。
