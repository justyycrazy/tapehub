# TqSdk 数据探针：合约/主连/加权可用性、data_length 上限实测裁决（8000 vs 10000）。
# TqApi 实例创建较慢，pacing 显著放宽。
probe: tqsdk
version: 1

requires:
  extras: [tqsdk]
  env: [TAPEHUB_TQSDK_AUTH_USER, TAPEHUB_TQSDK_AUTH_PASSWORD]

pacing:
  call_interval_s: 3.0
  timeout_s: 120
  # ⚠ 运行时段建议：盘中（如 09:30-15:00）运行——盘后复权数据服务无响应，
  # 股票/ETF 全部 qfq/hfq 复权 case 的 get_kline_serial(adj_type=F/B) 均挂满
  # timeout 超时（同标的同周期 adj_type=None 正常通过）；复权生效性已有盘中
  # 实证（hfq/none 差异显著），复权 case 判定以盘中运行为准；天勤不支持
  # BSE 前缀（BSE.920000 快速报「non-existent instrument」graphql 错误，
  # 闸门 case quote-bse-fingerprint）
  # 可用性 66（stock/stock@CN-SZSE/etf 各 12：分钟族仅 none + PT30M/PT1H/
  # P1D 三值——复权收窄后拆块；index/contract/continuous/weighted-index/
  # contract@CN-CZCE 各 6）+ adjust_diff 36 case（分钟族 18 条显式 SKIP：
  # compared adjust 未声明，0 调；PT30M+/P1D 18 条 × 2 调）+
  # history_depth 30 case×~13 + limit 1 + connection 9+12（创建+首调+释放）
  # + raw 9 case×2 调用（quote 矩阵含 BSE 闸门 + 郑商所 4 位 kline 挂起
  # 复验；3 位接受度由 chain contract@CN-CZCE 还原链路常态复验）
  # ≈ 622
  # （深度探针全周期同轮测量：保留边界随时间前移，矩阵须同一时点）
  max_calls: 700

targets:
  contract:
    # au2612 为示例合约：运行前请按上期所挂牌信息核对，探针失败会如实记录。
    # 标准代码统一大写（AU2612），SHFE 品种小写由适配器还原为上游写法
    instrument: CN-SHFE-AU2612
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 30
  contract@CN-CZCE:
    # 郑商所合约：标准码统一 4 位年月（公开现行约定；tushare/新浪 侧实证
    # 4 位可用、3 位全空）。TianQin 只认 3 位（CZCE.RM701 有数据、
    # 4 位 CZCE.RM2701 无响应挂起），适配器做 4→3 位还原（RM2701 → RM701），
    # 本目标 availability 即还原链路的常态复验；4 位直传挂起的原始证据见
    # raw case kline-czce-4digit
    instrument: CN-CZCE-RM2701
    window: {start: 2026-07-01, end: 2026-12-31}
    min_bars: 30
  continuous:
    instrument: CN-SHFE-CU
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  weighted-index:
    instrument: CN-SHFE-AU
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  stock:
    # A股实时与历史行情需专业版账户（权限属账户，与 SDK 无关）：当前账户即专业版
    instrument: CN-SSE-600000
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  stock@CN-SZSE:
    # 平安银行（深市主板）：交易所限定追加目标，SZSE. 前缀 chain 级实证
    #（tqsdk 代码格式 {exchange}.{symbol} 直拼）。BSE 不上 chain 目标：
    # 天勤对 BSE 前缀的支持性未知，由 raw 闸门 quote-bse-fingerprint 先探
    # 指纹，确认支持后再补目标
    instrument: CN-SZSE-000001
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  index:
    # 指数历史权限经专业版实测可用；失败如实记录
    instrument: CN-SSE-000016
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60
  etf:
    # ETF 权限口径未核实，失败如实记录
    instrument: CN-SSE-510050
    window: {start: 2026-07-01, end: 2026-11-30}
    min_bars: 60

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # 股票/ETF adj_type F/B 实证：前/后复权序列应与不复权存在差异（分红除权期）。
    # stock@CN-SZSE 为逐所细分复验
    targets: [stock, stock@CN-SZSE, etf]
    window: {start: 2024-06-01, end: 2024-08-31}
    pairs: [[none, qfq], [none, hfq]]
    fields: [close]
  history_depth:
    # stock 历史深度受专业版权限直接影响，是权限口径实证的关键探针；
    # probe_span_days=5：二分窗口 5 天，为分钟线滚动保留边界提供 ±5 天精度；
    # 分钟级周期一并探测，实测各类资产的滚动保留深度
    targets: [continuous, stock, index, etf, weighted-index]
    earliest: 2000-01-01
    era_step_years: 5
    max_calls: 16
    intervals: [P1D, PT1M, PT5M, PT15M, PT30M, PT1H]
    probe_span_days: 5
  limit_truncation:
    targets: [continuous]
    interval: P1D
    # 40 年窗口确保超过 8000/10000 根日线，实测裁决两种文档口径
    max_range: P40Y

connection:
  # ── P1：建连+鉴权+首数据耗时（单实例重复计时，量化长连接单实例化收益）──
  # 共享客户端参数（auth 经 $ctor 构造 TqAuth；凭据只经环境变量注入）
  - id: tqsdk-connect-latency
    purpose: 建连+鉴权+首数据耗时，单实例 3 轮重复计时
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    first_call: {method: get_kline_serial, kwargs: {symbol: "SHFE.au2612", duration_seconds: 86400, data_length: 2}}
    close: {method: close}
    rounds: 3
  # ── P2：并发实例共存验证（免费账户并发连接上限实证，回答现状每请求
  # 建连在并发下是否已踩线、单实例化后连接预算如何定）──
  - id: tqsdk-concurrent-instances-4
    purpose: 并发 4 实例同时创建+首数据+释放，验证账户并发连接上限
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    first_call: {method: get_kline_serial, kwargs: {symbol: "SHFE.au2612", duration_seconds: 86400, data_length: 2}}
    close: {method: close}
    rounds: 1
    concurrent: 4

raw:
  # ── P5：get_quote 字段/权限矩阵（实时快照链路的 manifest 声明基础）──
  # Quote 在首包前字段为 NaN：min_fields 只验证「订阅成功且字段键存在」，
  # 权限不足的表现（报错 vs 静默 NaN）由 sample 与判定如实记录；
  # 有文档依据的（期货/四大指数免费）断言，权限未核实的只观察不判定。
  - id: quote-contract
    purpose: 期货合约实时快照字段可用性（免费版权限亦有据，断言）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SHFE.au2612"}}
    close: {method: close}
    expect: {status: ok, min_fields: [last_price, bid_price1, ask_price1, volume]}
  - id: quote-contract-uppercase
    purpose: 大写合约上游敏感性实证（SHFE.AU2612，观察不判定，为 request_mapper 品种大小写还原表提供证据）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SHFE.AU2612"}}
    close: {method: close}
    expect: {status: ok, min_fields: [last_price]}
    assert: false
  - id: quote-continuous
    purpose: 主力连续实时快照字段可用性（断言）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "KQ.m@SHFE.cu"}}
    close: {method: close}
    expect: {status: ok, min_fields: [last_price, bid_price1, ask_price1, volume]}
  - id: quote-index-sse50
    purpose: 上证50 实时快照（免费版四大指数有文档依据，断言）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SSE.000016"}}
    close: {method: close}
    expect: {status: ok, min_fields: [last_price, bid_price1, ask_price1, volume]}
  - id: quote-stock
    purpose: A股个股实时快照（需专业版账户；当前账户盘中实测可得实时五档）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SSE.600000"}}
    close: {method: close}
    expect: {status: ok, min_fields: [last_price]}
    assert: false
  - id: quote-etf
    purpose: ETF 实时快照（当前专业版账户盘中实测可得实时五档）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "SSE.510050"}}
    close: {method: close}
    expect: {status: ok, min_fields: [last_price]}
    assert: false
  - id: quote-weighted-index
    purpose: 商品加权指数实时快照权限口径未核实，只观察
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "KQ.i@SHFE.au"}}
    close: {method: close}
    expect: {status: ok, min_fields: [last_price]}
    assert: false
  - id: quote-bse-fingerprint
    purpose: 北交所支持性闸门（get_quote BSE.920000，观察不判定）：天勤对 BSE
      代码前缀的支持性未知（文档无 BSE 示例），指纹（数据/错误形态）决定
      后续是否上 stock@CN-BSE chain 目标——支持性确认前不盲目加 chain 目标
      （增量约 42 调用预算）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_quote, kwargs: {symbol: "BSE.920000"}}
    close: {method: close}
    expect: {status: ok, min_fields: [last_price]}
    assert: false
  - id: kline-czce-4digit
    purpose: 郑商所 4 位年月码上游接受度实证（get_kline_serial CZCE.RM2701，
      观察不判定；已实证 4 位无响应挂起——TianQin 只认 3 位，
      适配器据此做 4→3 位还原，本 case 常态复验该结论；3 位侧常态复验由
      chain contract@CN-CZCE 承担，原 kline-czce-3digit raw 已退役）
    module: tqsdk
    client:
      attr: TqApi
      kwargs:
        auth:
          $ctor:
            attr: TqAuth
            kwargs:
              user_name: "$TAPEHUB_TQSDK_AUTH_USER"
              password: "$TAPEHUB_TQSDK_AUTH_PASSWORD"
        disable_print: true
    call:
      - {method: get_kline_serial, kwargs: {symbol: "CZCE.RM2701", duration_seconds: 86400, data_length: 2}}
    close: {method: close}
    expect: {status: ok, min_rows: 1}
    assert: false

notes: 各轮运行记录见 probes/results/PROBE_LOG.md（不入库）；探针框架规范见 probes/README.md。
