# Twelve Data 数据探针：外汇/加密货币可用性、历史深度、单次上限与错误指纹探测。
# 免费档限频 8 次/分钟、800 次/天，pacing 设为 10 秒（任意 60 秒窗口最多 6 次，留安全余量）。
probe: twelvedata
version: 1

requires:
  extras: [twelvedata]
  env: [TAPEHUB_TWELVEDATA_API_KEY]

pacing:
  call_interval_s: 10.0
  timeout_s: 60
  max_calls: 60

targets:
  # min_bars 按资产类型统一生效、覆盖全部声明周期：窗口取两年、下限取 20，
  # 以最稀的月线为标定（约 24 根），避免周/月线被日线口径误伤（同 2ce00f5 的假阳性）
  forex:
    instrument: GLOBAL-OTC-EUR/USD
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20
  crypto:
    instrument: GLOBAL-CRYPTO-BTC/USD
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20

chain:
  include_declared: true
  skip: []
  history_depth:
    targets: [forex]
    earliest: 2000-01-01   # 2026-11-04 实测下限触底（真实最早点更早），精化需前推 earliest 再跑
    era_step_years: 5
    max_calls: 16
    intervals: [P1D]     # 分钟级历史深度成本高（1min 数据量大），收敛到日线
  limit_truncation:
    targets: [forex]
    interval: PT1M
    max_range: P1Y
    documented_max: 5000   # 适配器显式传 outputsize=5000（上游默认仅 30）

raw:
  # 错误指纹仅观察：采集无效 API Key 的原始报错，供 UPSTREAM 细分错误码参考
  - id: td-invalid-key-fingerprint
    purpose: 采集无效 API Key 的错误指纹（字面量假 Key，非真实凭据；仅观察）
    assert: false
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "probe-invalid-key-not-a-credential"}}
    call:
      - {method: time_series, kwargs: {symbol: "EUR/USD", interval: "1min", outputsize: 1}}
      - {method: as_json, kwargs: {}}
    expect: {status: error, error_contains: ""}

notes: >
  crypto 的 volume 上游可能缺失（→ null），从 availability 的 null_rates 核对；
  45min/2h/4h/8h 已于 2026-11-04 经实测确认可用并回填 manifest 声明
  （报告 20261104T061857Z），对应 raw 探针随之移除、由 availability 链路覆盖；
  上游 values 默认倒序，适配器已统一升序，报告首尾时间戳应体现这一点。
