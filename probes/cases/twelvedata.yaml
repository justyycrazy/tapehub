# Twelve Data 数据探针：外汇/加密货币/美股可用性、历史深度、单次上限与错误指纹探测。
# 免费档限频 8 次/分钟、800 次/天，pacing 设为 10 秒（任意 60 秒窗口最多 6 次，留安全余量）。
probe: twelvedata
version: 1

requires:
  extras: [twelvedata]
  env: [TAPEHUB_TWELVEDATA_API_KEY]

pacing:
  call_interval_s: 10.0
  timeout_s: 60
  # 本轮构成：availability 60 固定 + adjust_diff 2 case×2 + history_depth
  # 9 case×16 最坏（典型 ~8/case）+ limit 2 + raw 8 case×3 = 约 230 最坏、
  # 典型 ~170。免费档 800/天为硬上限：预算 780 保留（单日可完整跑全量 +
  # 截断续跑余量，框架对截断如实记录）。
  max_calls: 780

targets:
  # min_bars 按资产类型统一生效、覆盖全部声明周期：窗口取两年、下限取 20，
  # 以最稀的月线为标定（约 24 根），避免周/月线被日线口径误伤（同 2ce00f5 的假阳性）
  forex:
    instrument: GLOBAL-OTC-EUR/USD
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20
  crypto:
    instrument: GLOBAL-CRYPTO-BTC/USD
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20
  # 美股（2026-11-05 目录探针实证免费档 Basic 全量可用）：AAPL/NASDAQ 与
  # SPY/NYSE 分别覆盖白名单两大交易所；stock 因声明 [none, qfq] 会生成
  # 24 条 availability case（12 周期 × 2 复权）
  stock:
    instrument: US-NASDAQ-AAPL
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20
  etf:
    instrument: US-NYSE-SPY
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # stock/etf 复权入库回归：qfq=adjust=all（拆股+分红）——stock 于
    # 2026-11-06 由不入库专项探针实证、2026-11-12 起入链；etf 于 2026-11-12
    # raw 直测实证生效（SPY 除息窗口全 19 交易日差异）并扩容声明后入链；
    # PT1H 顺带回归日内周期
    targets: [stock, etf]
    window: {start: 2024-06-01, end: 2024-08-31}   # 分红除权高发窗口
    intervals: [P1D, PT1H]
    pairs: [[none, qfq]]
    fields: [close]
  history_depth:
    # 2026-11-12 精化后仅 forex P1W/P1M 残留待收敛：1970 下限仍触底（周/月
    # 档案深于 1970——官方轨迹 [1970,1980) 档 262 根周线 ≈5 年量级，真实起点
    # ≈1975），下限再外推至 1950 收敛；stock/etf 粗周期本轮已收敛、forex P1D
    # 已收敛（≈2003-12-25）、crypto 为收敛值——均不再重探
    targets: [forex]
    earliest: 1950-01-01
    era_step_years: 10   # 1950→2026 共 8 档（回溯至 1960-70 空档止）+ 二分
    max_calls: 16
    intervals: [P1W, P1M]
  limit_truncation:
    targets: [forex, stock]
    interval: PT1M
    max_range: P1Y
    documented_max: 5000   # 适配器显式传 outputsize=5000（上游默认仅 30）

raw:
  # 错误指纹仅观察：采集无效 API Key 的原始报错，供 UPSTREAM 细分错误码参考
  - id: td-invalid-key-fingerprint
    purpose: 采集无效 API Key 的错误指纹（字面量假 Key，非真实凭据；仅观察）
    assert: false
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "probe-invalid-key-not-a-credential"}}
    call:
      - {method: time_series, kwargs: {symbol: "EUR/USD", interval: "1min", outputsize: 1}}
      - {method: as_json, kwargs: {}}
    expect: {status: error, error_contains: ""}

  # ── 实时快照（REST /quote）：字段矩阵与错误指纹，供 extensions 白名单
  #    回填决策（与 tqsdk P5 流程一致；quote 结果为单个对象，sample 即完整
  #    字段矩阵）。适配器显式传 interval=1day/timezone=UTC/eod=false，
  #    探针以同参数实证返回形态；每 case 消耗 3 次调用（构造 + quote + as_json）
  - id: td-quote-forex
    purpose: 外汇实时快照字段矩阵（外汇通常无 volume，故不入 min_fields；文档核实字段断言）
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "$TAPEHUB_TWELVEDATA_API_KEY"}}
    call:
      - {method: quote, kwargs: {symbol: "EUR/USD", interval: "1day", timezone: "UTC", eod: false}}
      - {method: as_json, kwargs: {}}
    expect: {status: ok, min_fields: [symbol, datetime, timestamp, last_quote_at, close]}
  - id: td-quote-crypto
    purpose: 加密货币实时快照字段矩阵（2026-11-05 实测无 volume；含 crypto 专属 rolling 字段形态）
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "$TAPEHUB_TWELVEDATA_API_KEY"}}
    call:
      - {method: quote, kwargs: {symbol: "BTC/USD", interval: "1day", timezone: "UTC", eod: false}}
      - {method: as_json, kwargs: {}}
    expect: {status: ok, min_fields: [symbol, datetime, timestamp, last_quote_at, close]}
  - id: td-quote-invalid-symbol-fingerprint
    purpose: 采集无效标的的 quote 错误指纹（仅供 UPSTREAM 细分错误码参考；观察）
    assert: false
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "$TAPEHUB_TWELVEDATA_API_KEY"}}
    call:
      - {method: quote, kwargs: {symbol: "NOT/A/SYMBOL", interval: "1day", timezone: "UTC", eod: false}}
      - {method: as_json, kwargs: {}}
    expect: {status: error, error_contains: ""}

  # ── 美股 exchange 白名单准入：CBOE（目录 1,502 个 ETF 的交易所）。
  #    本 case 是 manifest 美股白名单含 CBOE 的准入闸门——失败则移除 CBOE
  - id: td-cboe-etf
    purpose: 验证 exchange=CBOE 参数可用（美股白名单准入闸门，2026-11-06）
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "$TAPEHUB_TWELVEDATA_API_KEY"}}
    call:
      - {method: time_series, kwargs: {symbol: "AAAA", exchange: "CBOE", interval: "1day", outputsize: 5}}
      - {method: as_json, kwargs: {}}
    expect: {status: ok, min_rows: 1}

  # ── CN/HK 计划门槛指纹（2026-11-05 目录探针：Basic 可用仅 CN stock/etf、
  #    HK stock 各 1 个标的）：记录 404 Pro 门槛报错形态，升档后复测回填
  - id: td-hk-pro-threshold-fingerprint
    purpose: 采集 HK 标的 Pro 计划门槛错误指纹（CN/HK 不声明的实证依据；观察）
    assert: false
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "$TAPEHUB_TWELVEDATA_API_KEY"}}
    call:
      - {method: time_series, kwargs: {symbol: "0700", exchange: "HKEX", interval: "1day", outputsize: 5}}
      - {method: as_json, kwargs: {}}
    expect: {status: error, error_contains: ""}

  # ── US ETF 复权直测（2026-11-12 改造）：链内 adjust_diff 对未声明 qfq 的
  #    etf 会 skipped（展开器按声明矩阵标记 skip_reason），故仿 td-cboe-etf
  #    三段式直测上游。SPY 季度分红除息日 2024-06-21 落在窗口内，除息日前
  #    bar 若 all 与 none 存在差异即复权生效 → manifest etf 扩容 [none, qfq]
  #    的依据；**必须显式传 adjust**（不传上游默认 splits 仅拆股）
  - id: td-etf-adjust-none
    purpose: SPY 日线 adjust=none 基线（除息窗口，与 td-etf-adjust-all 对比）
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "$TAPEHUB_TWELVEDATA_API_KEY"}}
    call:
      - {method: time_series, kwargs: {symbol: "SPY", interval: "1day", adjust: "none", start_date: "2024-06-01", end_date: "2024-06-30", outputsize: 30}}
      - {method: as_json, kwargs: {}}
    expect: {status: ok, min_rows: 1}
  - id: td-etf-adjust-all
    purpose: SPY 日线 adjust=all（拆股+分红前复权）；与 none 基线同窗口对比
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "$TAPEHUB_TWELVEDATA_API_KEY"}}
    call:
      - {method: time_series, kwargs: {symbol: "SPY", interval: "1day", adjust: "all", start_date: "2024-06-01", end_date: "2024-06-30", outputsize: 30}}
      - {method: as_json, kwargs: {}}
    expect: {status: ok, min_rows: 1}

notes: >
  crypto 的 volume 上游可能缺失（→ null），从 availability 的 null_rates 核对；
  45min/2h/4h/8h 已于 2026-11-04 经实测确认可用并回填 manifest 声明
  （报告 20261104T061857Z），对应 raw 探针随之移除、由 availability 链路覆盖；
  24 个周期 history.start 已按全量深度实测回填（报告 20261104T072650Z、
  20261104T084302Z；粒度 90 天 approx，forex 粗周期触底待精化）；
  上游 values 默认倒序，适配器已统一升序，报告首尾时间戳应体现这一点；
  2026-11-05 全量重跑（报告 20261105T184934+0800，人工确认回填）：
  quote 探针实证 forex/crypto 的 /quote 均未返回 volume（及 currency/
  mic_code，文档列出但实测缺），manifest quotes fields 收窄为
  timestamp/last_price、extensions 白名单回填 9 个标量字段；last_quote_at
  实测≈墙钟实时（快照新鲜度口径成立）；forex PT8H 深度 case 瞬时
  ReadTimeout（该周期 2026-11-04 报告已确认，本轮其余 23 条深度 case 全
  过，未重跑）；实测 exchange 值 forex="Forex"、crypto="Binance"；
  美股 stock/etf（2026-11-06 接入）：目录/计划门槛/adjust 语义/时区已由
  catalog-coverage-*、plan-dist-3-* 与 20261106T004624+0800 轮次的后续
  纠偏实证确认（探针目录外脚本，不入库）——**参数名陷阱**：上游 REST 只认
  adjust，传 adj 会被静默忽略落回默认（=splits 仅拆股）；adjust=dividends
  实测生效（AAPL 2026 年 150/212 天与 none 有差异），qfq → adjust=all
  （拆股+分红，与国内口径一致），none → adjust=none；不传时上游默认
  splits（AAPL 2006 深度实证），适配器始终显式传参；本轮 availability
  验证 12 周期 × 复权矩阵（stock 24 + etf 12 case）、history_depth 回填
  24 个周期的 history.start（预算 780 见 pacing 注释，截断则次日续跑）；
  qfq 与 none case 在有分红的窗口内数据**应存在差异**（除息回溯调整），
  无差异反而说明复权未生效需排查；
  2026-11-07 全量重跑（报告 20261107T111630+0800，447/780 配额）：
  availability 60/60 confirmed（美股 36 条含 24 stock×none/qfq + 12 etf，
  volume null 率 0；日内 PT1M/PT5M/PT15M/PT30M 触 5000 上限 partial=True）；
  limit stock/forex 均 5000 confirmed；CBOE 准入 raw case confirmed；
  td-quote-crypto 修复后 confirmed；48 条 depth complete，stock/etf
  24 周期 history.start 已按估计日零点回填（人工确认：stock 日内
  ≈2019-02-01~2020-04-11、etf 日内 ≈2020-02-15~2020-04-11，粗周期
  触底 2000-01-01 待精化）；forex/crypto 本轮估计与已回填值 ±1 粒度内
  漂移，维持原值；
  2026-11-12 改造（粗周期精化 + etf 复权直测 + adjust_diff 入链）：粗周期
  （P1D/P1W/P1M）earliest 2000→1970 外推精化（targets 收敛 forex/stock/etf，
  crypto 为收敛值不重探；日内 9 周期不重探）；stock 复权 adjust_diff 首次
  入链（P1D/PT1H，qfq=all 与 none 应有除息差异）；etf 复权 raw 直测
  （td-etf-adjust-none/all，SPY 2024-06 除息窗口——链内对未声明 qfq 会
  skipped 故走 raw）——证实生效则 manifest etf 扩容 [none, qfq]；
  2026-11-12 本轮结果（报告 20261112T143502+0800，188/780）：
  confirmed 69 / observe 12 零 failed——stock adjust_diff P1D/PT1H 入链
  confirmed（差异真实）；etf 复权 raw 全窗口 19/19 交易日差异 ~2.9%
  （累计分红回溯量级合理）→ manifest etf 扩容 [none, qfq]、adjust_diff
  targets 加 etf；粗周期精化：US stock ≈1981-01-18（三周期一致，真值≈
  AAPL IPO 1980-12-12 落窗口内）、US etf ≈1993-03（SPY 1993-01-22 上市
  落窗口内）、forex P1D ≈2003-12-25 收敛——回填待人工确认；forex P1W/P1M
  在 1970 下限仍触底（周/月档案深于 1970，approx=True，真实更早）；
  2026-11-12 收敛轮（报告 20261112T155931+0800，134/780；earliest 1950 /
  targets [forex] / intervals [P1W, P1M]）：forex P1W/P1M 均收敛
  ≈1975-01-23（首个非空 90 天窗 [1974-10-25, 1975-01-23]：周线 4 根 /
  月线 1 根，其前所有窗口验证为空）——粗周期 9 周期全部收敛，经用户确认
  回填。方法论教训：手动无节流脚本会吃免费档 429 限频、产生假空档（本轮
  曾误判 1960-1970 档与 1970 年代多窗为空），以框架 10s 节流结果为准；
  另触底分支的 estimate=earliest 为无证据下限，一律不回填（下限值须先
  外推收敛或保持 null）。
