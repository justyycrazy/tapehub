# Twelve Data 数据探针：外汇/加密货币/美股可用性、历史深度、单次上限与错误指纹探测。
# 免费档限频 8 次/分钟、800 次/天，pacing 设为 10 秒（任意 60 秒窗口最多 6 次，留安全余量）。
probe: twelvedata
version: 1

requires:
  extras: [twelvedata]
  env: [TAPEHUB_TWELVEDATA_API_KEY]

pacing:
  call_interval_s: 10.0
  timeout_s: 60
  # 本轮构成：availability 120（forex 12 + crypto 12 + stock 基准/NASDAQ
  # 逐所追加各 24 + etf 48：NYSE/SPY 基准与 CBOE/AAAA 逐所追加各 12 周期
  # × 2 复权）+ quote_availability 2（quotes 声明随 include_declared 自动
  # 展开：forex + crypto 各 1 调）+ adjust_diff（stock 基准/NASDAQ 逐所/etf
  # × P1D+PT1H × 1 pair × 2 调 = 12）+ limit 2 + raw 2 case×3 = 最坏约
  # 142（history_depth 已收口移除，见 chain 注记）。
  # 免费档 800/天为硬上限：预算 780 保留（单日可完整跑全量 + 截断续跑余量，
  # 框架对截断如实记录）。
  max_calls: 780

targets:
  # min_bars 按资产类型统一生效、覆盖全部声明周期：窗口取两年、下限取 20，
  # 以最稀的月线为标定（约 24 根），避免周/月线被日线口径误伤
  forex:
    instrument: GLOBAL-OTC-EUR/USD
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20
  crypto:
    instrument: GLOBAL-CRYPTO-BTC/USD
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20
  # 美股（目录探针实证免费档 Basic 全量可用）：基准换 GE（NYSE，1892 上市）
  # 与 alphafeed/futunn/tickflow 统一「早上市标的」——库底收敛点为真实库底
  # 而非标的上市日伪影（原 AAPL 1980-12 IPO 落 ≈1981 收敛窗内）。stock@US-
  # NASDAQ 为交易所段逐所追加目标（参照 stock@CN-SZSE 先例），保持 NASDAQ
  # 段 stock 覆盖（adjust=all 语义 NASDAQ 段实证）。stock 声明 [none, qfq]：
  # 基准与逐所各生成 24 条 availability case（12 周期 × 2 复权）
  stock:
    instrument: US-NYSE-GE
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20
  stock@US-NASDAQ:
    instrument: US-NASDAQ-AAPL
    # AAPL：NASDAQ 段逐所复验（原 stock 基准降为逐所目标）
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20
  etf:
    instrument: US-NYSE-SPY
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20
  etf@US-CBOE:
    instrument: US-CBOE-IEFA
    # CBOE 上市 ETF：exchange 白名单分支（NYSE/NASDAQ/CBOE，US 段三候选见
    # domain instrument_resolver）的 chain 级常态复验目标——原 raw td-cboe-etf
    # raw 准入闸门升级入链，availability 全声明矩阵展开（12 周期 × 2 复权），
    # 参照 stock@CN-SZSE 逐所细分先例。2026-11-17 轮换——原目标 AAAA 月线
    # 档案自 2025-07 起（两年窗口仅 6 根月线，第 1 轮 P1M×2 撞 min_bars=20
    # 门槛 failed），按人工确认换成熟标的 IEFA：目录外直测全档案 P1D 3535
    # 根（起点 2012-10-24）/ P1W 738 / P1M 170，窗口内月线 ≈24 根正常过闸
    window: {start: 2024-01-01, end: 2025-12-31}
    min_bars: 20

chain:
  include_declared: true
  skip: []
  adjust_diff:
    # stock（基准 + NASDAQ 逐所）/etf 复权入库回归：qfq=adjust=all（拆股+
    # 分红）——stock/etf 均实证生效（SPY 除息窗口全 19 交易日差异）并扩容
    # 声明后入链；PT1H 顺带回归日内周期
    targets: [stock, stock@US-NASDAQ, etf]
    window: {start: 2024-06-01, end: 2024-08-31}   # 分红除权高发窗口
    intervals: [P1D, PT1H]
    pairs: [[none, qfq]]
    fields: [close]
  # history_depth 已收口（2026-11-17 第 1 轮）：forex P1W 干净收敛（est
  # 1975-01-01 / 实测首根 1974-12-29）、P1M 月线档案 2010 年以前稀疏碎片
  # 二分不可定案（详见 docs/providers/twelvedata.md 与 PROBE_LOG 第 1 轮）
  # ——两项已按人工确认的统一口径归入 2000-01-01 声明，不重复消耗配额；
  # stock/etf 粗周期与 forex P1D、crypto 早已收敛（GE 换基准后的 stock
  # 深库复探待另行专项）
  limit_truncation:
    targets: [forex, stock]
    interval: PT1M
    max_range: P1Y
    documented_max: 5000   # 适配器显式传 outputsize=5000（上游默认仅 30）

raw:
  # 错误指纹仅观察：采集无效 API Key 的原始报错，供 UPSTREAM 细分错误码参考
  - id: td-invalid-key-fingerprint
    purpose: 采集无效 API Key 的错误指纹（字面量假 Key，非真实凭据；仅观察）
    assert: false
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "probe-invalid-key-not-a-credential"}}
    call:
      - {method: time_series, kwargs: {symbol: "EUR/USD", interval: "1min", outputsize: 1}}
      - {method: as_json, kwargs: {}}
    expect: {status: error, error_contains: ""}

  - id: td-quote-invalid-symbol-fingerprint
    purpose: 采集无效标的的 quote 错误指纹（仅供 UPSTREAM 细分错误码参考；观察）
    assert: false
    module: twelvedata
    client: {attr: TDClient, kwargs: {apikey: "$TAPEHUB_TWELVEDATA_API_KEY"}}
    call:
      - {method: quote, kwargs: {symbol: "NOT/A/SYMBOL", interval: "1day", timezone: "UTC", eod: false}}
      - {method: as_json, kwargs: {}}
    expect: {status: error, error_contains: ""}

notes: 探针框架规范见 docs/probes.md。
