# TickFlow（tickflow）能力声明与内部操作映射。
# 映射细则、上游行为定案与历史覆盖依据：docs/providers/tickflow.md（唯一出处，本文不复述）。
# 官方文档：https://docs.tickflow.org/zh-hans/
provider: tickflow
default_variant: tickflow

capabilities:
  # 三市场 history.start 均按实测首根日精度精化（探针 2026-11-17 第 1 轮
  # history_depth；CN 首根 = 上交所开业日 1990-12-19，HK 首根 1980-01-02，
  # US 首根 1962-01-02 与 alphafeed 侧逐位一致——同源库底）
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [tickflow]
    intervals:
      - {code: P1D, history: {start: 1990-12-19T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1990-12-19T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1990-12-19T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]
  # 指数：与 stock 共用统一 klines 端点（探针 2026-11-15 第 7/8 轮直测
  # 000001.SH 日/周/月均有数）；复权对指数无意义仅声明 none（baostock/
  # tushare/alphafeed 先例同口径）；history 未核实保持 null（chain 二分后回填）
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [tickflow]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]
  # ETF：与 stock 共用统一 klines 端点（探针直测 510050.SH 日/周/月均有数）；
  # 复权生效经目录外诊断实证（forward vs none 全窗差异，与 alphafeed 侧互证）；
  # 量额与股票日线同口径原值透出（与 tushare 同窗互证：vol 手/amount 元）；
  # history 未核实保持 null
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [tickflow]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]
  - data_type: bars
    markets: [HK]
    asset_types: [stock]
    delivery: [rest]
    variants: [tickflow]
    intervals:
      - {code: P1D, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]
  - data_type: bars
    markets: [US]
    asset_types: [stock]
    delivery: [rest]
    variants: [tickflow]
    intervals:
      - {code: P1D, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]
  # ETF：与 stock 共用统一 klines 端点（目录外诊断直测 SPY.US/QQQ.US 日线
  # 均有数，与 alphafeed 侧逐位互证）；三复权生效（hfq vs none vs qfq 全窗
  # 差异，锚定语义见 docs/providers/tickflow.md）；量额同 US stock 日线
  # 口径（amount 上游原值 0）；history 未核实保持 null
  - data_type: bars
    markets: [US]
    asset_types: [etf]
    delivery: [rest]
    variants: [tickflow]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]
  - data_type: quotes
    markets: [CN, HK, US]
    asset_types: [stock]
    delivery: [rest]
    variants: [tickflow]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]

  # 快照扩容（2026-11-15 目录外诊断第 11 轮：CN ETF 两交易所段/CN 指数/
  # US ETF 两交易所段六标的端到端实证，与 stock 快照同形结构、与 alphafeed
  # 侧逐位互证）；与 stock 快照共用统一 quotes 端点，映射层零分支。
  # 指数行 ext 无 turnover_rate（指数无换手）；ext.type 不区分证券类型，
  # 不在白名单、不透出。
  - data_type: quotes
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [tickflow]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]
  - data_type: quotes
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [tickflow]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]
  - data_type: quotes
    markets: [US]
    asset_types: [etf]
    delivery: [rest]
    variants: [tickflow]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]

operations:
  # 全部市场 × 周期 × 复权组合都调用同一上游接口 tf.klines.get；
  # quotes 快照按市场各一条，调用 tf.quotes.get。
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: hfq, variant: tickflow}
    operation: klines
  # —— CN 指数：三周期 × 仅 none（指数无复权）——
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1D, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1W, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1M, adjust: none, variant: tickflow}
    operation: klines
  # —— CN ETF：三周期 × 三复权（复权生效经目录外诊断实证）——
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1W, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1W, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1W, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1M, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1M, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1M, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1D, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1D, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1D, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1W, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1W, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1W, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1M, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1M, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1M, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1D, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1D, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1D, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: hfq, variant: tickflow}
    operation: klines
  # —— US ETF：三周期 × 三复权（复权生效经目录外诊断实证）——
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1D, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1D, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1D, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1W, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1W, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1W, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1M, adjust: none, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1M, adjust: qfq, variant: tickflow}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1M, adjust: hfq, variant: tickflow}
    operation: klines
  - match: {data_type: quotes, market: CN, asset_type: stock, interval: null, adjust: null, variant: tickflow}
    operation: quotes
  - match: {data_type: quotes, market: HK, asset_type: stock, interval: null, adjust: null, variant: tickflow}
    operation: quotes
  - match: {data_type: quotes, market: US, asset_type: stock, interval: null, adjust: null, variant: tickflow}
    operation: quotes
  # —— quotes 扩容（2026-11-15 目录外诊断第 11 轮实证）：CN 指数/ETF 与
  #    US ETF 与 stock 快照共用同一端点与响应结构 ——
  - match: {data_type: quotes, market: CN, asset_type: index, interval: null, adjust: null, variant: tickflow}
    operation: quotes
  - match: {data_type: quotes, market: CN, asset_type: etf, interval: null, adjust: null, variant: tickflow}
    operation: quotes
  - match: {data_type: quotes, market: US, asset_type: etf, interval: null, adjust: null, variant: tickflow}
    operation: quotes
