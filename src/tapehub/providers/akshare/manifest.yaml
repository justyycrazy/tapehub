# akshare 适配器：能力声明与内部操作映射。
# 接口签名均已按官方文档核实：https://akshare.akfamily.xyz/
#
# 说明：
# - variant 为数据源变体：eastmoney=东方财富（默认）、sina=新浪、tencent=腾讯；
# - 历史覆盖范围（history）未核实，保持 null，不编造；
# - 期货东财接口 futures_hist_em 需要中文合约名（如“热卷主连”），无法从
#   标准标的代码映射，第一版不接入；
# - “加权”在上列接口文档中没有对应符号说明，暂不声明 weighted-index 能力；
# - 指数三个接口均无复权参数，adjust 仅支持 none。
provider: akshare
enabled: true

capabilities:
  # 个股（A 股）· 东方财富：日/周/月线，支持不复权/前复权/后复权
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [eastmoney]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 个股 · 新浪：仅日线，支持三种复权
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [sina]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 个股 · 腾讯：仅日线，支持三种复权
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [tencent]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 指数 · 东方财富：日线（symbol 前缀支持 sh/sz/csi/bj）
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [eastmoney]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 指数 · 新浪：日线，无成交额字段
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [sina]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]

  # 指数 · 腾讯：日线，无独立成交额字段（上游 amount 列语义为成交量，映射到 volume）
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [tencent]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]

  # 期货 · 新浪：单一合约（RB2410）与主力连续（品种代码+0，如 RB0），仅日线
  - data_type: bars
    markets: [CN]
    asset_types: [contract, continuous]
    delivery: [rest]
    variants: [sina]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]

operations:
  # 个股 · 东方财富：stock_zh_a_hist(symbol, period, start_date, end_date, adjust)
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: none, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: qfq, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: hfq, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: none, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: qfq, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: hfq, variant: eastmoney}
    operation: stock_zh_a_hist

  # 个股 · 新浪：stock_zh_a_daily(symbol, start_date, end_date, adjust)
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: sina}
    operation: stock_zh_a_daily
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: sina}
    operation: stock_zh_a_daily
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: sina}
    operation: stock_zh_a_daily

  # 个股 · 腾讯：stock_zh_a_hist_tx(symbol, start_date, end_date, adjust)
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: tencent}
    operation: stock_zh_a_hist_tx
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: tencent}
    operation: stock_zh_a_hist_tx
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: tencent}
    operation: stock_zh_a_hist_tx

  # 指数：三个源均无 adjust
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1D, adjust: none, variant: eastmoney}
    operation: stock_zh_index_daily_em
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1D, adjust: none, variant: sina}
    operation: stock_zh_index_daily
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1D, adjust: none, variant: tencent}
    operation: stock_zh_index_daily_tx

  # 期货 · 新浪：futures_zh_daily_sina(symbol)，无日期参数，由适配器内存过滤
  - match: {data_type: bars, market: CN, asset_type: contract, interval: P1D, adjust: none, variant: sina}
    operation: futures_zh_daily_sina
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: P1D, adjust: none, variant: sina}
    operation: futures_zh_daily_sina
