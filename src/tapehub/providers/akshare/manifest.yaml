# akshare 适配器：能力声明与内部操作映射。
# 接口签名均已按官方文档核实：https://akshare.akfamily.xyz/
#
# 说明：
# - variant 为数据源变体：eastmoney=东方财富（默认）、sina=新浪、tencent=腾讯；
# - 历史覆盖范围（history.start）由数据探针实测回填（报告 20261106T211255+0800，
#   P1W 补测报告 20261107T144712+0800）：个股各源 ≈1999-12-08（二分近似，窗口
#   粒度 90 天、complete=True；真值≈标的上市日 1999-11-10，落在估算窗口内；
#   P1W/P1M 与 P1D 同上游端点同数据区间，同值声明，P1W 经定向重跑实证确认）、
#   指数各源 ≈1991-01-01（探针
#   下限触底，complete=True）；期货为全量模式精确值（approx=False）：单合约
#   RB2410 实测 2023-10-17（capability 为 asset_type 级声明，各合约以自身
#   上市/摘牌日为准，end 随摘牌），主力连续 RB 实测 2009-03-27（与上期所
#   螺纹钢期货上市日一致，相互印证）；
# - 期货东财接口 futures_hist_em 需要中文合约名（如“热卷主连”），无法从
#   标准标的代码映射，第一版不接入；
# - “加权”在上列接口文档中没有对应符号说明，暂不声明 weighted-index 能力；
# - 指数三个接口均无复权参数，adjust 仅支持 none；
# - ETF（fund_etf_hist_em）与个股东财接口同上游 kline 端点同列（中文 11 列、
#   无「股票代码」列），成交量口径同为手（标准化为股，×100 换算经探针实证：
#   换算后成交额÷成交量≈价格）；symbol 为纯 6 位代码，上游按代码首位自动
#   判断沪深（5/6 开头→沪，其余→深）；
# - 港股（stock_hk_hist）/美股（stock_us_hist）与 A 股东财接口同端点同列；
#   成交量单位经探针实证为股（成交额÷成交量≈价格），原样透出正确、无需换算；
#   美股日线时间戳口径为美东零点（对齐 twelvedata，归一化北京时间 12:00/13:00，
#   探针实测 EST 13:00）、港股为北京零点；两个接口上游均忽略 beg
#   （lmt=1000000 全量拉取客户端切片），适配器闭区间内存过滤兜底；美股 symbol
#   为东财市场号.代码（NASDAQ→105、NYSE→106），CBOE/OTC 市场号归属未核实
#   不声明；
# - ETF/港股/美股历史覆盖范围（history.start）由数据探针实测回填（报告
#   20261108T150042+0800，人工确认；approx ±90 天、窗口粒度 90 天、
#   complete=True；P1W/P1M 与 P1D 同上游端点同数据区间，同值声明）。
provider: akshare
default_variant:
  stock: eastmoney
  index: eastmoney
  etf: eastmoney
  contract: sina
  continuous: sina

capabilities:
  # 个股（A 股）· 东方财富：日/周/月线，支持不复权/前复权/后复权
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [eastmoney]
    intervals:
      - {code: P1D, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 个股 · 新浪：仅日线，支持三种复权
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [sina]
    intervals:
      - {code: P1D, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 个股 · 腾讯：仅日线，支持三种复权
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [tencent]
    intervals:
      - {code: P1D, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 指数 · 东方财富：日线（symbol 前缀支持 sh/sz/csi/bj）
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [eastmoney]
    intervals:
      - {code: P1D, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 指数 · 新浪：日线，无成交额字段
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [sina]
    intervals:
      - {code: P1D, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]

  # 指数 · 腾讯：日线，无独立成交额字段（上游 amount 列语义为成交量，映射到 volume）
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [tencent]
    intervals:
      - {code: P1D, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]

  # ETF · 东方财富：日/周/月线，支持不复权/前复权/后复权（与个股同端点同列，
  #   成交量单位手，×100 经探针实证）；history.start 探针实测回填（报告
  #   20261108T150042+0800，人工确认，approx ±90 天）
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [eastmoney]
    intervals:
      - {code: P1D, history: {start: 2005-03-20T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2005-03-20T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2005-03-20T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 港股 · 东方财富：日/周/月线，支持不复权/前复权/后复权；成交量单位经探针
  #   实证为股（原样透出正确）；history.start 探针实测回填（基准标的 00002，
  #   approx ±90 天）
  - data_type: bars
    markets: [HK]
    asset_types: [stock]
    delivery: [rest]
    variants: [eastmoney]
    intervals:
      - {code: P1D, history: {start: 1989-01-27T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1989-01-27T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1989-01-27T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 美股 · 东方财富：日/周/月线，支持不复权/前复权/后复权；NASDAQ→105、
  #   NYSE→106（CBOE/OTC 市场号归属未核实不声明）；美股日线时间戳为美东
  #   零点（归一化北京时间 12:00/13:00，探针实测 EST 13:00）；成交量单位经
  #   探针实证为股（原样透出正确）；history.start 探针实测回填（基准标的
  #   GE，approx ±90 天；浅于 tickflow/alphafeed 独立探测的 ≈1962，
  #   东财美股库底确实较浅，两口径互证）
  - data_type: bars
    markets: [US]
    asset_types: [stock]
    delivery: [rest]
    variants: [eastmoney]
    intervals:
      - {code: P1D, history: {start: 1986-02-21T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1986-02-21T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1986-02-21T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 期货 · 新浪：单一合约（如 RB2410），仅日线；start 为探针标的 RB2410 上市
  #   首日实测（全量模式精确定值，报告 20261106T211255+0800）——capability 为
  #   asset_type 级声明，各合约数据以自身上市日起、随摘牌止
  - data_type: bars
    markets: [CN]
    asset_types: [contract]
    delivery: [rest]
    variants: [sina]
    intervals:
      - {code: P1D, history: {start: 2023-10-17T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]

  # 期货 · 新浪：主力连续（品种代码+0，如 RB0），仅日线；start 实测 2009-03-27
  #   与上期所螺纹钢期货上市日一致（全量模式精确定值）
  - data_type: bars
    markets: [CN]
    asset_types: [continuous]
    delivery: [rest]
    variants: [sina]
    intervals:
      - {code: P1D, history: {start: 2009-03-27T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]

operations:
  # 个股 · 东方财富：stock_zh_a_hist(symbol, period, start_date, end_date, adjust)
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: none, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: qfq, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: hfq, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: none, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: qfq, variant: eastmoney}
    operation: stock_zh_a_hist
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: hfq, variant: eastmoney}
    operation: stock_zh_a_hist

  # 个股 · 新浪：stock_zh_a_daily(symbol, start_date, end_date, adjust)
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: sina}
    operation: stock_zh_a_daily
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: sina}
    operation: stock_zh_a_daily
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: sina}
    operation: stock_zh_a_daily

  # 个股 · 腾讯：stock_zh_a_hist_tx(symbol, start_date, end_date, adjust)
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: tencent}
    operation: stock_zh_a_hist_tx
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: tencent}
    operation: stock_zh_a_hist_tx
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: tencent}
    operation: stock_zh_a_hist_tx

  # 指数：三个源均无 adjust
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1D, adjust: none, variant: eastmoney}
    operation: stock_zh_index_daily_em
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1D, adjust: none, variant: sina}
    operation: stock_zh_index_daily
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1D, adjust: none, variant: tencent}
    operation: stock_zh_index_daily_tx

  # ETF · 东方财富：fund_etf_hist_em(symbol, period, start_date, end_date, adjust)
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: none, variant: eastmoney}
    operation: fund_etf_hist_em
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: qfq, variant: eastmoney}
    operation: fund_etf_hist_em
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: hfq, variant: eastmoney}
    operation: fund_etf_hist_em
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1W, adjust: none, variant: eastmoney}
    operation: fund_etf_hist_em
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1W, adjust: qfq, variant: eastmoney}
    operation: fund_etf_hist_em
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1W, adjust: hfq, variant: eastmoney}
    operation: fund_etf_hist_em
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1M, adjust: none, variant: eastmoney}
    operation: fund_etf_hist_em
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1M, adjust: qfq, variant: eastmoney}
    operation: fund_etf_hist_em
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1M, adjust: hfq, variant: eastmoney}
    operation: fund_etf_hist_em

  # 港股 · 东方财富：stock_hk_hist(symbol, period, start_date, end_date, adjust)
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1D, adjust: none, variant: eastmoney}
    operation: stock_hk_hist
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1D, adjust: qfq, variant: eastmoney}
    operation: stock_hk_hist
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1D, adjust: hfq, variant: eastmoney}
    operation: stock_hk_hist
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1W, adjust: none, variant: eastmoney}
    operation: stock_hk_hist
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1W, adjust: qfq, variant: eastmoney}
    operation: stock_hk_hist
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1W, adjust: hfq, variant: eastmoney}
    operation: stock_hk_hist
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1M, adjust: none, variant: eastmoney}
    operation: stock_hk_hist
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1M, adjust: qfq, variant: eastmoney}
    operation: stock_hk_hist
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1M, adjust: hfq, variant: eastmoney}
    operation: stock_hk_hist

  # 美股 · 东方财富：stock_us_hist(symbol, period, start_date, end_date, adjust)
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1D, adjust: none, variant: eastmoney}
    operation: stock_us_hist
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1D, adjust: qfq, variant: eastmoney}
    operation: stock_us_hist
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1D, adjust: hfq, variant: eastmoney}
    operation: stock_us_hist
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: none, variant: eastmoney}
    operation: stock_us_hist
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: qfq, variant: eastmoney}
    operation: stock_us_hist
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: hfq, variant: eastmoney}
    operation: stock_us_hist
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: none, variant: eastmoney}
    operation: stock_us_hist
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: qfq, variant: eastmoney}
    operation: stock_us_hist
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: hfq, variant: eastmoney}
    operation: stock_us_hist

  # 期货 · 新浪：futures_zh_daily_sina(symbol)，无日期参数，由适配器内存过滤
  - match: {data_type: bars, market: CN, asset_type: contract, interval: P1D, adjust: none, variant: sina}
    operation: futures_zh_daily_sina
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: P1D, adjust: none, variant: sina}
    operation: futures_zh_daily_sina
