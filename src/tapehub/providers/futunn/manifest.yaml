    markets: [HK]
    asset_types: [etf]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: 2015-04-01T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2015-04-01T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2015-04-01T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2015-04-01T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2015-04-01T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 1999-11-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1999-11-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1999-11-01T00:00:00+08:00, end: null}}
