# 富途 OpenAPI（futunn）适配器：能力声明与内部操作映射。
# 接口签名已按官方文档核实（2026-11-14 接入，HTTP 直连版 Base URL
# https://webapi.futunn.com，纯 REST 无 FutuOpenD 网关、无官方 Python SDK）：
#   https://open.futunn.com/zh-cn/api/overview/getting-started
#   https://open.futunn.com/zh-cn/api/overview/api-authority
#   https://open.futunn.com/zh-cn/api/overview/rate-limit
#   https://open.futunn.com/zh-cn/api/quote/realtime/stock-quote
#   https://open.futunn.com/zh-cn/api/quote/basic-data/history-kline
#
# 说明：
# - futunn 无官方 Python SDK：REST 用 httpx（同步客户端，可选依赖）直连，
#   认证采用「方式二：传统 API Key」——控制台 AppKey 管理创建 AppKey 并上传
#   公钥（Ed25519 或 RSA-SHA256/PKCS#1 v1.5），本地私钥对签名原文
#   （timestamp_ms\nMETHOD\nrequest_path\nquery_string\nbody_sha256）签名，
#   经 X-Api-Key / Authorization（无 Bearer）/ X-Timestamp / X-Nonce 请求头
#   注入（私钥只经环境变量路径注入，绝不写入代码/manifest/日志）；
# - 统一信封：业务结果（含错误）HTTP 200，经 ret_code 字段表达（0 成功）：
#   -11 rate_limited → UPSTREAM_RATE_LIMITED（可能带 Retry-After），其余
#   非 0（-3 invalid_parameter / -7 invalid_symbol / -8 unsupported /
#   -12 history_quota_exceeded / -13 quota_unavailable / -12006 鉴权失败等）
#   → UPSTREAM_ERROR 携 upstream_code/upstream_message；HTTP >=400 与 JSON
#   解析失败为防御性 UPSTREAM_ERROR（携 status_code）；
# - 接入范围（用户拍板 2026-11-14，只接入以下组合）：CN stock（SSE/SZSE/
#   BSE——上游文档明示 SH/SZ/BJ 前缀支持正股/指数）/ index / etf（SSE/SZSE，
#   BJ 无 ETF）、HK stock（正股，窝轮/牛熊证不接入）、US stock（OTC 不支持，
#   上游不支持获取）；exchange 白名单在 request_mapper 强制（还原表只收
#   文档实证条目，越界明确拒绝）；
# - 行情权限（api-authority 页）：A 股境内认证客户免费 LV1（国际客户暂
#   不支持）、港股股票境内认证客户免费 LV2、美股股票推广期免费 LV3——
#   未开通对应市场权限时上游返回 invalid_symbol/quota 类错误，原样上抛；
# - 限频与额度（rate-limit 页）：IP 入口层行情类 100 次/分钟；业务限流走
#   HTTP 200 + ret_code=-11；**历史 K 线独立额度池：每标的首次成功返回非空
#   即占用一个额度（默认 7×24 小时后释放，重复读取不延期）**——分页续读
#   必须用 page_token（免计「首请求」；next_time 分页仍计入）；
# - 周期面（ktype 文档明示 1/3/5/10/15/30/60/120/180/240 分与日/周/月/季/
#   年，本适配器取 8 个核心周期）：PT1M→1、PT5M→6、PT15M→7、PT30M→8、
#   PT1H→9（60 分）、P1D→2、P1W→3、P1M→4；PT3M/PT2H/PT4H 等低频周期
#   不声明（探针后再议）；**各周期历史覆盖（最早可取）文档未标注，且
#   探针回填受历史额度池约束（每标的占用 7×24h），history 全部保持
#   null 未核实状态，回填待单独立项**；
# - 复权面（autype 0/1/2 文档明示）：stock [none, qfq, hfq] 直映；
#   index [none]（指数无复权语义，与 ths 惯例一致）；etf [none]——autype
#   对 ETF 是否生效未实证，探针后回填；
# - 分页与边界：请求 start/end 为标的市场时区日期（CN=Asia/Shanghai、
#   HK=Asia/Hong_Kong、US=America/New_York），分钟 K 线 end 以该日 00:00
#   为截止、不含当日（查闭区间需 end 日期 +1 天，request_mapper 处理），
#   日/周/月 K 线 end 含当日；闭区间 [start, end] 复核在适配器完成；
# - 单查询行数上限（2026-11-14 探针实证，报告 20261114T111229+0800，
#   文档失真）：请求 num=370 被上游忽略、实测单查询恒返回窗口起点起
#   ≈1000 行、pagination.has_more 恒 False 且无 next_page_token——
#   page_token 分页实际不可用（适配器分页循环与 _MAX_PAGES=15 保留为
#   防御）；分钟族窗口 >≈1000 根时静默截断、partial 无法可靠判定
#   （恒 false，人工裁决 2026-11-14：README 如实说明 + partial 维持，
#   ths 先例），分钟族建议窄窗口使用；
# - 返回行 time_key 为毫秒 Unix 时间戳（绝对时刻），volume 已按
#   volume_precision 放大 10^n 倍需自行还原（response_mapper 处理，
#   股票一般 n=0）；排序方向文档未明示，统一由分页组件升序归一；
# - 快照为纯 REST 单次调用语义（POST /api/v1.0/quote/stock-quote，
#   code_list 单次最多 400，本网关单标的传 1 个）：无首包超时/
#   QUOTE_NOT_READY（与 ths/alphafeed/tickflow 一致），无盘口五档
#   （bid/ask 恒 null）；WS 行情推送专区（wss://webapi-quote.futunn.com/ws）
#   本期不接入——第一版不做流式（用户拍板 2026-11-14），流式请求返回
#   UNSUPPORTED_CAPABILITY；
# - 单体系 Provider：变体与 default_variant 均为 futunn（数据源即上游
#   服务自身）；缺省请求经 provider_routing.yaml 回退链裁决（AppKey 凭据
#   API，置于各组合回退位末位），也可显式传 variant=futunn。
provider: futunn
default_variant: futunn

capabilities:
  # —— 历史 K 线（8 核心周期，history 全 null 未核实）——
  # A 股个股：唯一有复权语义的 CN 资产类型（autype 0/1/2 直映）
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: null, end: null}}
      - {code: PT5M, history: {start: null, end: null}}
      - {code: PT15M, history: {start: null, end: null}}
      - {code: PT30M, history: {start: null, end: null}}
      - {code: PT1H, history: {start: null, end: null}}
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 指数（沪深北交易所标准指数）：无复权语义
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: null, end: null}}
      - {code: PT5M, history: {start: null, end: null}}
      - {code: PT15M, history: {start: null, end: null}}
      - {code: PT30M, history: {start: null, end: null}}
      - {code: PT1H, history: {start: null, end: null}}
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 场内基金（仅 ETF；autype 对 ETF 是否生效未实证，先声明 none）
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: null, end: null}}
      - {code: PT5M, history: {start: null, end: null}}
      - {code: PT15M, history: {start: null, end: null}}
      - {code: PT30M, history: {start: null, end: null}}
      - {code: PT1H, history: {start: null, end: null}}
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 港股个股（正股；境内认证客户免费 LV2）
  - data_type: bars
    markets: [HK]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: null, end: null}}
      - {code: PT5M, history: {start: null, end: null}}
      - {code: PT15M, history: {start: null, end: null}}
      - {code: PT30M, history: {start: null, end: null}}
      - {code: PT1H, history: {start: null, end: null}}
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 美股个股（推广期免费 LV3；OTC 不支持，exchange 白名单拒绝）
  - data_type: bars
    markets: [US]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: null, end: null}}
      - {code: PT5M, history: {start: null, end: null}}
      - {code: PT15M, history: {start: null, end: null}}
      - {code: PT30M, history: {start: null, end: null}}
      - {code: PT1H, history: {start: null, end: null}}
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # —— 实时快照（REST 单次调用语义，无首包超时/QUOTE_NOT_READY）——
  # 五个组合共用同一 POST 端点（code_list 单标的传 1 个）；无盘口五档
  - data_type: quotes
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]
  - data_type: quotes
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [futunn]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]
  - data_type: quotes
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [futunn]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]
  - data_type: quotes
    markets: [HK]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]
  - data_type: quotes
    markets: [US]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]

