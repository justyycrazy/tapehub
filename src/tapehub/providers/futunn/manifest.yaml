# 富途 OpenAPI（futunn）能力声明与内部操作映射。
# 映射细则、上游行为定案与历史覆盖依据：docs/providers/futunn.md（唯一出处，本文不复述）。
# 官方文档：
#   https://open.futunn.com/zh-cn/api/overview/getting-started
#   https://open.futunn.com/zh-cn/api/overview/api-authority
#   https://open.futunn.com/zh-cn/api/overview/rate-limit
#   https://open.futunn.com/zh-cn/api/quote/realtime/stock-quote
#   https://open.futunn.com/zh-cn/api/quote/basic-data/history-kline
# 探针运行记录：probes/results/PROBE_LOG.md（本地文件，不入库）。
provider: futunn
default_variant: futunn

capabilities:
  # —— 历史 K 线（8 核心周期）——
  # A 股个股：唯一有复权语义的 CN 资产类型（autype 0/1/2 直映）
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: 2014-01-21T09:45:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2014-01-21T09:45:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2014-01-21T09:45:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2014-01-21T09:45:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2014-01-21T09:45:00+08:00, end: null}}
      - {code: P1D, history: {start: 1990-12-19T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1990-12-19T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1990-12-19T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 指数（沪深北交易所标准指数）：无复权语义
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: 2015-05-15T23:37:30+08:00, end: null}}
      - {code: PT5M, history: {start: 2015-05-15T23:37:30+08:00, end: null}}
      - {code: PT15M, history: {start: 2015-05-15T23:37:30+08:00, end: null}}
      - {code: PT30M, history: {start: 2015-05-15T23:37:30+08:00, end: null}}
      - {code: PT1H, history: {start: 2015-05-15T23:37:30+08:00, end: null}}
      - {code: P1D, history: {start: 1991-01-18T16:52:30+08:00, end: null}}
      - {code: P1W, history: {start: 1991-01-18T16:52:30+08:00, end: null}}
      - {code: P1M, history: {start: 1991-01-18T16:52:30+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 场内基金（仅 ETF）：autype 三值复权生效
