# 富途 OpenAPI（futunn）能力声明与内部操作映射。
# 映射细则、上游行为定案与历史覆盖依据：docs/providers/futunn.md（唯一出处，本文不复述）。
# 官方文档：
#   https://open.futunn.com/zh-cn/api/overview/getting-started
#   https://open.futunn.com/zh-cn/api/overview/api-authority
#   https://open.futunn.com/zh-cn/api/overview/rate-limit
#   https://open.futunn.com/zh-cn/api/quote/realtime/stock-quote
#   https://open.futunn.com/zh-cn/api/quote/basic-data/history-kline
provider: futunn
default_variant: futunn

capabilities:
  # —— 历史 K 线（8 核心周期）——
  # A 股个股：唯一有复权语义的 CN 资产类型（autype 0/1/2 直映）。
  # D/W/M 逐周期实测键位回填（探针 2026-11-17 第 1 轮：上游日线库缺
  # 1990 年 12 月——[1990-12] 月窗 count=0、P1D 首根 1991-01-02；P1W
  # 首根键位 1990-12-31 跨周根、P1M 首根键位 1991-01-01 自然月首日，
  # 见 docs time_key 口径）
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: 2014-01-01T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2014-01-01T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2014-01-01T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2014-01-01T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2014-01-01T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 指数（沪深北交易所标准指数）：无复权语义。
  # D/W/M 开业日锚回填（探针 2026-11-17 第 1 轮：P1D 首根 1990-12-19
  # 精确吻合——「与 CN stock 同库界」旧假设被推翻，index 库深于 stock
  # 日线库）；分钟族 est 上界维持（实测首根 2015-04-01，相容）
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: 2015-05-01T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2015-05-01T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2015-05-01T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2015-05-01T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2015-05-01T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 1990-12-19T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1990-12-19T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1990-12-19T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 场内基金（仅 ETF）：autype 三值复权生效。
  # D/W/M 上市日锚换基准随探针目标更新（探针 2026-11-17 第 1 轮 depth
  # 复探：510050 P1D 首根 2005-02-23 上市日精确吻合，替代旧锚 510300
  # →2012-05-28）；分钟族 est 上界维持（实测首根 2015-05-20，相容）
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: 2015-07-01T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2015-07-01T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2015-07-01T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2015-07-01T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2015-07-01T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 2005-02-23T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2005-02-23T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2005-02-23T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 港股个股（正股）：分钟族 2010-09-01 回填（探针 2026-11-17 第 1 轮
  # 五周期干净互证收敛，era×3 bisect×7 complete——「碎片区不可定案」
  # 旧定案被推翻）；P1D 库底聚焦补测首根 1991-01-02（[1990-12] 月窗
  # count=0），est 上界 1991-01-18 相容维持
  - data_type: bars
    markets: [HK]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: 2010-09-01T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2010-09-01T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2010-09-01T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2010-09-01T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2010-09-01T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 港股 ETF：与 stock 共用统一端点（目录外诊断 2026-11-15 第 6/7 轮：
  # HK-HKEX-02800 P1D 三复权两两 246/246 根差异、W/M/分钟直测放行、快照
