      - {code: PT1H, history: {start: 2015-07-11T08:26:15+08:00, end: null}}
      - {code: P1D, history: {start: 2012-05-28T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2012-05-28T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2012-05-28T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 港股个股（正股）：分钟族 history.start 保持 null
  - data_type: bars
    markets: [HK]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: null, end: null}}
      - {code: PT5M, history: {start: null, end: null}}
      - {code: PT15M, history: {start: null, end: null}}
      - {code: PT30M, history: {start: null, end: null}}
      - {code: PT1H, history: {start: null, end: null}}
      - {code: P1D, history: {start: 1991-01-18T16:52:30+08:00, end: null}}
      - {code: P1W, history: {start: 1991-01-18T16:52:30+08:00, end: null}}
      - {code: P1M, history: {start: 1991-01-18T16:52:30+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

