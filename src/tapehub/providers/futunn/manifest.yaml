    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [futunn]
    intervals:
      - {code: PT1M, history: {start: 2015-07-11T08:26:15+08:00, end: null}}
      - {code: PT5M, history: {start: 2015-07-11T08:26:15+08:00, end: null}}
      - {code: PT15M, history: {start: 2015-07-11T08:26:15+08:00, end: null}}
