      - {code: P1M, history: {start: 1997-01-25T00:33:45+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # —— 实时快照 ——
  - data_type: quotes
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]
  - data_type: quotes
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [futunn]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]
