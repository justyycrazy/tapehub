    asset_types: [etf]
    delivery: [rest]
    variants: [futunn]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]
  - data_type: quotes
    markets: [HK]
    asset_types: [stock]
    delivery: [rest]
    variants: [futunn]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]
