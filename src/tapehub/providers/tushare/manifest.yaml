# Tushare 适配器：能力声明与内部操作映射。
# 接口签名均已按官方文档核实：https://tushare.pro/document/2
#
# 说明：
# - 股票使用模块级函数 ts.pro_bar（asset='E'，freq D/W/M；文档注解 adj
#   「仅日线复权」偏保守，探针实证周/月线复权真实生效，报告
#   20261112T110412+0800）；
# - 期货单一合约使用 pro 对象方法 pro.fut_daily（无复权，单次上限 2000 条，
#   经主连 CUL.SHF 实测恰为 2000；上游截断为「保尾截头」——保留最新 2000 根，
#   partial=true 时缺窗口头部更早数据，探针报告 20261112T124404+0800）；
# - 股票 ts_code 后缀已按文档示例核实：000001.SH / 000001.SZ（SSE/SZSE）；
#   北交所 .BJ 为 tushare 通用约定但未在所引文档示例中出现，暂不声明；
# - 期货 ts_code 后缀五所接入（探针实证，报告 20261112T124404+0800）：
#   .SHF / .DCE / .INE / .CFX / .ZCE——其中 CZCE 在 tushare 为 4 位年月码
#   （SR2601），标准代码用交易所原生 3 位（CN-CZCE-SR601），由适配器转换
#   （SR601 → SR2601，10 年窗口唯一解析）；
# - 主力连续（continuous）：总览页连续合约格式 XX=主力 / XXL=主连，映射
#   **品种+L 主连**（CN-SHFE-CU → CUL.SHF / CN-CZCE-SR → SRL.ZCE /
#   CN-DCE-M → ML.DCE / CN-INE-SC → SCL.INE），CFFEX 例外直拼主力
#   （CN-CFFEX-IF → IF.CFX，该所 IFL/IFL1-3 为当月/次月/当季/下季月份
#   系列非主连）——五所连续代码探针实证（报告 20261112T133250+0800）；
#   不参与 CN contract/continuous 的 auto 路由（仅显式 provider=tushare，
#   见 provider_routing.yaml）；
# - 单位换算按文档：股票 vol 手→股（×100）、amount 千元→元（×1000）；
#   期货 vol 保持手、amount 万元→元（×10000）；
# - 历史覆盖范围（history）：stock 日/周/月经数据探针实测回填（报告
#   20261112T124404+0800，人工确认；二分估计粒度 90 天 approx，真值≈标的
#   上市日 1999-11-10 落在估算窗口内，与 akshare 个股二分口径同日互证）；
#   contract = CU2401 上市首日 2023-01-17（全量模式精确定值 approx=False）；
#   continuous 主连 ≈1991-01-01（二分下限触底，真实可能更早；报告
#   20261112T135507+0800，人工确认）；
# - 单接口体系 Provider：变体与 default_variant 均为 tushare（数据源即上游服务自身，与东方财富无关）：缺省请求即可路由，也可显式传 variant=tushare。
provider: tushare
default_variant: tushare

capabilities:
  # 股票：ts.pro_bar，日/周/月线，三种复权；history.start 探针实测回填
  #   （报告 20261112T124404+0800，人工确认；二分估计粒度 90 天 approx，
  #   三周期各自二分收敛、结果一致）
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 期货单一合约：pro.fut_daily，仅日线、无复权；start 为探针标的 CU2401
  #   上市首日实测（全量模式精确定值 approx=False，报告 20261112T135507+0800）
  #   ——capability 为 asset_type 级声明，各合约数据以自身上市日起、随摘牌止
  - data_type: bars
    markets: [CN]
    asset_types: [contract]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: 2023-01-17T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 期货主力连续：品种+L 主连（CN-SHFE-CU → CUL.SHF / CN-CZCE-SR →
  #   SRL.ZCE 等），CFFEX 直拼主力（CN-CFFEX-IF → IF.CFX）；仅日线、无复权；
  #   start 探针二分下限触底（1991-01-01，approx ±90 天、真实最早可能更早，
  #   主连拼接历史深于个股），capability 为 asset_type 级声明
  - data_type: bars
    markets: [CN]
    asset_types: [continuous]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

operations:
  # 股票：ts.pro_bar(ts_code, asset='E', freq, adj, start_date, end_date, api=pro)
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: qfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: hfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: qfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: hfq, variant: tushare}
    operation: pro_bar

  # 期货单一合约：pro.fut_daily(ts_code, start_date, end_date)
  - match: {data_type: bars, market: CN, asset_type: contract, interval: P1D, adjust: none, variant: tushare}
    operation: fut_daily

  # 期货主力连续：pro.fut_daily（品种+L 主连 / CFFEX 主力直拼）
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: P1D, adjust: none, variant: tushare}
    operation: fut_daily
