# Tushare（tushare）能力声明与内部操作映射。
# 映射细则、上游行为定案与历史覆盖依据：docs/providers/tushare.md（唯一出处，本文不复述）。
# 官方文档：https://tushare.pro/document/2
# 探针运行记录：probes/results/PROBE_LOG.md（本地文件，不入库）。
provider: tushare
default_variant: tushare

capabilities:
  # 股票：ts.pro_bar，日/周/月线，三种复权
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 期货单一合约：pro.fut_daily，仅日线、无复权
  - data_type: bars
    markets: [CN]
    asset_types: [contract]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: 2023-01-17T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 期货主力连续：品种+L 主连（CN-SHFE-CU → CUL.SHF / CN-CZCE-SR → SRL.ZCE 等），CFFEX 直拼主力（CN-CFFEX-IF → IF.CFX）；仅日线、无复权
  - data_type: bars
    markets: [CN]
    asset_types: [continuous]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

operations:
  # 股票：ts.pro_bar(ts_code, asset='E', freq, adj, start_date, end_date, api=pro)
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: qfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: hfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: qfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: hfq, variant: tushare}
    operation: pro_bar

  # 期货单一合约：pro.fut_daily(ts_code, start_date, end_date)
  - match: {data_type: bars, market: CN, asset_type: contract, interval: P1D, adjust: none, variant: tushare}
    operation: fut_daily

  # 期货主力连续：pro.fut_daily（品种+L 主连 / CFFEX 主力直拼）
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: P1D, adjust: none, variant: tushare}
    operation: fut_daily
