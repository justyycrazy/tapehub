# Tushare（tushare）能力声明与内部操作映射。
# 映射细则、上游行为定案与历史覆盖依据：docs/providers/tushare.md（唯一出处，本文不复述）。
# 官方文档：https://tushare.pro/document/2
# 探针运行记录：probes/results/PROBE_LOG.md（本地文件，不入库）。
provider: tushare
default_variant: tushare

capabilities:
  # 股票：ts.pro_bar，日/周/月线，三种复权
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1999-12-08T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 指数：ts.pro_bar（asset='I'，官方枚举 I=沪深指数），日/周/月三周期
  # （SDK 薄封装直传 index_daily/index_weekly/index_monthly），无复权
  # （官方 adj「只针对股票」，上游 asset='I' 分支忽略 adj）
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [tushare]
    intervals:
      # 三周期 history 均为实证下界声明（探针 2026-11-15 第 13/15 轮：P1D
      # 1991 全年 255 行 raw 直测；P1W/P1M chain 二分 era 回溯至 1991 触底
      # ——真实最早 bar ≈1991-01-18 与 baostock 互证，chain history_depth
      # 常态复验）
      - {code: P1D, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # ETF：pro.fund_daily（doc_id=127「ETF 日线」，亦含 LOF），仅日线
  # （SDK FD 分支仅处理 D/min + ETF 专题无周/月线接口，源码定案）、
  # 无复权（pro_bar FD 分支无 adj 处理，fund_adj 因子需自算不在范围）
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [tushare]
    intervals:
      # P1D：2005-02-23 为实证下界声明（510050.SH 上市日，2005 全年 213 行；
      # 官方口径 fund_daily 起始 2000-01-03——LOF/封闭式基金更早，未实证）
      - {code: P1D, history: {start: 2005-02-23T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 期权单一合约（asset_type 三分：commodity-option / index-option /
  # etf-option，2026-11-16 聚焦轮八所探针实证收编，八所归属见 docs/api.md
  # 「asset_type 资产类型体系」，三子类能力同构故声明同构拆块）：
  # pro.opt_daily（doc_id=159），仅日线、无复权；八所后缀实证（SSE/SZSE/
  # CFFEX/DCE/SHFE/CZCE + INE/GFEX——文档枚举未列 INE/GFEX 属文档滞后）；
  # 库级历史起点未核实（合约级数据随上市起、随摘牌止）
  - data_type: bars
    markets: [CN]
    asset_types: [commodity-option]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]
  - data_type: bars
    markets: [CN]
    asset_types: [index-option]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]
  - data_type: bars
    markets: [CN]
    asset_types: [etf-option]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 期货单一合约：pro.fut_daily，仅日线、无复权
  - data_type: bars
    markets: [CN]
    asset_types: [contract]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: 2023-01-17T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 期货主力连续：品种+L 主连（CN-SHFE-CU → CUL.SHF / CN-CZCE-SR → SRL.ZCE 等），CFFEX 直拼主力（CN-CFFEX-IF → IF.CFX）；仅日线、无复权
  - data_type: bars
    markets: [CN]
    asset_types: [continuous]
    delivery: [rest]
    variants: [tushare]
    intervals:
      - {code: P1D, history: {start: 1991-01-01T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

operations:
  # 股票：ts.pro_bar(ts_code, asset='E', freq, adj, start_date, end_date, api=pro)
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: qfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: hfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: qfq, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: hfq, variant: tushare}
    operation: pro_bar

  # 期货单一合约：pro.fut_daily(ts_code, start_date, end_date)
  - match: {data_type: bars, market: CN, asset_type: contract, interval: P1D, adjust: none, variant: tushare}
    operation: fut_daily

  # 期货主力连续：pro.fut_daily（品种+L 主连 / CFFEX 主力直拼）
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: P1D, adjust: none, variant: tushare}
    operation: fut_daily

  # 指数：ts.pro_bar(asset='I')，三周期 × 仅 none（指数无复权）
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1D, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1W, adjust: none, variant: tushare}
    operation: pro_bar
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1M, adjust: none, variant: tushare}
    operation: pro_bar

  # ETF：pro.fund_daily（仅日线 × 仅 none）
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: none, variant: tushare}
    operation: fund_daily

  # 期权单一合约（asset_type 三分后按子类显式枚举）：pro.opt_daily（仅日线 × 仅 none）
  - match: {data_type: bars, market: CN, asset_type: commodity-option, interval: P1D, adjust: none, variant: tushare}
    operation: opt_daily
  - match: {data_type: bars, market: CN, asset_type: index-option, interval: P1D, adjust: none, variant: tushare}
    operation: opt_daily
  - match: {data_type: bars, market: CN, asset_type: etf-option, interval: P1D, adjust: none, variant: tushare}
    operation: opt_daily
