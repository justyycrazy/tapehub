# 同花顺金融数据 API（ths）适配器：能力声明与内部操作映射。
# 接口签名已按官方文档核实（2026-11-13 接入，Base URL https://fuyao.aicubes.cn）：
#   https://fuyao.aicubes.cn/docs/api-reference/overview/
#   https://fuyao.aicubes.cn/docs/api-reference/prices/
#   https://fuyao.aicubes.cn/docs/api-reference/a-share-index/
#   https://fuyao.aicubes.cn/docs/api-reference/fund-market/
#   https://fuyao.aicubes.cn/docs/api-reference/futures-prices/
#   https://fuyao.aicubes.cn/docs/api-reference/options-prices/
#
# 说明：
# - ths 无官方 Python SDK：REST 用 httpx（同步客户端，可选依赖）直连，
#   认证经 X-api-key 请求头（key 不落 URL，绝不写入代码/manifest/日志）；
# - 统一 ApiResponse 信封：业务结果（含错误）HTTP 恒 200，经 code 字段表达
#   （0 成功；4001 频率超限 → UPSTREAM_RATE_LIMITED，其余非 0 → UPSTREAM_ERROR
#   携 upstream_code/upstream_message）；时间戳统一毫秒 Unix、Asia/Shanghai；
# - 上游能力边界（端外，文档明示）：历史 K 线仅日线 1d；A 股/指数窗口 ≤10 年、
#   ETF ≤5 自然年；期货/期权日 K 端外仅 time_period=day_1（显式传参）；同花顺
#   板块/行业指数（88xxxx.TI）与商品指数（850002.TI）属同花顺特有 TI 类指数，
#   本期不纳入（用户拍板 2026-11-13）；
# - **期货/期权实时快照取分时末点**（/api/futures|options/prices/intraday，
#   session=intraday、trade_date=0 显式传参）：last_price=末点 price、
#   timestamp=末点时间（端外仅当前交易日；非交易日/盘前 item=[] 报
#   UPSTREAM_ERROR）。**volume/amount 不透出**——分时点量额口径（逐分钟增量
#   vs 当日累计）上游未明示，汇总或透传都可能语义错误，fields 仅声明
#   timestamp + last_price（探针核实口径后回填，见 probes/cases/ths.yaml）；
# - 单位：A 股快照/历史 K 线 volume=股、turnover=元（官方文档明示）；
#   ETF/期货/期权 volume/turnover 单位上游未明示，原值透出（不编造换算）；
# - 标的代码映射（只收文档实证条目，其余 exchange 明确拒绝，探针后回填）：
#   stock/index/etf {SSE→SH, SZSE→SZ}（BSE→BJ 仅元信息域实证、价格端点未
#   实证，不收）；contract {SHFE→SHF}（CU2601.SHF 示例）；option {CFFEX→CFE}
#   （IO2601-C-4000.CFE 示例）；contract/option symbol 段原样透传
#   （CN-CFFEX-IO2601-C-4000 → IO2601-C-4000.CFE）；
# - adjust 映射（仅 A 股历史 K 线有复权语义）：none→none、qfq→forward
#   （前复权）、hfq→backward（后复权）；指数/ETF/期货/期权无复权，仅声明 none
#   （指数响应 data.adjust 固定 null）；
# - 单次返回行数上限：官方文档未标注（A 股/指数窗口 ≤10 年、ETF ≤5 年为窗口
#   上限而非行数上限；historical 有 offset 分页参数但行为未核实，不启用），
#   partial 恒 false，隐式截断行为待探针核实；
# - 历史覆盖（history.start/end）全部保持 null（文档未公布，回填需探针实证
#   + 人工确认后单独提交）；
# - 单体系 Provider：变体与 default_variant 均为 ths（数据源即上游服务自身）；
#   缺省请求经 provider_routing.yaml 回退链裁决（ths 为付费凭据 API，置于
#   各组合回退位末位），也可显式传 variant=ths。
provider: ths
default_variant: ths

capabilities:
  # —— 历史 K 线（日线）——
  # A 股个股：唯一有复权语义的资产类型（none/forward/backward 直映）
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [ths]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 指数（沪深交易所标准指数）：无复权语义（响应 data.adjust 固定 null）
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [ths]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 场内基金（仅 ETF；LOF/场外/REITs 返回 code=3004）：无复权语义
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [ths]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 期货合约（端外仅日 K、time_period=day_1；仅 SHFE 后缀文档实证）
  - data_type: bars
    markets: [CN]
    asset_types: [contract]
    delivery: [rest]
    variants: [ths]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # 期权合约（端外仅日 K、time_period=day_1；仅 CFFEX 后缀文档实证）
  - data_type: bars
    markets: [CN]
    asset_types: [option]
    delivery: [rest]
    variants: [ths]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # —— 实时快照（REST 单次调用语义，无首包超时/QUOTE_NOT_READY）——
  # A 股个股：OHLC/涨跌/前收经 extensions 白名单透出
  - data_type: quotes
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [ths]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]

  # 指数快照：字段结构与 A 股快照一致（文档明示）
  - data_type: quotes
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [ths]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]

  # ETF 快照：多振幅/换手率（extensions 白名单）
  - data_type: quotes
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [ths]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]

  # 期货/期权快照：分时端点取末点作 last_price（口径见头注释）；
  # 量额口径未核实，fields 收窄至 timestamp + last_price
  - data_type: quotes
    markets: [CN]
    asset_types: [contract]
    delivery: [rest]
    variants: [ths]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price]
  - data_type: quotes
    markets: [CN]
    asset_types: [option]
    delivery: [rest]
    variants: [ths]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price]

operations:
  # —— 历史 K 线：显式枚举全部声明组合 ——
  # A 股个股历史 K 线（三复权 → 同一端点 GET /api/a-share/prices/historical）
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: ths}
    operation: a_share_historical
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: ths}
    operation: a_share_historical
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: ths}
    operation: a_share_historical
  # 指数历史 K 线（GET /api/a-share-index/prices/historical）
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1D, adjust: none, variant: ths}
    operation: index_historical
  # ETF 历史日线（GET /api/fund/market/historical）
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: none, variant: ths}
    operation: fund_historical
  # 期货日 K（GET /api/futures/prices/daily）
  - match: {data_type: bars, market: CN, asset_type: contract, interval: P1D, adjust: none, variant: ths}
    operation: futures_daily
  # 期权日 K（GET /api/options/prices/daily）
  - match: {data_type: bars, market: CN, asset_type: option, interval: P1D, adjust: none, variant: ths}
    operation: options_daily

  # —— 实时快照：周期/复权对快照无意义，match 显式 null ——
  # A 股 / 指数 / ETF 快照（GET /api/a-share|a-share-index|fund/market*/snapshot）
  - match: {data_type: quotes, market: CN, asset_type: stock, interval: null, adjust: null, variant: ths}
    operation: a_share_snapshot
  - match: {data_type: quotes, market: CN, asset_type: index, interval: null, adjust: null, variant: ths}
    operation: index_snapshot
  - match: {data_type: quotes, market: CN, asset_type: etf, interval: null, adjust: null, variant: ths}
    operation: fund_snapshot
  # 期货/期权快照：分时端点（/api/futures|options/prices/intraday）取末点
  - match: {data_type: quotes, market: CN, asset_type: contract, interval: null, adjust: null, variant: ths}
    operation: futures_snapshot
  - match: {data_type: quotes, market: CN, asset_type: option, interval: null, adjust: null, variant: ths}
    operation: options_snapshot
