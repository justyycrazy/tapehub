# BaoStock（baostock）能力声明与内部操作映射。
# 映射细则、上游行为定案与历史覆盖依据：docs/providers/baostock.md（唯一出处，本文不复述）。
# 官方文档：https://baostock.com/mainContent?file=pythonAPI.md
provider: baostock
default_variant:
  stock: baostock
  index: baostock
  etf: baostock

capabilities:
  # 个股（A 股）：日/周/月 + 分钟族，支持不复权/前复权/后复权
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [baostock]
    intervals:
      - {code: P1D, history: {start: 1991-01-18T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1991-01-18T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1991-01-18T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2020-01-02T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2020-01-02T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2020-01-02T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2020-01-02T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 指数：仅日/周/月（无分钟线），复权 no-op 仅声明 none
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [baostock]
    intervals:
      - {code: P1D, history: {start: 1991-01-18T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1991-01-18T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1991-01-18T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]

  # ETF：日/周/月 + 分钟族
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [baostock]
    intervals:
      - {code: P1D, history: {start: 2005-02-23T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2005-02-23T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2005-02-23T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2026-01-05T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2026-01-05T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2026-01-05T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2026-01-05T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

operations:
  # 个股：7 周期 × 3 复权，全部指向 query_history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: baostock}
    operation: history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: baostock}
    operation: history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: baostock}
    operation: history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: none, variant: baostock}
    operation: history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: qfq, variant: baostock}
    operation: history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: hfq, variant: baostock}
    operation: history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: none, variant: baostock}
    operation: history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: qfq, variant: baostock}
    operation: history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: hfq, variant: baostock}
