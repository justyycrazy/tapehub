  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT15M, adjust: none, variant: baostock}
    operation: history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT15M, adjust: qfq, variant: baostock}
    operation: history_k_data_plus
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT15M, adjust: hfq, variant: baostock}
