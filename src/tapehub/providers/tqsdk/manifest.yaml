# TqSdk（tqsdk）能力声明与内部操作映射。
# 映射细则、上游行为定案与历史覆盖依据：docs/providers/tqsdk.md（唯一出处，本文不复述）。
# 官方文档：
#   https://doc.shinnytech.com/tqsdk/latest/usage/mddatas.html
#   https://doc.shinnytech.com/tqsdk/latest/reference/tqsdk.api.html
provider: tqsdk
default_variant: tqsdk

capabilities:
  # 期货三类拆分声明：history 逐类回填（contract 随挂牌期限不声明固定起点）
  - data_type: bars
    markets: [CN]
    asset_types: [contract]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {start: null, end: null}}
      - {code: PT5M, history: {start: null, end: null}}
      - {code: PT15M, history: {start: null, end: null}}
      - {code: PT30M, history: {start: null, end: null}}
      - {code: PT1H, history: {start: null, end: null}}
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  - data_type: bars
    markets: [CN]
    asset_types: [continuous]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {retention_days: 14, end: null}}
      - {code: PT5M, history: {retention_days: 84, end: null}}
      - {code: PT15M, history: {retention_days: 240, end: null}}
      - {code: PT30M, history: {retention_days: 450, end: null}}
      - {code: PT1H, history: {retention_days: 840, end: null}}
      - {code: P1D, history: {start: "2016-01-01T00:00:00+08:00", end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  - data_type: bars
    markets: [CN]
    asset_types: [weighted-index]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {retention_days: 14, end: null}}
      - {code: PT5M, history: {retention_days: 70, end: null}}
      - {code: PT15M, history: {retention_days: 180, end: null}}
      - {code: PT30M, history: {retention_days: 390, end: null}}
      - {code: PT1H, history: {retention_days: 690, end: null}}
      - {code: P1D, history: {start: "2016-01-01T00:00:00+08:00", end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  # 股票分钟族（≤PT15M）：adj_type 复权为 no-op，仅声明 none
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {retention_days: 28, end: null}}
      - {code: PT5M, history: {retention_days: 150, end: null}}
      - {code: PT15M, history: {retention_days: 450, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  # 股票 PT30M/PT1H/P1D：adj_type 复权真实生效，三值声明
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT30M, history: {retention_days: 930, end: null}}
      - {code: PT1H, history: {retention_days: 1500, end: null}}
      - {code: P1D, history: {start: "2018-01-01T00:00:00+08:00", end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume]
  # 指数：adj_type 对指数无效，仅声明 none
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {retention_days: 28, end: null}}
      - {code: PT5M, history: {retention_days: 150, end: null}}
      - {code: PT15M, history: {retention_days: 450, end: null}}
      - {code: PT30M, history: {retention_days: 930, end: null}}
      - {code: PT1H, history: {retention_days: 1500, end: null}}
      - {code: P1D, history: {start: "2018-01-01T00:00:00+08:00", end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  # ETF 分钟族（≤PT15M）：adj_type 复权为 no-op，仅声明 none
  # ETF PT30M/PT1H/P1D：复权真实生效，三值声明
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {retention_days: 28, end: null}}
      - {code: PT5M, history: {retention_days: 150, end: null}}
      - {code: PT15M, history: {retention_days: 450, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT30M, history: {retention_days: 930, end: null}}
      - {code: PT1H, history: {retention_days: 1500, end: null}}
      - {code: P1D, history: {start: "2018-01-01T00:00:00+08:00", end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume]
  # 期权合约（asset_type 三分：commodity-option / index-option / etf-option，
  # 2026-11-16 聚焦轮八所码式+K 线探针实证收编；八所归属见 docs/api.md
  # 「asset_type 资产类型体系」，三子类能力同构故声明同构拆块）：adj_type 对
  # 期权无效（官方文档口径仅股票/基金有效），仅声明 none；周期仅核实 P1D，
  # 其余周期未核实不声明；合约级数据随上市起、随摘牌止，history.start 保持 null
  - data_type: bars
    markets: [CN]
    asset_types: [commodity-option]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  - data_type: bars
    markets: [CN]
    asset_types: [index-option]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  - data_type: bars
    markets: [CN]
    asset_types: [etf-option]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  # 实时快照（M2）：订阅-推送模型，无周期/复权维度，两维度声明为空；
  # 期权快照 2026-11-16 聚焦轮实证收编（免费版账户即含期权实时行情口径），
  # asset_type 三分后三子类同构并入本块
  - data_type: quotes
    markets: [CN]
    asset_types: [contract, continuous, weighted-index, stock, index, etf, commodity-option, index-option, etf-option]
    delivery: [rest]
    variants: [tqsdk]
    intervals: []
    adjustments: []
    fields:
      - timestamp
      - last_price
      - bid_price1
      - bid_volume1
      - bid_price2
      - bid_volume2
      - bid_price3
      - bid_volume3
      - bid_price4
      - bid_volume4
      - bid_price5
      - bid_volume5
      - ask_price1
      - ask_volume1
      - ask_price2
      - ask_volume2
      - ask_price3
      - ask_volume3
      - ask_price4
      - ask_volume4
      - ask_price5
      - ask_volume5
      - volume
      - amount

operations:
  # 全部资产类型 × 周期组合都调用同一上游接口 api.get_kline_serial。
  - match: {data_type: bars, market: CN, asset_type: contract, interval: PT1M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: contract, interval: PT5M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: contract, interval: PT15M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: contract, interval: PT30M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: contract, interval: PT1H, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: contract, interval: P1D, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: PT1M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: PT5M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: PT15M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: PT30M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: PT1H, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: continuous, interval: P1D, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: weighted-index, interval: PT1M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: weighted-index, interval: PT5M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: weighted-index, interval: PT15M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: weighted-index, interval: PT30M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: weighted-index, interval: PT1H, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: weighted-index, interval: P1D, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT1M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT5M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT15M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT30M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT1H, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT30M, adjust: qfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT1H, adjust: qfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT30M, adjust: hfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: PT1H, adjust: hfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: PT1M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: PT5M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: PT15M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: PT30M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: PT1H, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: PT30M, adjust: qfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: PT1H, adjust: qfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: qfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: PT30M, adjust: hfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: PT1H, adjust: hfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: hfq, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: index, interval: PT1M, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: index, interval: PT5M, adjust: none, variant: tqsdk}
