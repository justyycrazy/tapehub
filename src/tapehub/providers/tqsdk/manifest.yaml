# TqSdk 适配器：能力声明与内部操作映射。
# 接口签名均已按官方文档核实：
# https://doc.shinnytech.com/tqsdk/latest/usage/mddatas.html
# https://doc.shinnytech.com/tqsdk/latest/reference/tqsdk.api.html
#
# 说明：
# - TqSdk 为官方 Python SDK：TqApi(auth=TqAuth(账户, 密码)) 鉴权必填（快期账户）；
# - 合约代码格式 交易所.合约（交易所全大写；标准 symbol 恒为大写 4 位年月，
#   交易所原生写法由适配器还原——SHFE 品种小写如 SHFE.cu2607、CZCE 合约
#   4→3 位年月码如 CZCE.RM701，均探针实证）；主力连续 KQ.m@<交易所>.<品种>；
#   指数连续（加权）KQ.i@<交易所>.<品种>；
# - get_kline_serial(symbol, duration_seconds, data_length, adj_type)：
#   周期为不超过 1 日的任意秒数（日线 86400）；data_length 默认 200；
#   单次上限 2026-11-03 探针实测 5000 根（PT1M/PT5M 同时恰好 5000，
#   文档 8000/10000 口径未复现，疑受当前套餐限制）；达到上限时标记 partial=true；
#   adj_type 仅对股票/基金有效（F=前复权、B=后复权、None=不复权），
#   期货/指数无复权概念，始终传 None；复权实证（2026-11-03 探针）：
#   hfq 与 none 差异显著（生效）；分钟级 qfq 与 none 相同（天勤特性，如实标注）；
# - 返回列 id/datetime/open/high/low/close/volume/open_oi/close_oi：
#   datetime 为纳秒时间戳；无成交额字段，标准 amount 恒为 null；
#   持仓量 open_oi/close_oi 进入受控 extensions：期货为真实持仓，
#   股票/指数/ETF 列存在但恒为 0（如实透出 0.0，不用 null 冒充）；
#   期货 volume 保持手；股票/ETF 的 volume 单位文档未写明，
#   2026-11-03 探针量级对照判定为股（600000 日 volume 约 5×10^7）；
# - 权限说明（usage/mddatas 原文 + 2026-11-04 探针）：数据可见性由**天勤平台
#   账户档位**决定（免费版/专业版），与 SDK 及其版本无关。免费版账户仅
#   期货/期权与四大指数实时，专业版账户含 A股股票/ETF 实时与历史。
#   当前部署账户为**专业版**（2026-11-04 用户确认）：股票/ETF 实时五档
#   （600000/510050 盘中实测）、股票/指数/ETF 历史日线实测可用。
#   能力目录只声明结构性能力（SDK 能做什么）；账户权限不足是运行期事实，
#   请求失败包装为 UPSTREAM_ERROR，不作为能力缺口声明；
# - 每次请求独立创建并关闭 TqApi 实例（在线程池中执行，一个线程一个实例）；
# - 实时快照（get_quote，M2）：订阅-推送模型（await get_quote 至首包 +
#   wait_update 驱动 is_changing 增量），字段白名单以 P5 探针实证为准
#   （2026-11-04，probes/results/tqsdk/20261104T012958Z）：期货/主连/加权/
#   股票/ETF/指数订阅均成功；指数与加权指数无盘口（bid/ask 价格 NaN →
#   null 如实透出，量侧为 0）；股票/ETF 实时五档需专业版账户（运行期事实，
#   不作为能力缺口声明）。快照无周期/复权维度，intervals/adjustments 为空、
#   operations match 对无意义维度显式 null；
# - 上游返回“从最新一根往回”的序列：当返回数量达到上限且最早一根仍晚于
#   请求 start 时，无法覆盖请求窗口，标记 partial=true；
# - 历史覆盖范围（history，2026-11-03 探针：日线二分估计，次轮粒度 5 天）：
#   日线 continuous/weighted-index 自 2016-01-05、stock/index/etf 自 2018-01-02
#   （数据自该时点起大体连续）；分钟级为**滚动保留**（按数据类划分：
#   现货三类一致、期货两类一致），以 retention_days 声明——覆盖
#   「now − N 天 → now」，边界随时间前移，不声明固定起点；
#   取整规则（向下取，留安全余量）：不足 90 天取 7 的倍数（周），
#   不小于 90 天取 30 的倍数（月）；六周期折算根数均落在 5000 根量级，
#   与单次上限（data_length 5000）一致——保留深度即序列存储上限；
#   PT30M/PT1H 于 2026-11-03 第三轮探针补测；contract 随挂牌期限，全 null 不编造；
# - 单接口 Provider：变体与 default_variant 均为 tqsdk（官方 SDK 包名，
#   背后为天勤 TianQin 行情平台，与东方财富无关）：缺省请求即可路由，
#   也可显式传 variant=tqsdk。
provider: tqsdk
default_variant: tqsdk

capabilities:
  # 期货三类拆分声明：history 逐类回填（contract 随挂牌期限不声明固定起点）
  - data_type: bars
    markets: [CN]
    asset_types: [contract]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {start: null, end: null}}
      - {code: PT5M, history: {start: null, end: null}}
      - {code: PT15M, history: {start: null, end: null}}
      - {code: PT30M, history: {start: null, end: null}}
      - {code: PT1H, history: {start: null, end: null}}
      - {code: P1D, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  - data_type: bars
    markets: [CN]
    asset_types: [continuous]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {retention_days: 14, end: null}}
      - {code: PT5M, history: {retention_days: 84, end: null}}
      - {code: PT15M, history: {retention_days: 240, end: null}}
      - {code: PT30M, history: {retention_days: 450, end: null}}
      - {code: PT1H, history: {retention_days: 840, end: null}}
      # 探针 limit case 实测最早一根（cu 主连日线，北京时间 2016-01-05）
      - {code: P1D, history: {start: "2016-01-05T00:00:00+08:00", end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  - data_type: bars
    markets: [CN]
    asset_types: [weighted-index]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {retention_days: 7, end: null}}
      - {code: PT5M, history: {retention_days: 70, end: null}}
      - {code: PT15M, history: {retention_days: 180, end: null}}
      - {code: PT30M, history: {retention_days: 390, end: null}}
      - {code: PT1H, history: {retention_days: 690, end: null}}
      # 探针二分估计（2026-11-03 第二轮，粒度 5 天）：au 加权日线最早 ≈2016-01-05（北京时间）
      - {code: P1D, history: {start: "2016-01-05T00:00:00+08:00", end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  # 股票：adj_type 支持 F/B（API 参考，hfq 生效已实证）；实时与历史行情需专业版权限
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {retention_days: 35, end: null}}
      - {code: PT5M, history: {retention_days: 150, end: null}}
      - {code: PT15M, history: {retention_days: 450, end: null}}
      - {code: PT30M, history: {retention_days: 930, end: null}}
      - {code: PT1H, history: {retention_days: 1500, end: null}}
      # 探针二分估计（粒度 90 天）：600000 日线最早 ≈2018-01-02
      - {code: P1D, history: {start: "2018-01-02T00:00:00+08:00", end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume]
  # 指数：adj_type 对指数无效，仅 none；免费版仅四大指数（上证50/沪深300/
  # 中证500/中证1000）实时，历史权限未核实
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {retention_days: 35, end: null}}
      - {code: PT5M, history: {retention_days: 150, end: null}}
      - {code: PT15M, history: {retention_days: 450, end: null}}
      - {code: PT30M, history: {retention_days: 930, end: null}}
      - {code: PT1H, history: {retention_days: 1500, end: null}}
      # 探针二分估计（粒度 90 天）：000016 日线最早 ≈2018-01-02
      - {code: P1D, history: {start: "2018-01-02T00:00:00+08:00", end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume]
  # ETF：属基金大类，adj_type 有效（F/B）；权限口径未核实，探针实证
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [tqsdk]
    intervals:
      - {code: PT1M, history: {retention_days: 35, end: null}}
      - {code: PT5M, history: {retention_days: 150, end: null}}
      - {code: PT15M, history: {retention_days: 450, end: null}}
      - {code: PT30M, history: {retention_days: 930, end: null}}
      - {code: PT1H, history: {retention_days: 1500, end: null}}
      # 探针二分估计（2026-11-03 第二轮，粒度 5 天）：510050 日线最早 ≈2018-01-02
      - {code: P1D, history: {start: "2018-01-02T00:00:00+08:00", end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume]
  # 实时快照（M2）：订阅-推送模型，无周期/复权维度（两维度声明为空，
  # 路由与能力匹配跳过）；字段白名单以 P5 探针实证为准（见文件头注释）
  - data_type: quotes
    markets: [CN]
    asset_types: [contract, continuous, weighted-index, stock, index, etf]
    delivery: [rest]
    variants: [tqsdk]
    intervals: []
    adjustments: []
    fields:
      - timestamp
      - last_price
      - bid_price1
      - bid_volume1
      - bid_price2
      - bid_volume2
      - bid_price3
      - bid_volume3
      - bid_price4
      - bid_volume4
      - bid_price5
      - bid_volume5
      - ask_price1
      - ask_volume1
      - ask_price2
      - ask_volume2
      - ask_price3
      - ask_volume3
      - ask_price4
      - ask_volume4
      - ask_price5
      - ask_volume5
      - volume
      - amount

