  # 接口，P1D × none，三子类按子类显式枚举
  - match: {data_type: bars, market: CN, asset_type: commodity-option, interval: P1D, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: index-option, interval: P1D, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  - match: {data_type: bars, market: CN, asset_type: etf-option, interval: P1D, adjust: none, variant: tqsdk}
    operation: get_kline_serial
  # 实时快照：全部资产类型调用同一上游接口 api.get_quote；
  # 周期/复权对快照无意义，显式声明 null（只与无该维度的 quote 查询匹配）
  - match: {data_type: quotes, market: CN, asset_type: contract, interval: null, adjust: null, variant: tqsdk}
    operation: get_quote
  - match: {data_type: quotes, market: CN, asset_type: continuous, interval: null, adjust: null, variant: tqsdk}
