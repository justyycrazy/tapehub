# Twelve Data 适配器：能力声明与内部操作映射。
# 接口签名均已按官方文档核实：https://twelvedata.com/docs/
#
# 说明：
# - 官方 Python 库 twelvedata-python（PyPI 包名 twelvedata）：
#   TDClient(apikey=...) → td.time_series(symbol, interval, outputsize,
#   start_date, end_date).as_json()；
# - 标的代码约定（本网关标准格式）：
#   外汇 GLOBAL-OTC-EUR/USD → symbol "EUR/USD"（ISO 4217，斜杠分隔）；
#   加密货币 GLOBAL-CRYPTO-BTC/USD → symbol "BTC/USD"（聚合对，
#   交易所专属对暂不支持）；
# - interval 枚举 1min/5min/15min/30min/45min/1h/2h/4h/8h/1day/1week/1month，
#   本适配器声明全部 12 个周期（45min/2h/4h/8h 经数据探针实测可用后补充声明，
#   报告 20261104T061857Z）；
# - datetime 墙钟口径按资产类型区分（2026-11-04 实测 + 官方文档
#   https://twelvedata.com/exchanges/physical_currency|digital_currency）：
#   外汇按 Australia/Sydney（AEDT/AEST 随夏令时切换）、加密货币按 UTC；
#   start_date/end_date 格式 YYYY-MM-DD 或 YYYY-MM-DDTHH:MM:SS（无时区
#   后缀，按同口径解释），适配器负责北京时间 ↔ 上游墙钟的双向转换；
#   另实测发现外汇 1h 与 1day 数据源不一致（1h 无法聚合还原 1day OHLC），
#   需要日线时应直接请求 P1D；outputsize 上限 5000，
#   采用覆盖判定：返回数量达上限且最早一根晚于请求 start 时标记 partial=true；
# - 外汇/加密货币通常无 volume 字段：标准 volume 为 null（能力 fields
#   不含 volume）；无复权概念，adjust 仅声明 none；
# - 响应 values 默认倒序（最新在前），由共享分页组件统一升序排序；
# - 历史覆盖范围（history.start）由全量深度探针实测回填（报告 20261104T072650Z、
#   20261104T084302Z，人工确认）：日内周期 forex ≈2020-01-31~04-08、crypto
#   ≈2020-01-07~04-07（粒度 90 天，approx，回填值取估计日零点）；forex P1D/P1W/P1M
#   触底 2000-01-01（真实更早、待精化）；crypto 日/周 ≈2017-08-29、月 ≈2017-08-02；
# - 区间无数据行为（2026-11-04 探针实测核实，报告 20261104T065529Z）：上游返回
#   400 BadRequestError "No data is available on the specified dates" 而非空列表，
#   适配器按指纹归一化为空结果；其余未核实异常统一由应用层包装为 UPSTREAM_ERROR；
# - 实时快照（REST /quote 同步应答，官方库调用形态 td.quote(symbol,
#   interval, timezone, eod).as_json()）：按需请求路径——无订阅语义、无长
#   连接、无流式（SSE 流请求返回 UNSUPPORTED_CAPABILITY）；interval 固定
#   传 1day（volume 即当日累计，与快照口径对齐），timezone 显式传 UTC
#   （datetime 字段口径固定，行情时间以 last_quote_at Unix 秒为准，
#   2026-11-05 探针实测其≈墙钟实时）；实测 quote 响应均未返回 volume
#   与 currency/mic_code（报告 20261105T184934+0800，人工确认）；
#   extensions 白名单 9 个标量字段已按该报告回填；
# - 单接口 Provider：变体与 default_variant 均为 twelvedata（数据源即上游服务自身，与东方财富无关）：缺省请求即可路由，也可显式传 variant=twelvedata。
provider: twelvedata
default_provider: [forex, crypto]
default_variant: twelvedata
enabled: true

capabilities:
  # 外汇（OTC 聚合报价）
  - data_type: bars
    markets: [GLOBAL]
    asset_types: [forex]
    delivery: [rest]
    variants: [twelvedata]
    intervals:
      - {code: PT1M, history: {start: 2020-04-08T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2020-03-19T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2020-01-31T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2020-01-31T00:00:00+08:00, end: null}}
      - {code: PT45M, history: {start: 2020-01-31T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2020-01-31T00:00:00+08:00, end: null}}
      - {code: PT2H, history: {start: 2020-01-31T00:00:00+08:00, end: null}}
      - {code: PT4H, history: {start: 2020-01-31T00:00:00+08:00, end: null}}
      - {code: PT8H, history: {start: 2020-01-31T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close]

  # 加密货币（聚合对）
  - data_type: bars
    markets: [GLOBAL]
    asset_types: [crypto]
    delivery: [rest]
    variants: [twelvedata]
    intervals:
      - {code: PT1M, history: {start: 2020-04-07T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2020-03-25T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2020-02-19T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2020-01-07T00:00:00+08:00, end: null}}
      - {code: PT45M, history: {start: 2020-01-07T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2020-01-07T00:00:00+08:00, end: null}}
      - {code: PT2H, history: {start: 2020-01-07T00:00:00+08:00, end: null}}
      - {code: PT4H, history: {start: 2020-01-07T00:00:00+08:00, end: null}}
      - {code: PT8H, history: {start: 2020-01-07T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 2017-08-29T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2017-08-29T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2017-08-02T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close]

  # 实时快照：REST 按需查询，无周期/复权维度（两维度声明为空，路由与能力
  # 匹配跳过）；五档盘口/amount 上游无源字段恒 null；fields 声明以 2026-11-05
  # quote 探针实证为准（报告 20261105T184934+0800，人工确认）：forex/crypto
  # 响应均未返回 volume，故不声明（映射保留防御性处理，缺失 → null）
  - data_type: quotes
    markets: [GLOBAL]
    asset_types: [forex, crypto]
    delivery: [rest]
    variants: [twelvedata]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price]

operations:
  # 全部资产类型 × 周期组合都调用同一上游接口 td.time_series；
  # 显式枚举以保证能力目录与内部操作一一对应。
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT1M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT5M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT15M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT30M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT45M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT1H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT2H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT4H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT8H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: P1D, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: P1W, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: P1M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT1M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT5M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT15M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT30M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT45M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT1H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT2H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT4H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT8H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: P1D, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: P1W, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: P1M, adjust: none, variant: twelvedata}
    operation: time_series
  # 实时快照：全部资产类型调用同一上游接口 td.quote；
  # 周期/复权对快照无意义，显式声明 null（只与无该维度的 quote 查询匹配）
  - match: {data_type: quotes, market: GLOBAL, asset_type: forex, interval: null, adjust: null, variant: twelvedata}
    operation: quote
  - match: {data_type: quotes, market: GLOBAL, asset_type: crypto, interval: null, adjust: null, variant: twelvedata}
    operation: quote
