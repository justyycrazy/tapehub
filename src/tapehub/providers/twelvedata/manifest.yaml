    operation: time_series
  # 美股 ETF：仅 none（上游默认 splits，none 必须显式传参）
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT1M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT5M, adjust: none, variant: twelvedata}
