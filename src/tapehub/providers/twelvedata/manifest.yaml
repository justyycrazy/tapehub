    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: none, variant: twelvedata}
    operation: time_series
  # 美股 ETF：qfq → 上游 adjust=all，显式传参
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT1M, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT5M, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT15M, adjust: qfq, variant: twelvedata}
