    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT4H, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT8H, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1D, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1W, adjust: qfq, variant: twelvedata}
    operation: time_series
