  - match: {data_type: bars, market: US, asset_type: etf, interval: PT30M, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT45M, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT1H, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT2H, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT4H, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT8H, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1D, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1W, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: P1M, adjust: qfq, variant: twelvedata}
    operation: time_series
  # 美股 ETF：仅 none（上游默认 splits，none 必须显式传参）
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT1M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: etf, interval: PT5M, adjust: none, variant: twelvedata}
    operation: time_series
