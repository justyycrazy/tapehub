# Twelve Data（twelvedata）能力声明与内部操作映射。
# 映射细则、上游行为定案与历史覆盖依据：docs/providers/twelvedata.md（唯一出处，本文不复述）。
# 官方文档：https://twelvedata.com/docs/
provider: twelvedata
default_variant: twelvedata

capabilities:
  # 外汇（OTC 聚合报价）。
  # history.start 统一口径（2026-11-17 人工定案，见 docs）：实测早于
  # 2000-01-01 的深库统一按 2000-01-01 声明（P1W/P1M），其余取实测估计
  # 月份的 1 日零点（月首对齐）
  - data_type: bars
    markets: [GLOBAL]
    asset_types: [forex]
    delivery: [rest]
    variants: [twelvedata]
    intervals:
      - {code: PT1M, history: {start: 2020-04-01T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2020-03-01T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT45M, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT2H, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT4H, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT8H, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 2003-12-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close]

  # 加密货币（聚合对）。
  # history.start 统一口径（2026-11-17 人工定案，见 docs）：实测早于
  # 2020-01-01 的统一按 2020-01-01 声明（P1D/P1W/P1M），其余取实测估计
  # 月份的 1 日零点（月首对齐）
  - data_type: bars
    markets: [GLOBAL]
    asset_types: [crypto]
    delivery: [rest]
    variants: [twelvedata]
    intervals:
      - {code: PT1M, history: {start: 2020-04-01T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2020-03-01T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2020-02-01T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT45M, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT2H, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT4H, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: PT8H, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2020-01-01T00:00:00+08:00, end: null}}
    adjustments: [none]
    fields: [open, high, low, close]

  # 美股个股：exchange 段白名单 NYSE/NASDAQ/CBOE；qfq = 上游 adjust=all；volume 有值、amount 恒 null。
  # history.start 统一口径（2026-11-17 人工定案，见 docs）：实测早于
  # 2000-01-01 的深库统一按 2000-01-01 声明（P1D/P1W/P1M；1981-01-18 系
  # 旧 AAPL 基准估计、GE 换基准后待下轮 depth 复探），其余月首对齐
  - data_type: bars
    markets: [US]
    asset_types: [stock]
    delivery: [rest]
    variants: [twelvedata]
    intervals:
      - {code: PT1M, history: {start: 2020-04-01T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2020-02-01T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2019-11-01T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2019-11-01T00:00:00+08:00, end: null}}
      - {code: PT45M, history: {start: 2019-11-01T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2019-02-01T00:00:00+08:00, end: null}}
      - {code: PT2H, history: {start: 2019-07-01T00:00:00+08:00, end: null}}
      - {code: PT4H, history: {start: 2019-07-01T00:00:00+08:00, end: null}}
      - {code: PT8H, history: {start: 2019-07-01T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
    adjustments: [none, qfq]
    fields: [open, high, low, close, volume]

  # 美股 ETF：qfq = 上游 adjust=all（复权生效），hfq 上游无等价物不声明。
  # history.start 统一口径（2026-11-17 人工定案，见 docs）：实测早于
  # 2000-01-01 的深库统一按 2000-01-01 声明（P1D/P1W/P1M），其余月首对齐
  - data_type: bars
    markets: [US]
    asset_types: [etf]
    delivery: [rest]
    variants: [twelvedata]
    intervals:
      - {code: PT1M, history: {start: 2020-04-01T00:00:00+08:00, end: null}}
      - {code: PT5M, history: {start: 2020-02-01T00:00:00+08:00, end: null}}
      - {code: PT15M, history: {start: 2020-02-01T00:00:00+08:00, end: null}}
      - {code: PT30M, history: {start: 2020-02-01T00:00:00+08:00, end: null}}
      - {code: PT45M, history: {start: 2020-02-01T00:00:00+08:00, end: null}}
      - {code: PT1H, history: {start: 2020-02-01T00:00:00+08:00, end: null}}
      - {code: PT2H, history: {start: 2020-02-01T00:00:00+08:00, end: null}}
      - {code: PT4H, history: {start: 2020-02-01T00:00:00+08:00, end: null}}
      - {code: PT8H, history: {start: 2020-02-01T00:00:00+08:00, end: null}}
      - {code: P1D, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 2000-01-01T00:00:00+08:00, end: null}}
    adjustments: [none, qfq]
    fields: [open, high, low, close, volume]

  # 实时快照与快照流（WS 订阅推送，M2 缓存读取 + M3 SSE 同源）：无周期/复权维度，fields 仅 timestamp + last_price
  - data_type: quotes
    markets: [GLOBAL]
    asset_types: [forex, crypto]
    delivery: [rest]
    variants: [twelvedata]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price]

operations:
  # 全部资产类型 × 周期组合都调用同一上游接口 td.time_series。
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT1M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT5M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT15M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT30M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT45M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT1H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT2H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT4H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: PT8H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: P1D, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: P1W, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: forex, interval: P1M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT1M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT5M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT15M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT30M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT45M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT1H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT2H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT4H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: PT8H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: P1D, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: P1W, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: GLOBAL, asset_type: crypto, interval: P1M, adjust: none, variant: twelvedata}
    operation: time_series
  # 美股个股：同一上游接口 td.time_series，显式传 exchange 与 adjust
  # （qfq→all / none→none，见 request_mapper）
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT1M, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT5M, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT15M, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT30M, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT45M, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT1H, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT2H, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT4H, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT8H, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1D, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: qfq, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT1M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT5M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT15M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT30M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT45M, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT1H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT2H, adjust: none, variant: twelvedata}
    operation: time_series
  - match: {data_type: bars, market: US, asset_type: stock, interval: PT4H, adjust: none, variant: twelvedata}
    operation: time_series
