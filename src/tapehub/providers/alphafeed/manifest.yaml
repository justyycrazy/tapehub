# AlphaFeed（alphafeed）能力声明与内部操作映射。
# 映射细则、上游行为定案与历史覆盖依据：docs/providers/alphafeed.md（唯一出处，本文不复述）。
# 官方文档：https://docs.alphafeed.org/zh-hans/
# 探针运行记录：probes/results/PROBE_LOG.md（本地文件，不入库）。
provider: alphafeed
default_variant: alphafeed

capabilities:
  - data_type: bars
    markets: [CN]
    asset_types: [stock]
    delivery: [rest]
    variants: [alphafeed]
    intervals:
      - {code: P1D, history: {start: 1991-01-14T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1991-01-14T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1991-01-14T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]
  # 指数：与 stock 共用统一 klines 端点（探针 2026-11-15 第 7/8 轮直测
  # 000001.SH 日/周/月均有数）；复权对指数无意义仅声明 none（baostock/
  # tushare 先例同口径）；history 未核实保持 null（chain 二分后回填）
  - data_type: bars
    markets: [CN]
    asset_types: [index]
    delivery: [rest]
    variants: [alphafeed]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none]
    fields: [open, high, low, close, volume, amount]
  # ETF：与 stock 共用统一 klines 端点（探针直测 510050.SH 日/周/月均有数）；
  # 复权生效经目录外诊断实证（forward vs none 全窗差异，与 tickflow 侧互证）；
  # 量额与股票日线同口径原值透出（与 tushare 同窗互证：vol 手/amount 元）；
  # history 未核实保持 null
  - data_type: bars
    markets: [CN]
    asset_types: [etf]
    delivery: [rest]
    variants: [alphafeed]
    intervals:
      - {code: P1D, history: {start: null, end: null}}
      - {code: P1W, history: {start: null, end: null}}
      - {code: P1M, history: {start: null, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]
  - data_type: bars
    markets: [HK]
    asset_types: [stock]
    delivery: [rest]
    variants: [alphafeed]
    intervals:
      - {code: P1D, history: {start: 1980-02-15T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1980-02-15T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1980-02-15T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]
  - data_type: bars
    markets: [US]
    asset_types: [stock]
    delivery: [rest]
    variants: [alphafeed]
    intervals:
      - {code: P1D, history: {start: 1962-02-17T00:00:00+08:00, end: null}}
      - {code: P1W, history: {start: 1962-02-17T00:00:00+08:00, end: null}}
      - {code: P1M, history: {start: 1962-02-17T00:00:00+08:00, end: null}}
    adjustments: [none, qfq, hfq]
    fields: [open, high, low, close, volume, amount]

  # 实时快照：快照是当前时点订阅数据，interval/adjust 维度无意义，显式空。
  - data_type: quotes
    markets: [CN, HK, US]
    asset_types: [stock]
    delivery: [rest]
    variants: [alphafeed]
    intervals: []
    adjustments: []
    fields: [timestamp, last_price, volume, amount]

operations:
  # 全部周期 × 复权 × 市场组合都调用同一上游接口 af.klines.get。
  # —— CN ——
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1D, adjust: hfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1W, adjust: hfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: stock, interval: P1M, adjust: hfq, variant: alphafeed}
    operation: klines
  # —— CN 指数：三周期 × 仅 none（指数无复权）——
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1D, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1W, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: index, interval: P1M, adjust: none, variant: alphafeed}
    operation: klines
  # —— CN ETF：三周期 × 三复权（复权生效经目录外诊断实证）——
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1D, adjust: hfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1W, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1W, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1W, adjust: hfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1M, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1M, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: CN, asset_type: etf, interval: P1M, adjust: hfq, variant: alphafeed}
    operation: klines
  # —— HK ——
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1D, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1D, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1D, adjust: hfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1W, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1W, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1W, adjust: hfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1M, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1M, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: HK, asset_type: stock, interval: P1M, adjust: hfq, variant: alphafeed}
    operation: klines
  # —— US ——
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1D, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1D, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1D, adjust: hfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1W, adjust: hfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: none, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: qfq, variant: alphafeed}
    operation: klines
  - match: {data_type: bars, market: US, asset_type: stock, interval: P1M, adjust: hfq, variant: alphafeed}
    operation: klines
  # —— quotes：快照无周期/复权维度，match 显式 null ——
  - match: {data_type: quotes, market: CN, asset_type: stock, interval: null, adjust: null, variant: alphafeed}
    operation: quotes
  - match: {data_type: quotes, market: HK, asset_type: stock, interval: null, adjust: null, variant: alphafeed}
    operation: quotes
  - match: {data_type: quotes, market: US, asset_type: stock, interval: null, adjust: null, variant: alphafeed}
    operation: quotes
